name: Apply six degree vessel body

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-six-dof-body.mjs
      - .github/workflows/apply-six-dof-body.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-six-degree-vessel-body
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Transform, validate, and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply six-degree body refactor
        run: node scripts/apply-six-dof-body.mjs

      - name: Validate repository
        run: npm run validate

      - name: Remove one-time migration tooling
        run: |
          rm -f scripts/apply-six-dof-body.mjs
          rm -f .github/workflows/apply-six-dof-body.yml

      - name: Commit validated body model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No six-degree body changes to commit."
            exit 0
          fi
          git commit -m "feat: add distributed buoyancy and six degree vessel motion"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
