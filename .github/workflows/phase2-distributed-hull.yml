name: Apply distributed hull integration

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - '.github/workflows/phase2-distributed-hull.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: phase2-distributed-hull
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate and validate distributed hull forces
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Integrate distributed hull model into Boat
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, search, replacement, label) {
            if (!source.includes(search)) {
              throw new Error(`Unable to find ${label}`);
            }
            return source.replace(search, replacement);
          }

          function replaceSection(source, startMarker, endMarker, replacement, label) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0 || end <= start) {
              throw new Error(`Unable to find section ${label}`);
            }
            return source.slice(0, start) + replacement + source.slice(end);
          }

          const boatPath = 'components/Boat.tsx';
          let boat = fs.readFileSync(boatPath, 'utf8');

          boat = replaceOnce(
            boat,
            "import { getVesselConfig } from '@/sim/vessels/VesselConfig';",
            "import { getVesselConfig } from '@/sim/vessels/VesselConfig';\nimport { DistributedHullForces } from '@/sim/vessels/DistributedHullForces';",
            'DistributedHullForces import',
          );

          boat = replaceSection(
            boat,
            'function applyBuoyancyAtPoint(',
            'export default function Boat() {',
            '',
            'legacy four-point buoyancy helper',
          );

          boat = replaceOnce(
            boat,
            '  const simulationRandom = useRef(new SeededRandom(0xb0475eed));',
            '  const simulationRandom = useRef(new SeededRandom(0xb0475eed));\n  const distributedHullForces = useRef(new DistributedHullForces());',
            'distributed hull force ref',
          );

          const staleScratchLines = [
            '      fwdVec: new Vector3(),\n',
            '      rgtVec: new Vector3(),\n',
            '      cornerFR: new Vector3(),\n',
            '      cornerFL: new Vector3(),\n',
            '      cornerBR: new Vector3(),\n',
            '      cornerBL: new Vector3(),\n',
            '      dragForceForward: new Vector3(),\n',
            '      dragForceRight: new Vector3(),\n',
            '      totalForce: new Vector3(),\n',
            '      buoyancyForce: new Vector3(),\n',
            '      pointVelocity: new Vector3(),\n',
            '      pointFR: new Vector3(),\n',
            '      pointFL: new Vector3(),\n',
            '      pointBR: new Vector3(),\n',
            '      pointBL: new Vector3(),\n',
            '      pFR: { x: 0, y: 0, z: 0 },\n',
            '      pFL: { x: 0, y: 0, z: 0 },\n',
            '      pBR: { x: 0, y: 0, z: 0 },\n',
            '      pBL: { x: 0, y: 0, z: 0 },\n',
          ];
          for (const line of staleScratchLines) {
            boat = replaceOnce(boat, line, '', `stale scratch field ${line.trim()}`);
          }

          boat = replaceOnce(
            boat,
            '    const dragCoeff = vessel.forwardDragCoefficient;\n    const keelDragMultiplier = vessel.keelDragMultiplier;\n',
            '',
            'legacy global drag configuration',
          );

          const distributedHullBlock = `    // --- Distributed Hull Buoyancy & Hydrodynamic Resistance ---
            const pos = body.position;
            const halfL = vessel.halfLengthM;
            const halfW = vessel.halfWidthM;

            const windRad = MathUtils.degToRad(windDir);
            const windVelocity = scratch.windVelocity
              .set(Math.sin(windRad), 0, Math.cos(windRad))
              .multiplyScalar(windSpeed);

            const currentRad = MathUtils.degToRad(currentDir);
            const waterVelocity = scratch.waterVelocity
              .set(Math.sin(currentRad), 0, Math.cos(currentRad))
              .multiplyScalar(currentSpeed);

            // Recreate the localized ice field used by the ocean shader.
            const isWinter = Math.max(
              0,
              Math.min(
                1,
                1 - Math.abs(sharedPhysics.season - 0.75) * 4,
              ),
            );
            const iceNoise =
              Math.sin(pos.x * 0.01) * Math.cos(pos.z * 0.01) +
              Math.sin(pos.x * 0.05 + pos.z * 0.04) * 0.5;
            const currentIceFactor = Math.max(
              0,
              Math.min(
                1,
                (iceNoise * 0.3 + isWinter * 1.5 - 1) * 2,
              ),
            );

            let hullDamageSinkOffset =
              hullHealth.current < 50
                ? ((50 - hullHealth.current) / 50) * 0.6
                : 0;
            if (hullHealth.current <= 0) {
              hullDamageSinkOffset += 1.5;
            }

            const winterDraftPenalty = isWinter * 0.15;
            const draftOffset =
              vessel.baseDraftM -
              hullDamageSinkOffset -
              winterDraftPenalty;
            const speedRatio = Math.min(
              Math.hypot(
                body.linearVelocity.x,
                body.linearVelocity.z,
              ) / vessel.planingReferenceSpeedMps,
              1,
            );
            const planingDragReduction = vessel.planingCapable
              ? MathUtils.lerp(1, 0.35, speedRatio * speedRatio)
              : 1;
            const hullDragPenalty =
              1 + ((100 - hullHealth.current) / 100) * 0.8;
            const buoyancyStiffness =
              vessel.buoyancyStiffness * (1 - isWinter * 0.1);

            const hullForceResult = distributedHullForces.current.apply({
              body,
              vessel,
              timeSeconds: time,
              waterVelocity,
              draftOffsetM: draftOffset,
              buoyancyStiffness,
              forwardDragMultiplier:
                planingDragReduction * hullDragPenalty,
              lateralDragMultiplier: hullDragPenalty,
              sampleWater: getWaveHeight,
            });
            const submergedRatio = hullForceResult.submergedRatio;

`;

          boat = replaceSection(
            boat,
            '    // --- Sample Gerstner Wave for Multi-Point Buoyancy & Physics ---',
            '    // --- PHASE 4: REFINED SLAM DAMAGE ---',
            distributedHullBlock,
            'four-point buoyancy block',
          );

          boat = replaceSection(
            boat,
            '    // --- Environmental Velocities ---',
            '    // --- True Velocity Relative to Water ---',
            '',
            'duplicate environmental velocity block',
          );

          boat = replaceOnce(
            boat,
            '    const vRelRight = waterRelativeVelocity.dot(rightDir);\n',
            '',
            'legacy center-point lateral velocity',
          );

          const planingBlock = `    // PLANING HYDRODYNAMICS
            // The speedboat receives bow lift once forward speed builds. Hull
            // resistance is already reduced inside the distributed point model.
            const planingFactor =
              speedRatio * speedRatio * submergedRatio;

`;
          boat = replaceSection(
            boat,
            '    // PLANING HYDRODYNAMICS',
            '    // --- ENGINE STRESS & RPM MODULATION ---',
            planingBlock,
            'legacy planing drag block',
          );

          boat = replaceSection(
            boat,
            '    // 2. Hydrodynamic Drag (Water Resistance - Drops to zero if boat jumps)',
            '    // DIRECTIONAL WIND CATCHING',
            '',
            'legacy center-of-mass hydrodynamic drag',
          );

          boat = replaceOnce(
            boat,
            '    body.addForce(\n      scratch.totalForce.copy(dragForceForward).add(dragForceRight),\n    );\n',
            '',
            'legacy aggregate drag application',
          );

          boat = replaceOnce(
            boat,
            '    body.linearVelocity.z = MathUtils.clamp(body.linearVelocity.z, -80, 80);\n',
            `    body.linearVelocity.z = MathUtils.clamp(body.linearVelocity.z, -80, 80);
            const maxAngularSpeed = vessel.maxAngularSpeedRadPerSecond;
            body.angularVelocity.set(
              MathUtils.clamp(
                body.angularVelocity.x,
                -maxAngularSpeed,
                maxAngularSpeed,
              ),
              MathUtils.clamp(
                body.angularVelocity.y,
                -maxAngularSpeed,
                maxAngularSpeed,
              ),
              MathUtils.clamp(
                body.angularVelocity.z,
                -maxAngularSpeed,
                maxAngularSpeed,
              ),
            );
`,
            'vessel angular safety clamp',
          );

          boat = replaceOnce(
            boat,
            '    let headingDeg = MathUtils.radToDeg(body.rotation.y) % 360;\n    if (headingDeg < 0) headingDeg += 360;\n',
            `    let headingDeg =
              MathUtils.radToDeg(
                Math.atan2(forwardDir.x, -forwardDir.z),
              ) % 360;
            if (headingDeg < 0) headingDeg += 360;
`,
            'quaternion-safe heading calculation',
          );

          fs.writeFileSync(boatPath, boat);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run validate

      - name: Remove one-time workflow
        run: rm -f .github/workflows/phase2-distributed-hull.yml

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Boat.tsx .github/workflows/phase2-distributed-hull.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "physics: integrate distributed hull forces"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
