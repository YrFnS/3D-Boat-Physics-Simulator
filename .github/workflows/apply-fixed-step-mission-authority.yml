name: Apply fixed-step mission authority

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: fixed-step-mission-authority
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply fixed-step mission and static-menu authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:160]!r}'
                  )
              write(path, source.replace(old, new, 1))

          def replace_section(
              path: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              source = read(path)
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              write(path, source[:start] + replacement + source[end:])

          mission_runtime = dedent(r'''
            export interface MissionRuntimeStatisticsStep {
              runId: number;
              vesselGeneration: number;
              enabled: boolean;
              deltaSeconds: number;
              boatX: number;
              boatZ: number;
              speedKnots: number;
            }

            export interface MissionRuntimeStatisticsSnapshot {
              runId: number;
              vesselGeneration: number;
              elapsedSeconds: number;
              distanceTravelledM: number;
              maximumSpeedKnots: number;
              fixedStepCount: number;
            }

            export const DEFAULT_MAXIMUM_MISSION_SAMPLE_DISTANCE_M = 60;

            function normalizeIdentity(value: number) {
              return Number.isFinite(value) ? Math.trunc(value) : -1;
            }

            /**
             * Fixed-step authority for scored mission time and travelled distance.
             *
             * The tracker is shared across vessel remounts. A new scenario run
             * resets every statistic, while a vessel recovery generation only
             * reanchors the position sample so a teleport cannot become distance.
             * Disabled steps also reanchor without advancing mission time, which
             * keeps free-navigation and non-running frames out of scored results.
             */
            export class MissionRuntimeStatistics {
              private readonly state: MissionRuntimeStatisticsSnapshot = {
                runId: -1,
                vesselGeneration: -1,
                elapsedSeconds: 0,
                distanceTravelledM: 0,
                maximumSpeedKnots: 0,
                fixedStepCount: 0,
              };
              private previousBoatX = 0;
              private previousBoatZ = 0;
              private hasPreviousPosition = false;
              readonly maximumSampleDistanceM: number;

              constructor(
                maximumSampleDistanceM =
                  DEFAULT_MAXIMUM_MISSION_SAMPLE_DISTANCE_M,
              ) {
                this.maximumSampleDistanceM =
                  Number.isFinite(maximumSampleDistanceM) &&
                  maximumSampleDistanceM > 0
                    ? maximumSampleDistanceM
                    : DEFAULT_MAXIMUM_MISSION_SAMPLE_DISTANCE_M;
              }

              get snapshot(): Readonly<MissionRuntimeStatisticsSnapshot> {
                return this.state;
              }

              reset(
                runId = -1,
                vesselGeneration = -1,
                boatX = Number.NaN,
                boatZ = Number.NaN,
              ) {
                this.state.runId = normalizeIdentity(runId);
                this.state.vesselGeneration =
                  normalizeIdentity(vesselGeneration);
                this.state.elapsedSeconds = 0;
                this.state.distanceTravelledM = 0;
                this.state.maximumSpeedKnots = 0;
                this.state.fixedStepCount = 0;
                this.reanchor(boatX, boatZ);
                return this.state;
              }

              advance(
                step: MissionRuntimeStatisticsStep,
              ): Readonly<MissionRuntimeStatisticsSnapshot> {
                const runId = normalizeIdentity(step.runId);
                const vesselGeneration = normalizeIdentity(
                  step.vesselGeneration,
                );

                if (this.state.runId !== runId) {
                  this.reset(
                    runId,
                    vesselGeneration,
                    step.boatX,
                    step.boatZ,
                  );
                } else if (
                  this.state.vesselGeneration !== vesselGeneration
                ) {
                  this.state.vesselGeneration = vesselGeneration;
                  this.reanchor(step.boatX, step.boatZ);
                }

                const deltaSeconds = Number.isFinite(step.deltaSeconds)
                  ? Math.max(0, step.deltaSeconds)
                  : 0;
                if (!step.enabled || deltaSeconds <= 0) {
                  this.reanchor(step.boatX, step.boatZ);
                  return this.state;
                }

                this.state.elapsedSeconds += deltaSeconds;
                this.state.fixedStepCount += 1;
                if (Number.isFinite(step.speedKnots)) {
                  this.state.maximumSpeedKnots = Math.max(
                    this.state.maximumSpeedKnots,
                    Math.abs(step.speedKnots),
                  );
                }

                if (
                  Number.isFinite(step.boatX) &&
                  Number.isFinite(step.boatZ)
                ) {
                  if (this.hasPreviousPosition) {
                    const sampleDistanceM = Math.hypot(
                      step.boatX - this.previousBoatX,
                      step.boatZ - this.previousBoatZ,
                    );
                    if (
                      Number.isFinite(sampleDistanceM) &&
                      sampleDistanceM <= this.maximumSampleDistanceM
                    ) {
                      this.state.distanceTravelledM += sampleDistanceM;
                    }
                  }
                  this.previousBoatX = step.boatX;
                  this.previousBoatZ = step.boatZ;
                  this.hasPreviousPosition = true;
                } else {
                  this.hasPreviousPosition = false;
                }

                return this.state;
              }

              private reanchor(boatX: number, boatZ: number) {
                if (Number.isFinite(boatX) && Number.isFinite(boatZ)) {
                  this.previousBoatX = boatX;
                  this.previousBoatZ = boatZ;
                  this.hasPreviousPosition = true;
                } else {
                  this.hasPreviousPosition = false;
                }
              }
            }

            /** Shared authority survives Boat remounts caused by recovery. */
            export const sharedMissionRuntimeStatistics =
              new MissionRuntimeStatistics();
          ''').lstrip()
          write(
              'sim/scenarios/MissionRuntimeStatistics.ts',
              mission_runtime,
          )

          mission_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              MissionRuntimeStatistics,
            } from '../sim/scenarios/MissionRuntimeStatistics.ts';

            const EPSILON = 1e-9;
            const STEP_SECONDS = 1 / 60;

            function approximatelyEqual(actual, expected, message) {
              assert.ok(
                Math.abs(actual - expected) <= EPSILON,
                `${message}: expected ${expected}, received ${actual}`,
              );
            }

            function capture(tracker) {
              return { ...tracker.snapshot };
            }

            const tracker = new MissionRuntimeStatistics(5);
            tracker.advance({
              runId: 1,
              vesselGeneration: 10,
              enabled: true,
              deltaSeconds: 0,
              boatX: 0,
              boatZ: 0,
              speedKnots: 0,
            });

            for (let step = 1; step <= 60; step += 1) {
              tracker.advance({
                runId: 1,
                vesselGeneration: 10,
                enabled: true,
                deltaSeconds: STEP_SECONDS,
                boatX: step / 60,
                boatZ: 0,
                speedKnots: step === 40 ? 14 : 8,
              });
            }

            let snapshot = capture(tracker);
            approximatelyEqual(snapshot.elapsedSeconds, 1, 'fixed-step elapsed time');
            approximatelyEqual(snapshot.distanceTravelledM, 1, 'fixed-step distance');
            assert.equal(snapshot.maximumSpeedKnots, 14);
            assert.equal(snapshot.fixedStepCount, 60);

            const beforeDisabled = capture(tracker);
            tracker.advance({
              runId: 1,
              vesselGeneration: 10,
              enabled: false,
              deltaSeconds: 4,
              boatX: 25,
              boatZ: -12,
              speedKnots: 40,
            });
            snapshot = capture(tracker);
            assert.deepEqual(
              snapshot,
              beforeDisabled,
              'Disabled/menu/free-navigation frames must not alter scored statistics.',
            );

            tracker.advance({
              runId: 1,
              vesselGeneration: 10,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: 25 + 1 / 60,
              boatZ: -12,
              speedKnots: 7,
            });
            snapshot = capture(tracker);
            approximatelyEqual(
              snapshot.elapsedSeconds,
              beforeDisabled.elapsedSeconds + STEP_SECONDS,
              'resumed elapsed time',
            );
            approximatelyEqual(
              snapshot.distanceTravelledM,
              beforeDisabled.distanceTravelledM + 1 / 60,
              'disabled interval must reanchor distance',
            );

            const beforeRecovery = capture(tracker);
            tracker.advance({
              runId: 1,
              vesselGeneration: 11,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: -120,
              boatZ: 80,
              speedKnots: 6,
            });
            snapshot = capture(tracker);
            approximatelyEqual(
              snapshot.distanceTravelledM,
              beforeRecovery.distanceTravelledM,
              'vessel recovery teleport must not add distance',
            );
            approximatelyEqual(
              snapshot.elapsedSeconds,
              beforeRecovery.elapsedSeconds + STEP_SECONDS,
              'vessel recovery must not reset mission time',
            );

            tracker.advance({
              runId: 1,
              vesselGeneration: 11,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: -119,
              boatZ: 80,
              speedKnots: 6,
            });
            snapshot = capture(tracker);
            approximatelyEqual(
              snapshot.distanceTravelledM,
              beforeRecovery.distanceTravelledM + 1,
              'post-recovery movement must resume distance accumulation',
            );

            const beforeOutlier = capture(tracker);
            tracker.advance({
              runId: 1,
              vesselGeneration: 11,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: 500,
              boatZ: 500,
              speedKnots: 6,
            });
            snapshot = capture(tracker);
            approximatelyEqual(
              snapshot.distanceTravelledM,
              beforeOutlier.distanceTravelledM,
              'an unannounced outlier sample must be rejected',
            );

            tracker.advance({
              runId: 2,
              vesselGeneration: 12,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: 0,
              boatZ: 0,
              speedKnots: 5,
            });
            snapshot = capture(tracker);
            assert.equal(snapshot.runId, 2);
            assert.equal(snapshot.vesselGeneration, 12);
            approximatelyEqual(snapshot.elapsedSeconds, STEP_SECONDS, 'new-run elapsed time');
            approximatelyEqual(snapshot.distanceTravelledM, 0, 'new-run distance reset');
            assert.equal(snapshot.maximumSpeedKnots, 5);
            assert.equal(snapshot.fixedStepCount, 1);

            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const directorSource = await fs.readFile(
              new URL('../components/ScenarioDirector.tsx', import.meta.url),
              'utf8',
            );

            assert.match(
              boatSource,
              /sharedMissionRuntimeStatistics\.advance\(\{/,
              'Boat fixed steps must advance the shared mission authority.',
            );
            assert.match(
              boatSource,
              /useNavigationPlanner\.getState\(\)\.mode === 'mission'/,
              'Only mission navigation may advance scored statistics.',
            );
            assert.match(
              directorSource,
              /sharedMissionRuntimeStatistics\.snapshot/,
              'ScenarioDirector must read fixed-step mission statistics.',
            );
            assert.doesNotMatch(
              directorSource,
              /statistics\.elapsedSeconds \+= frameDelta/,
              'ScenarioDirector must not accumulate elapsed time from render delta.',
            );
            assert.doesNotMatch(
              directorSource,
              /previousBoat[ZX]/,
              'ScenarioDirector must not integrate travelled distance from render samples.',
            );

            console.log('Mission runtime statistics contract passed.');
          ''').lstrip()
          write(
              'scripts/mission-runtime-statistics-contract.mjs',
              mission_contract,
          )

          # Central running-state authority and explicit static menu semantics.
          replace_once(
              'sim/core/SimulationRuntimeAuthority.ts',
              "  if (sessionPhase === 'paused') return 'never';\n  return 'demand';\n}\n\n/** Vessel controls and recovery actions require both a running session and the\n",
              "  if (sessionPhase === 'paused') return 'never';\n\n  // The launch menu is intentionally a demand-rendered static preview. UI or\n  // scenario changes may invalidate one frame, but authoritative clocks and\n  // physics are independently gated and cannot advance in that frame.\n  return 'demand';\n}\n\nexport function canAdvanceAuthoritativeSimulation(\n  sessionPhase: RuntimeSessionPhase,\n) {\n  return sessionPhase === 'running';\n}\n\n/** Vessel controls and recovery actions require both a running session and the\n",
          )

          replace_once(
              'scripts/runtime-authority-contract.mjs',
              "  canAcceptVesselInput,\n  resolveSimulatorFrameLoop,\n",
              "  canAcceptVesselInput,\n  canAdvanceAuthoritativeSimulation,\n  resolveSimulatorFrameLoop,\n",
          )
          replace_once(
              'scripts/runtime-authority-contract.mjs',
              "for (const testCase of frameLoopCases) {\n  assert.equal(\n    resolveSimulatorFrameLoop(testCase.input),\n    testCase.expected,\n    testCase.label,\n  );\n}\n\nassert.equal(\n",
              "for (const testCase of frameLoopCases) {\n  assert.equal(\n    resolveSimulatorFrameLoop(testCase.input),\n    testCase.expected,\n    testCase.label,\n  );\n}\n\nassert.equal(canAdvanceAuthoritativeSimulation('running'), true);\nassert.equal(canAdvanceAuthoritativeSimulation('paused'), false);\nassert.equal(canAdvanceAuthoritativeSimulation('menu'), false);\n\nassert.equal(\n",
          )
          replace_once(
              'scripts/runtime-authority-contract.mjs',
              "assert.match(\n  releaseValidationSource,\n  /waitForDataset\\(page, 'simWebglContextMonitorReady', '1'\\)/,\n  'Release validation must wait for the recovery listener before dispatching context loss.',\n);\n\nconsole.log('Runtime authority contract passed.');\n",
              "assert.match(\n  releaseValidationSource,\n  /waitForDataset\\(page, 'simWebglContextMonitorReady', '1'\\)/,\n  'Release validation must wait for the recovery listener before dispatching context loss.',\n);\n\nconst staticPreviewSources = await Promise.all(\n  [\n    '../components/Boat.tsx',\n    '../components/EnvironmentRig.tsx',\n    '../components/WeatherEffects.tsx',\n    '../components/HurricaneClouds.tsx',\n    '../components/Tornado.tsx',\n    '../components/WakeField.tsx',\n  ].map(async (sourcePath) => ({\n    sourcePath,\n    source: await fs.readFile(new URL(sourcePath, import.meta.url), 'utf8'),\n  })),\n);\nfor (const { sourcePath, source } of staticPreviewSources) {\n  assert.match(\n    source,\n    /canAdvanceAuthoritativeSimulation/,\n    `${sourcePath} must gate time-driven work behind running-state authority.`,\n  );\n}\nfor (const { sourcePath, source } of staticPreviewSources.filter(({ sourcePath }) =>\n  /HurricaneClouds|Tornado|WakeField/.test(sourcePath),\n)) {\n  assert.doesNotMatch(\n    source,\n    /state\\.clock\\.elapsedTime/,\n    `${sourcePath} must not animate from browser wall-clock time.`,\n  );\n}\n\nconsole.log('Runtime authority contract passed.');\n",
          )

          # Boat: stop simulation outside running state and publish fixed-step mission stats.
          replace_once(
              'components/Boat.tsx',
              "import { FixedStepRunner } from '@/sim/core/FixedStepRunner';\n",
              "import { FixedStepRunner } from '@/sim/core/FixedStepRunner';\nimport { canAdvanceAuthoritativeSimulation } from '@/sim/core/SimulationRuntimeAuthority';\n",
          )
          replace_once(
              'components/Boat.tsx',
              "import { RapierCollisionWorld } from '@/sim/collision/RapierCollisionWorld';\n",
              "import { RapierCollisionWorld } from '@/sim/collision/RapierCollisionWorld';\nimport { sharedMissionRuntimeStatistics } from '@/sim/scenarios/MissionRuntimeStatistics';\nimport { useNavigationPlanner } from '@/store/useNavigationPlanner';\n",
          )
          replace_once(
              'components/Boat.tsx',
              "      engineThrust,\n      activeBoat,\n      setTelemetry,\n",
              "      engineThrust,\n      activeBoat,\n      sessionPhase,\n      scenarioRunStatus,\n      scenarioRunId,\n      resetVesselTrigger,\n      setTelemetry,\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    const headingDeg = worldDirectionToHeadingDegrees(\n      forwardDir.x,\n      forwardDir.z,\n    );\n\n    const calibrationResult = calibration?.recordStep(time, {\n",
              "    const headingDeg = worldDirectionToHeadingDegrees(\n      forwardDir.x,\n      forwardDir.z,\n    );\n\n    if (!calibration) {\n      sharedMissionRuntimeStatistics.advance({\n        runId: scenarioRunId,\n        vesselGeneration: resetVesselTrigger,\n        enabled:\n          canAdvanceAuthoritativeSimulation(sessionPhase) &&\n          scenarioRunStatus === 'active' &&\n          useNavigationPlanner.getState().mode === 'mission',\n        deltaSeconds: dt,\n        boatX: body.position.x,\n        boatZ: body.position.z,\n        speedKnots,\n      });\n    }\n\n    const calibrationResult = calibration?.recordStep(time, {\n",
          )
          replace_once(
              'components/Boat.tsx',
              "  useFrame((state, delta) => {\n    const boat = boatRef.current;\n    if (!boat) return;\n\n    const calibration = calibrationRunner.current;\n    let stepResult;\n",
              "  useFrame((state, delta) => {\n    const boat = boatRef.current;\n    if (!boat) return;\n\n    const runtimeState = useSimStore.getState();\n    const simulationRunning = canAdvanceAuthoritativeSimulation(\n      runtimeState.sessionPhase,\n    );\n    const calibration = calibrationRunner.current;\n    let stepResult;\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    } else if (calibration) {\n      const stepSeconds = fixedStepRunner.current.stepSeconds;\n",
              "    } else if (calibration) {\n      const stepSeconds = fixedStepRunner.current.stepSeconds;\n",
          )
          replace_once(
              'components/Boat.tsx',
              "      stepResult = {\n        steps,\n        alpha: 1,\n        simulationTimeSeconds: calibrationSimulationTime.current,\n        droppedTimeSeconds: 0,\n      };\n    } else {\n      stepResult = fixedStepRunner.current.advance(\n",
              "      stepResult = {\n        steps,\n        alpha: 1,\n        simulationTimeSeconds: calibrationSimulationTime.current,\n        droppedTimeSeconds: 0,\n      };\n    } else if (!simulationRunning) {\n      stepResult = {\n        steps: 0,\n        alpha: 1,\n        simulationTimeSeconds:\n          fixedStepRunner.current.simulationTimeSeconds,\n        droppedTimeSeconds: fixedStepRunner.current.droppedTimeSeconds,\n      };\n    } else {\n      stepResult = fixedStepRunner.current.advance(\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    const renderDelta = Math.min(delta, 0.1);\n    const { windSpeed, windDir, activeBoat } = useSimStore.getState();\n",
              "    const renderDelta = simulationRunning\n      ? Math.min(delta, 0.1)\n      : 0;\n    const { windSpeed, windDir, activeBoat } = runtimeState;\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    if (!calibration) {\n      audio.updateFrame(\n",
              "    if (!calibration && simulationRunning) {\n      audio.updateFrame(\n",
          )

          # Environment: menu demand frames produce a static scenario preview.
          replace_once(
              'components/EnvironmentRig.tsx',
              "import {\n  WHIRLPOOL_BASIN_CENTER_X_M,\n",
              "import { canAdvanceAuthoritativeSimulation } from '@/sim/core/SimulationRuntimeAuthority';\nimport {\n  WHIRLPOOL_BASIN_CENTER_X_M,\n",
          )
          replace_once(
              'components/EnvironmentRig.tsx',
              "  useFrame((state, delta) => {\n    const safeDelta = Math.min(delta, 0.1);\n    const { camera } = state;\n    const store = useSimStore.getState();\n\n    let timeDifference = store.targetTime - sharedPhysics.worldTime;\n",
              "  useFrame((state, delta) => {\n    const authoritativeDelta = canAdvanceAuthoritativeSimulation(\n      useSimStore.getState().sessionPhase,\n    )\n      ? Math.min(delta, 0.1)\n      : 0;\n    const { camera } = state;\n    const store = useSimStore.getState();\n    const simulationRunning = canAdvanceAuthoritativeSimulation(\n      store.sessionPhase,\n    );\n\n    if (!simulationRunning) {\n      sharedPhysics.worldTime = store.targetTime;\n      sharedPhysics.season = store.targetSeason;\n    } else {\n      let timeDifference = store.targetTime - sharedPhysics.worldTime;\n",
          )
          replace_once(
              'components/EnvironmentRig.tsx',
              "    if (sharedPhysics.season < 0) sharedPhysics.season += 1;\n    if (sharedPhysics.season >= 1) sharedPhysics.season -= 1;\n\n    // The hazard clock advances only while frame callbacks are authorized.\n",
              "      if (sharedPhysics.season < 0) sharedPhysics.season += 1;\n      if (sharedPhysics.season >= 1) sharedPhysics.season -= 1;\n    }\n\n    // The world clock advances only during a running session. Menu demand\n    // frames can update a static scenario preview without moving hazards.\n",
          )
          environment_source = read('components/EnvironmentRig.tsx')
          environment_source = environment_source.replace(
              'safeDelta',
              'authoritativeDelta',
          )
          write('components/EnvironmentRig.tsx', environment_source)

          # Weather: freeze precipitation/lightning clocks and mute paused/menu audio.
          replace_once(
              'components/WeatherEffects.tsx',
              "import { setWorldXZFromHeading } from '@/sim/world/WorldDirection';\n",
              "import { canAdvanceAuthoritativeSimulation } from '@/sim/core/SimulationRuntimeAuthority';\nimport { setWorldXZFromHeading } from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "export default function WeatherEffects() {\n  const audioContextRef = useRef<AudioContext | null>(null);\n",
              "export default function WeatherEffects() {\n  const sessionPhase = useSimStore((state) => state.sessionPhase);\n  const audioContextRef = useRef<AudioContext | null>(null);\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "  useFrame((state, delta) => {\n    const safeDelta = Math.min(delta, 0.1);\n    const { windSpeed, windDir, renderQuality } = useSimStore.getState();\n",
              "  useEffect(() => {\n    if (sessionPhase === 'running') return;\n\n    const context = audioContextRef.current;\n    if (!context || context.state === 'closed') return;\n    const now = context.currentTime;\n    windGainRef.current?.gain.cancelScheduledValues(now);\n    windGainRef.current?.gain.setTargetAtTime(0, now, 0.05);\n    rumbleGainRef.current?.gain.cancelScheduledValues(now);\n    rumbleGainRef.current?.gain.setTargetAtTime(0, now, 0.05);\n\n    if (sessionPhase === 'menu') {\n      lightningFlashRef.current = 0;\n      sharedPhysics.lightningFlash = 0;\n    }\n  }, [sessionPhase]);\n\n  useFrame((state, delta) => {\n    const store = useSimStore.getState();\n    const simulationRunning = canAdvanceAuthoritativeSimulation(\n      store.sessionPhase,\n    );\n    const simulationDelta = simulationRunning\n      ? Math.min(delta, 0.1)\n      : 0;\n    const { windSpeed, windDir, renderQuality } = store;\n",
          )
          weather_source = read('components/WeatherEffects.tsx')
          weather_source = weather_source.replace('safeDelta', 'simulationDelta')
          weather_source = weather_source.replace(
              "        MathUtils.clamp(stormIntensity * 0.7, 0, 0.7),\n",
              "        simulationRunning\n          ? MathUtils.clamp(stormIntensity * 0.7, 0, 0.7)\n          : 0,\n",
              1,
          )
          write('components/WeatherEffects.tsx', weather_source)

          # Hurricane clouds use frozen simulation render time in static previews.
          replace_once(
              'components/HurricaneClouds.tsx',
              "import { useFrame } from '@react-three/fiber';\n",
              "import { useFrame } from '@react-three/fiber';\nimport { canAdvanceAuthoritativeSimulation } from '@/sim/core/SimulationRuntimeAuthority';\n",
          )
          hurricane_frame = dedent(r'''
              useFrame((state, delta) => {
                const store = useSimStore.getState();
                const simulationRunning = canAdvanceAuthoritativeSimulation(
                  store.sessionPhase,
                );
                const simulationDelta = simulationRunning
                  ? Math.min(delta, 0.1)
                  : 0;
                const targetOpacity =
                  MathUtils.clamp((store.windSpeed - 28) / 17, 0, 1) * 0.98;

                opacityRef.current = simulationRunning
                  ? MathUtils.damp(
                      opacityRef.current,
                      targetOpacity,
                      2.1,
                      simulationDelta,
                    )
                  : targetOpacity;

                const mesh = meshRef.current;
                if (mesh) {
                  mesh.visible = opacityRef.current > 0.01;
                  mesh.position.set(
                    state.camera.position.x,
                    0,
                    state.camera.position.z,
                  );
                }

                const material = materialRef.current;
                if (!simulationRunning) {
                  updateAccumulatorRef.current = 0;
                  if (material) {
                    material.uniforms.uTime.value = sharedPhysics.renderTime;
                    material.uniforms.uOpacity.value = opacityRef.current;
                    material.uniforms.uLightning.value =
                      sharedPhysics.lightningFlash;
                  }
                  return;
                }

                if (!mesh?.visible) return;

                updateAccumulatorRef.current += simulationDelta;
                const updateInterval = 1 / config.updateHz;
