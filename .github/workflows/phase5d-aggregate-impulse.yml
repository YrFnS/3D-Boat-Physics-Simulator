name: Validate aggregate Phase 5D solver impulse

on:
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-aggregate-impulse.yml'
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-aggregate-impulse.yml'

permissions:
  contents: write

concurrency:
  group: phase5d-aggregate-impulse-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority')
    name: Aggregate, calibrate, and publish solver impulse telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aggregate solved contact impulse per fixed step
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count < 1:
                  raise SystemExit(f'{label}: marker not found')
              return source.replace(old, new, 1)

          collision = Path('sim/collision/RapierCollisionWorld.ts')
          source = collision.read_text(encoding='utf-8')
          source = replace_once(
              source,
              '    const summary = createEmptySummary();\n'
              '    const visitedPairs = new Set<string>();',
              '    const summary = createEmptySummary();\n'
              '    let terrainStepImpulseNs = 0;\n'
              '    let obstacleStepImpulseNs = 0;\n'
              '    const visitedPairs = new Set<string>();',
              'collision summary initialization',
          )
          source = replace_once(
              source,
              '            let maximumImpactSpeedMps = 0;\n'
              '            let maximumSolvedImpulseNs = 0;\n'
              '            for (let index = 0; index < solverContactCount; index += 1) {',
              '            let maximumImpactSpeedMps = 0;\n'
              '            let manifoldNormalImpulseNs = 0;\n'
              '            let manifoldTangentImpulseXNs = 0;\n'
              '            let manifoldTangentImpulseYNs = 0;\n'
              '            for (let index = 0; index < solverContactCount; index += 1) {',
              'solver-contact accumulator initialization',
          )
          source = replace_once(
              source,
              '              maximumSolvedImpulseNs = Math.max(\n'
              '                maximumSolvedImpulseNs,\n'
              '                Math.hypot(\n'
              '                  normalImpulseNs,\n'
              '                  tangentImpulseXNs,\n'
              '                  tangentImpulseYNs,\n'
              '                ),\n'
              '              );',
              '              manifoldNormalImpulseNs += normalImpulseNs;\n'
              '              manifoldTangentImpulseXNs += tangentImpulseXNs;\n'
              '              manifoldTangentImpulseYNs += tangentImpulseYNs;',
              'point impulse maximum',
          )
          source = replace_once(
              source,
              '            }\n\n'
              '            // Predictive contacts may not yet have a solver point. Preserve a\n',
              '            }\n\n'
              '            // Rapier distributes one physical response across every solver\n'
              '            // point in a manifold. Sum components first so telemetry reports\n'
              '            // the manifold resultant instead of one arbitrarily largest point.\n'
              '            const manifoldSolvedImpulseNs = Math.hypot(\n'
              '              manifoldNormalImpulseNs,\n'
              '              manifoldTangentImpulseXNs,\n'
              '              manifoldTangentImpulseYNs,\n'
              '            );\n\n'
              '            // Predictive contacts may not yet have a solver point. Preserve a\n',
              'manifold impulse insertion',
          )
          source = replace_once(
              source,
              '              summary.maxTerrainImpulseNs = Math.max(\n'
              '                summary.maxTerrainImpulseNs,\n'
              '                maximumSolvedImpulseNs,\n'
              '              );',
              '              terrainStepImpulseNs += manifoldSolvedImpulseNs;',
              'terrain impulse reporting',
          )
          source = replace_once(
              source,
              '              summary.maxObstacleImpulseNs = Math.max(\n'
              '                summary.maxObstacleImpulseNs,\n'
              '                maximumSolvedImpulseNs,\n'
              '              );',
              '              obstacleStepImpulseNs += manifoldSolvedImpulseNs;',
              'obstacle impulse reporting',
          )
          source = replace_once(
              source,
              '    const solvedTranslation = vesselBody.translation();',
              '    // The summary represents one fixed step. Add the resultant from every\n'
              '    // active hull manifold so damage and calibration use the total impulse\n'
              '    // Rapier delivered to the vessel during that step.\n'
              '    summary.maxTerrainImpulseNs = terrainStepImpulseNs;\n'
              '    summary.maxObstacleImpulseNs = obstacleStepImpulseNs;\n\n'
              '    const solvedTranslation = vesselBody.translation();',
              'step impulse publication',
          )
          collision.write_text(source, encoding='utf-8')

          regression = Path('scripts/collision-authority.mjs')
          source = regression.read_text(encoding='utf-8')
          source = replace_once(
              source,
              '  let maximumImpulseNs = 0;\n'
              '  let solverContactCount = 0;',
              '  let totalImpulseNs = 0;\n'
              '  let maximumPointImpulseNs = 0;\n'
              '  let solverContactCount = 0;',
              'regression collector initialization',
          )
          source = replace_once(
              source,
              '      world.contactPair(vesselCollider, otherCollider, (manifold) => {\n'
              '        const count = manifold.numSolverContacts();\n'
              '        solverContactCount += count;\n'
              '        for (let index = 0; index < count; index += 1) {\n'
              '          const normalImpulseNs = manifold.contactImpulse(index);\n'
              '          const tangentImpulseXNs = manifold.contactTangentImpulseX(index);\n'
              '          const tangentImpulseYNs = manifold.contactTangentImpulseY(index);\n'
              '          const impulseNs = Math.hypot(\n'
              '            Number.isFinite(normalImpulseNs) ? normalImpulseNs : 0,\n'
              '            Number.isFinite(tangentImpulseXNs) ? tangentImpulseXNs : 0,\n'
              '            Number.isFinite(tangentImpulseYNs) ? tangentImpulseYNs : 0,\n'
              '          );\n'
              '          maximumImpulseNs = Math.max(maximumImpulseNs, impulseNs);\n'
              '        }\n'
              '      });',
              '      world.contactPair(vesselCollider, otherCollider, (manifold) => {\n'
              '        const count = manifold.numSolverContacts();\n'
              '        solverContactCount += count;\n'
              '        let manifoldNormalImpulseNs = 0;\n'
              '        let manifoldTangentImpulseXNs = 0;\n'
              '        let manifoldTangentImpulseYNs = 0;\n'
              '        for (let index = 0; index < count; index += 1) {\n'
              '          const normalImpulseNs = manifold.contactImpulse(index);\n'
              '          const tangentImpulseXNs = manifold.contactTangentImpulseX(index);\n'
              '          const tangentImpulseYNs = manifold.contactTangentImpulseY(index);\n'
              '          const safeNormalImpulseNs = Number.isFinite(normalImpulseNs)\n'
              '            ? Math.abs(normalImpulseNs)\n'
              '            : 0;\n'
              '          const safeTangentImpulseXNs = Number.isFinite(tangentImpulseXNs)\n'
              '            ? tangentImpulseXNs\n'
              '            : 0;\n'
              '          const safeTangentImpulseYNs = Number.isFinite(tangentImpulseYNs)\n'
              '            ? tangentImpulseYNs\n'
              '            : 0;\n'
              '          maximumPointImpulseNs = Math.max(\n'
              '            maximumPointImpulseNs,\n'
              '            Math.hypot(\n'
              '              safeNormalImpulseNs,\n'
              '              safeTangentImpulseXNs,\n'
              '              safeTangentImpulseYNs,\n'
              '            ),\n'
              '          );\n'
              '          manifoldNormalImpulseNs += safeNormalImpulseNs;\n'
              '          manifoldTangentImpulseXNs += safeTangentImpulseXNs;\n'
              '          manifoldTangentImpulseYNs += safeTangentImpulseYNs;\n'
              '        }\n'
              '        totalImpulseNs += Math.hypot(\n'
              '          manifoldNormalImpulseNs,\n'
              '          manifoldTangentImpulseXNs,\n'
              '          manifoldTangentImpulseYNs,\n'
              '        );\n'
              '      });',
              'regression contact aggregation',
          )
          source = replace_once(
              source,
              '  return { maximumImpulseNs, solverContactCount };',
              '  return { totalImpulseNs, maximumPointImpulseNs, solverContactCount };',
              'regression collector return',
          )
          source = replace_once(
              source,
              '  let maximumImpulseNs = 0;\n'
              '  let solverContactCount = 0;\n'
              '  for (let step = 0; step < SIMULATION_STEPS; step += 1) {\n'
              '    world.step();\n'
              '    const contact = collectMaximumSolverImpulse(',
              '  let maximumImpulseNs = 0;\n'
              '  let maximumPointImpulseNs = 0;\n'
              '  let solverContactCount = 0;\n'
              '  for (let step = 0; step < SIMULATION_STEPS; step += 1) {\n'
              '    world.step();\n'
              '    const contact = collectMaximumSolverImpulse(',
              'regression simulation loop',
          )
          source = replace_once(
              source,
              '    maximumImpulseNs = Math.max(\n'
              '      maximumImpulseNs,\n'
              '      contact.maximumImpulseNs,\n'
              '    );\n'
              '    solverContactCount += contact.solverContactCount;',
              '    maximumImpulseNs = Math.max(\n'
              '      maximumImpulseNs,\n'
              '      contact.totalImpulseNs,\n'
              '    );\n'
              '    maximumPointImpulseNs = Math.max(\n'
              '      maximumPointImpulseNs,\n'
              '      contact.maximumPointImpulseNs,\n'
              '    );\n'
              '    solverContactCount += contact.solverContactCount;',
              'regression peak impulse tracking',
          )
          source = replace_once(
              source,
              '    maximumImpulseNs,\n'
              '    solverContactCount,',
              '    maximumImpulseNs,\n'
              '    maximumPointImpulseNs,\n'
              '    solverContactCount,',
              'regression result publication',
          )
          source = replace_once(
              source,
              '  assert.ok(\n'
              '    result.maximumImpulseNs > 25,\n'
              '    `${name} scenario must record a real solver impulse`,\n'
              '  );',
              '  assert.ok(\n'
              '    result.maximumImpulseNs > 25,\n'
              '    `${name} scenario must record a real solver impulse`,\n'
              '  );\n'
              '  assert.ok(\n'
              '    result.maximumImpulseNs + 1e-9 >= result.maximumPointImpulseNs,\n'
              '    `${name} aggregate impulse must include every solver point`,\n'
              '  );',
              'regression aggregate assertion',
          )
          regression.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Install committed dependencies
        run: npm ci

      - name: Run complete source validation
        run: npm run validate

      - name: Install calibration browser without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare standalone production server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/phase5d-aggregate-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase5d-aggregate-server.log
          exit 1

      - name: Run twenty-scenario vessel calibration
        id: calibration
        continue-on-error: true
        run: node scripts/physics-calibration.mjs

      - name: Collect validation artifacts
        if: always()
        run: |
          mkdir -p artifacts/phase5d-aggregate-validation
          cp /tmp/phase5d-aggregate-server.log artifacts/phase5d-aggregate-validation/server.log || true
          cp -R artifacts/physics-calibration artifacts/phase5d-aggregate-validation/ || true

      - name: Upload aggregate validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-aggregate-validation
          path: artifacts/phase5d-aggregate-validation
          if-no-files-found: error
          retention-days: 3

      - name: Enforce calibration result
        if: steps.calibration.outcome != 'success'
        run: exit 1

      - name: Remove one-use validation workflow
        run: rm -f .github/workflows/phase5d-aggregate-impulse.yml

      - name: Commit and push validated telemetry semantics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'physics: aggregate Rapier solver impulse telemetry'
          git push origin HEAD:agent/phase-5d-collision-authority
