name: Validate aggregate Phase 5D solver impulse

on:
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-aggregate-impulse.yml'
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-aggregate-impulse.yml'

permissions:
  contents: write

concurrency:
  group: phase5d-aggregate-impulse-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority')
    name: Aggregate, calibrate, and publish solver impulse telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aggregate solved contact impulse per fixed step
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('sim/collision/RapierCollisionWorld.ts')
          lines = path.read_text(encoding='utf-8').splitlines()

          def unique_index(fragment: str) -> int:
              matches = [i for i, line in enumerate(lines) if fragment in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {fragment!r}, found {len(matches)}')
              return matches[0]

          summary_index = unique_index('const summary = createEmptySummary();')
          lines[summary_index + 1:summary_index + 1] = [
              '    let terrainStepImpulseNs = 0;',
              '    let obstacleStepImpulseNs = 0;',
          ]

          accumulator_index = unique_index('let maximumSolvedImpulseNs = 0;')
          indent = lines[accumulator_index].split('let', 1)[0]
          lines[accumulator_index:accumulator_index + 1] = [
              f'{indent}let manifoldNormalImpulseNs = 0;',
              f'{indent}let manifoldTangentImpulseXNs = 0;',
              f'{indent}let manifoldTangentImpulseYNs = 0;',
          ]

          point_start = unique_index('maximumSolvedImpulseNs = Math.max(')
          point_end = point_start
          while point_end < len(lines):
              if lines[point_end] == '              );':
                  break
              point_end += 1
          if point_end >= len(lines):
              raise SystemExit('Could not locate point-impulse block end.')
          lines[point_start:point_end + 1] = [
              '              manifoldNormalImpulseNs += normalImpulseNs;',
              '              manifoldTangentImpulseXNs += tangentImpulseXNs;',
              '              manifoldTangentImpulseYNs += tangentImpulseYNs;',
          ]

          predictive_index = unique_index('Predictive contacts may not yet have a solver point.')
          comment_start = predictive_index - 1
          lines[comment_start:comment_start] = [
              '            // Rapier distributes one physical response across every solver',
              '            // point in a manifold. Sum components first so telemetry reports',
              '            // the manifold resultant instead of one arbitrarily largest point.',
              '            const manifoldSolvedImpulseNs = Math.hypot(',
              '              manifoldNormalImpulseNs,',
              '              manifoldTangentImpulseXNs,',
              '              manifoldTangentImpulseYNs,',
              '            );',
              '',
          ]

          terrain_start = unique_index('summary.maxTerrainImpulseNs = Math.max(')
          terrain_end = terrain_start
          while terrain_end < len(lines) and lines[terrain_end] != '              );':
              terrain_end += 1
          if terrain_end >= len(lines):
              raise SystemExit('Could not locate terrain impulse block end.')
          lines[terrain_start:terrain_end + 1] = [
              '              terrainStepImpulseNs += manifoldSolvedImpulseNs;',
          ]

          obstacle_start = unique_index('summary.maxObstacleImpulseNs = Math.max(')
          obstacle_end = obstacle_start
          while obstacle_end < len(lines) and lines[obstacle_end] != '              );':
              obstacle_end += 1
          if obstacle_end >= len(lines):
              raise SystemExit('Could not locate obstacle impulse block end.')
          lines[obstacle_start:obstacle_end + 1] = [
              '              obstacleStepImpulseNs += manifoldSolvedImpulseNs;',
          ]

          solved_index = unique_index('const solvedTranslation = vesselBody.translation();')
          lines[solved_index:solved_index] = [
              '    // The summary represents one fixed step. Add the resultant from every',
              '    // active hull manifold so damage and calibration use the total impulse',
              '    // Rapier delivered to the vessel during that step.',
              '    summary.maxTerrainImpulseNs = terrainStepImpulseNs;',
              '    summary.maxObstacleImpulseNs = obstacleStepImpulseNs;',
              '',
          ]

          result = '\n'.join(lines) + '\n'
          if 'maximumSolvedImpulseNs' in result:
              raise SystemExit('Legacy point-maximum telemetry remains.')
          for token in (
              'terrainStepImpulseNs += manifoldSolvedImpulseNs',
              'obstacleStepImpulseNs += manifoldSolvedImpulseNs',
              'summary.maxObstacleImpulseNs = obstacleStepImpulseNs',
          ):
              if token not in result:
                  raise SystemExit(f'Missing expected aggregate token: {token}')
          path.write_text(result, encoding='utf-8')
          PY
          git diff --check

      - name: Install committed dependencies
        run: npm ci

      - name: Run complete source validation
        run: npm run validate

      - name: Install calibration browser without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare standalone production server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/phase5d-aggregate-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase5d-aggregate-server.log
          exit 1

      - name: Run twenty-scenario vessel calibration
        id: calibration
        continue-on-error: true
        run: node scripts/physics-calibration.mjs

      - name: Collect validation artifacts
        if: always()
        run: |
          mkdir -p artifacts/phase5d-aggregate-validation
          cp /tmp/phase5d-aggregate-server.log artifacts/phase5d-aggregate-validation/server.log || true
          cp -R artifacts/physics-calibration artifacts/phase5d-aggregate-validation/ || true

      - name: Upload aggregate validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-aggregate-validation
          path: artifacts/phase5d-aggregate-validation
          if-no-files-found: error
          retention-days: 3

      - name: Enforce calibration result
        if: steps.calibration.outcome != 'success'
        run: exit 1

      - name: Remove one-use validation workflow
        run: rm -f .github/workflows/phase5d-aggregate-impulse.yml

      - name: Commit and push validated telemetry semantics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'physics: aggregate Rapier solver impulse telemetry'
          git push origin HEAD:agent/phase-5d-collision-authority
