name: Validate Phase 5D step impulse aggregation

on:
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-aggregate-impulse.yml'
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-aggregate-impulse.yml'

permissions:
  contents: write

concurrency:
  group: phase5d-aggregate-impulse-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority')
    name: Correct, validate, and publish step impulse telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aggregate all solver impulses applied during each fixed step
        run: |
          python <<'PY'
          from pathlib import Path

          collision = Path('sim/collision/RapierCollisionWorld.ts')
          source = collision.read_text(encoding='utf-8')

          old = """            let maximumImpactSpeedMps = 0;
                      let maximumSolvedImpulseNs = 0;
          """
          new = """            let maximumImpactSpeedMps = 0;
                      let totalSolvedImpulseNs = 0;
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one solver-impulse accumulator declaration.')
          source = source.replace(old, new, 1)

          old = """              maximumSolvedImpulseNs = Math.max(
                          maximumSolvedImpulseNs,
                          Math.hypot(
                            normalImpulseNs,
                            tangentImpulseXNs,
                            tangentImpulseYNs,
                          ),
                        );
          """
          new = """              // Calibration compares the complete momentum exchange for
                        // this fixed step, not the largest individual contact point.
                        totalSolvedImpulseNs += Math.hypot(
                          normalImpulseNs,
                          tangentImpulseXNs,
                          tangentImpulseYNs,
                        );
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one per-contact impulse aggregation block.')
          source = source.replace(old, new, 1)

          old = """              summary.maxTerrainImpulseNs = Math.max(
                          summary.maxTerrainImpulseNs,
                          maximumSolvedImpulseNs,
                        );
          """
          new = """              summary.maxTerrainImpulseNs += totalSolvedImpulseNs;
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one terrain impulse summary block.')
          source = source.replace(old, new, 1)

          old = """              summary.maxObstacleImpulseNs = Math.max(
                          summary.maxObstacleImpulseNs,
                          maximumSolvedImpulseNs,
                        );
          """
          new = """              summary.maxObstacleImpulseNs += totalSolvedImpulseNs;
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one obstacle impulse summary block.')
          collision.write_text(source.replace(old, new, 1), encoding='utf-8')

          regression = Path('scripts/collision-authority.mjs')
          source = regression.read_text(encoding='utf-8')
          source = source.replace(
              'function collectMaximumSolverImpulse(',
              'function collectSolverImpulseForStep(',
              1,
          )

          old = """  let maximumImpulseNs = 0;
            let solverContactCount = 0;
          """
          new = """  let totalImpulseNs = 0;
            let solverContactCount = 0;
          """
          if source.count(old) < 1:
              raise SystemExit('Expected the direct-test impulse accumulator.')
          source = source.replace(old, new, 1)

          old = """          maximumImpulseNs = Math.max(maximumImpulseNs, impulseNs);
          """
          new = """          totalImpulseNs += impulseNs;
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one direct-test contact impulse update.')
          source = source.replace(old, new, 1)

          old = """  return { maximumImpulseNs, solverContactCount };
          """
          new = """  return { totalImpulseNs, solverContactCount };
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one direct-test impulse return.')
          source = source.replace(old, new, 1)

          source = source.replace(
              'const contact = collectMaximumSolverImpulse(',
              'const contact = collectSolverImpulseForStep(',
              1,
          )
          old = """      contact.maximumImpulseNs,
          """
          new = """      contact.totalImpulseNs,
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one direct-test peak-step update.')
          regression.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Remove this one-use workflow
        run: rm -f .github/workflows/phase5d-aggregate-impulse.yml

      - name: Install dependencies
        run: npm ci

      - name: Run marine and collision-authority regressions
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push validated telemetry correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: aggregate Phase 5D solver impulses per step'
          git push origin HEAD:agent/phase-5d-collision-authority
