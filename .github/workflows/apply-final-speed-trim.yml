name: Apply final vessel speed trim

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - scripts/apply-final-speed-trim.mjs
      - .github/workflows/apply-final-speed-trim.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-vessel-speed-trim
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Apply, validate, and commit final speed trim
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded calibration trim
        run: node scripts/apply-final-speed-trim.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated calibration changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sim/vessels/VesselConfig.ts \
            sim/calibration/VesselCalibration.ts
          if git diff --cached --quiet; then
            echo "No final speed-trim changes to commit."
            exit 0
          fi
          git commit -m "physics: finalize speedboat calibration"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
