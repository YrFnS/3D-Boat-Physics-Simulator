name: Format vessel condition extraction

on:
  push:
    branches:
      - agent/simulator-stabilization
    paths:
      - .github/workflows/format-vessel-condition-extraction.yml

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Normalize extracted orchestration formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/Boat.tsx')
          source = path.read_text(encoding='utf-8')

          thermal_start_marker = (
              '    // --- Component temperature and explicit condition damage ---\n'
          )
          thermal_end_marker = (
              '    // --- Bilge pump and limited emergency field repair ---\n'
          )
          if source.count(thermal_start_marker) != 1:
              raise SystemExit('Unable to locate thermal condition start marker.')
          thermal_start = source.index(thermal_start_marker)
          thermal_end = source.index(thermal_end_marker, thermal_start)
          thermal_block = (
              '    // --- Component temperature and explicit condition damage ---\n'
              '    conditionRuntime.current.stepThermalAndFlooding({\n'
              '      deltaSeconds: dt,\n'
              '      engineRpm: propulsionResult.engineRpm,\n'
              '      ratedEngineRpm: vessel.engine.ratedRpm,\n'
              '      absorbedShaftPowerW: propulsionResult.absorbedShaftPowerW,\n'
              '      ratedEnginePowerW: vessel.engine.ratedPowerW,\n'
              '      ventilationFactor: propulsionResult.ventilationFactor,\n'
              '      submergedRatio,\n'
              '      engineCompartmentFloodingRatio:\n'
              '        floodingResult.engineCompartmentFloodingRatio,\n'
              '      simulationTimeSeconds: time,\n'
              '    });\n\n'
          )
          source = (
              source[:thermal_start]
              + thermal_block
              + source[thermal_end:]
          )

          repair_start_marker = '    const fieldRepairResult =\n'
          repair_end_marker = '    const missionStatistics'
          if source.count(repair_start_marker) != 1:
              raise SystemExit('Unable to locate field-repair start marker.')
          repair_start = source.index(repair_start_marker)
          repair_end = source.index(repair_end_marker, repair_start)
          repair_block = (
              '    const fieldRepairResult =\n'
              '      conditionRuntime.current.applyFieldRepair({\n'
              '        active: activeFieldRepair,\n'
              '        deltaSeconds: dt,\n'
              '        engineConditionRestoredThisRun: repairUsageMatchesRun\n'
              '          ? repairStatisticsBeforeStep.engineConditionRestored\n'
              '          : 0,\n'
              '        rudderConditionRestoredThisRun: repairUsageMatchesRun\n'
              '          ? repairStatisticsBeforeStep.rudderConditionRestored\n'
              '          : 0,\n'
              '      });\n\n'
          )
          source = source[:repair_start] + repair_block + source[repair_end:]

          path.write_text(source, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate normalized source
        run: npm run validate

      - name: Commit normalized extraction
        shell: bash
        run: |
          rm -f .github/workflows/format-vessel-condition-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: normalize condition runtime orchestration"
          git push origin HEAD:agent/simulator-stabilization
