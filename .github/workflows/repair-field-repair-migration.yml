name: Repair field repair migration

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: repair-field-repair-migration
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Correct duplicate telemetry replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-field-repair-fairness.yml')
          source = path.read_text(encoding='utf-8')
          helper_anchor = """          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:180]!r}'
                  )
              write(path, source.replace(old, new, 1))
"""
          helper_replacement = helper_anchor + """
          def replace_last(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count < 1:
                  raise SystemExit(
                      f'{path}: expected at least one target, found {count}: {old[:180]!r}'
                  )
              index = source.rfind(old)
              write(path, source[:index] + new + source[index + len(old):])
"""
          if source.count(helper_anchor) != 1:
              raise SystemExit('Unable to locate replace_once helper.')
          source = source.replace(helper_anchor, helper_replacement, 1)

          call_anchor = """          replace_once(
              'components/Boat.tsx',
              \"        setFloodingTelemetry(\\n          floodingResult.floodingRatio,\\n          floodingResult.totalFloodedVolumeM3,\\n        );\\n\",
"""
          call_replacement = call_anchor.replace('replace_once(', 'replace_last(', 1)
          if source.count(call_anchor) != 1:
              raise SystemExit('Unable to locate Boat telemetry replacement call.')
          source = source.replace(call_anchor, call_replacement, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit corrected migration workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-field-repair-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: correct field repair migration guard"
          git push origin HEAD:agent/simulator-stabilization
