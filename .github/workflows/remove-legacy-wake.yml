name: Remove legacy wake history

on:
  push:
    branches:
      - agent/phase-1-performance-foundation
    paths:
      - scripts/remove-legacy-wake.mjs
      - .github/workflows/remove-legacy-wake.yml

permissions:
  contents: write

concurrency:
  group: remove-legacy-wake-history
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove obsolete wake history
        run: node scripts/remove-legacy-wake.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Boat.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "refactor: remove legacy wake history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
