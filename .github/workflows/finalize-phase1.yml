name: Finalize Phase 1 repository

on:
  pull_request:
    paths:
      - scripts/finalize-phase1-repo.mjs
      - scripts/fix-final-lint.mjs
      - .github/workflows/finalize-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-phase-1-repository
  cancel-in-progress: false

jobs:
  finalize:
    name: Clean dependencies, lint, typecheck, and build
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-performance-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply repository cleanup
        run: |
          node scripts/finalize-phase1-repo.mjs
          node scripts/fix-final-lint.mjs

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install cleaned dependency graph
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Reject high-severity runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Remove one-time finalization tooling
        run: |
          rm -f scripts/finalize-phase1-repo.mjs
          rm -f scripts/fix-final-lint.mjs
          rm -f .github/workflows/finalize-phase1.yml

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore: finalize Phase 1 repository"
          git push origin "HEAD:agent/phase-1-performance-foundation"
