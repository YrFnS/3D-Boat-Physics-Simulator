name: Apply final Phase 2 contact scenarios

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - scripts/apply-phase2-contact-scenarios.mjs
      - .github/workflows/apply-phase2-contact-scenarios.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-phase2-contact-scenarios
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Apply, validate, and commit contact scenarios
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded contact integration
        run: node scripts/apply-phase2-contact-scenarios.mjs

      - name: Check calibration runner syntax
        run: node --check scripts/physics-calibration.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/Boat.tsx \
            sim/calibration/VesselCalibration.ts \
            sim/calibration/CollisionCalibration.ts \
            sim/collision/RapierCollisionWorld.ts \
            scripts/physics-calibration.mjs
          if git diff --cached --quiet; then
            echo "No contact-scenario changes to commit."
            exit 0
          fi
          git commit -m "physics: calibrate grounding and impact contacts"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
