name: Apply world direction migration

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: world-direction-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply authoritative world direction convention
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one replacement target, found {count}: {old[:100]!r}'
                  )
              write(path, source.replace(old, new, 1))

          def replace_section(
              path: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              source = read(path)
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              write(path, source[:start] + replacement + source[end:])

          world_direction = r'''const FULL_CIRCLE_DEGREES = 360;
          const DEGREES_TO_RADIANS = Math.PI / 180;
          const RADIANS_TO_DEGREES = 180 / Math.PI;
          const DIRECTION_EPSILON = 1e-12;

          export interface WorldDirectionXZ {
            x: number;
            z: number;
          }

          /**
           * Authoritative horizontal-world convention for the simulator.
           *
           * - 0 degrees points north along world -Z.
           * - 90 degrees points east along world +X.
           * - Headings increase clockwise when viewed from above.
           * - Wind and current headings describe the direction the medium travels toward.
           */
          export function normalizeHeadingDegrees(headingDegrees: number) {
            const finiteHeading = Number.isFinite(headingDegrees)
              ? headingDegrees
              : 0;
            return (
              ((finiteHeading % FULL_CIRCLE_DEGREES) + FULL_CIRCLE_DEGREES) %
              FULL_CIRCLE_DEGREES
            );
          }

          export function normalizeSignedHeadingDeltaDegrees(
            headingDeltaDegrees: number,
          ) {
            const normalized = normalizeHeadingDegrees(headingDeltaDegrees);
            return normalized >= 180 ? normalized - FULL_CIRCLE_DEGREES : normalized;
          }

          export function headingDegreesToWorldDirection(
            headingDegrees: number,
            magnitude = 1,
          ): WorldDirectionXZ {
            const radians =
              normalizeHeadingDegrees(headingDegrees) * DEGREES_TO_RADIANS;
            const safeMagnitude = Number.isFinite(magnitude) ? magnitude : 0;

            return {
              x: Math.sin(radians) * safeMagnitude,
              z: -Math.cos(radians) * safeMagnitude,
            };
          }

          export function setWorldVectorFromHeading<
            Target extends { set(x: number, y: number, z: number): Target },
          >(
            target: Target,
            headingDegrees: number,
            magnitude = 1,
          ) {
            const direction = headingDegreesToWorldDirection(
              headingDegrees,
              magnitude,
            );
            return target.set(direction.x, 0, direction.z);
          }

          /** Vector2.y represents world Z for horizontal shader and audio inputs. */
          export function setWorldXZFromHeading<
            Target extends { set(x: number, z: number): Target },
          >(
            target: Target,
            headingDegrees: number,
            magnitude = 1,
          ) {
            const direction = headingDegreesToWorldDirection(
              headingDegrees,
              magnitude,
            );
            return target.set(direction.x, direction.z);
          }

          export function worldDirectionToHeadingDegrees(
            worldX: number,
            worldZ: number,
            fallbackHeadingDegrees = 0,
          ) {
            if (!Number.isFinite(worldX) || !Number.isFinite(worldZ)) {
              return normalizeHeadingDegrees(fallbackHeadingDegrees);
            }

            if (worldX * worldX + worldZ * worldZ <= DIRECTION_EPSILON) {
              return normalizeHeadingDegrees(fallbackHeadingDegrees);
            }

            return normalizeHeadingDegrees(
              Math.atan2(worldX, -worldZ) * RADIANS_TO_DEGREES,
            );
          }

          export function headingDegreesToYawRadians(headingDegrees: number) {
            return -normalizeHeadingDegrees(headingDegrees) * DEGREES_TO_RADIANS;
          }

          export function rotateWorldDirection(
            worldX: number,
            worldZ: number,
            clockwiseDegrees: number,
          ): WorldDirectionXZ {
            const safeX = Number.isFinite(worldX) ? worldX : 0;
            const safeZ = Number.isFinite(worldZ) ? worldZ : 0;
            const radians =
              normalizeHeadingDegrees(clockwiseDegrees) * DEGREES_TO_RADIANS;
            const cosine = Math.cos(radians);
            const sine = Math.sin(radians);

            return {
              x: safeX * cosine - safeZ * sine,
              z: safeX * sine + safeZ * cosine,
            };
          }
          '''
          write(
              'sim/world/WorldDirection.ts',
              '\n'.join(line[10:] if line.startswith('          ') else line for line in world_direction.splitlines()) + '\n',
          )

          direction_contract = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import {
            headingDegreesToWorldDirection,
            headingDegreesToYawRadians,
            normalizeHeadingDegrees,
            normalizeSignedHeadingDeltaDegrees,
            rotateWorldDirection,
            worldDirectionToHeadingDegrees,
          } from '../sim/world/WorldDirection.ts';

          const EPSILON = 1e-6;

          function approximatelyEqual(actual, expected, message) {
            assert.ok(
              Math.abs(actual - expected) <= EPSILON,
              `${message}: expected ${expected}, received ${actual}`,
            );
          }

          const cardinals = [
            { heading: 0, x: 0, z: -1, label: 'north' },
            { heading: 90, x: 1, z: 0, label: 'east' },
            { heading: 180, x: 0, z: 1, label: 'south' },
            { heading: 270, x: -1, z: 0, label: 'west' },
          ];

          for (const cardinal of cardinals) {
            const direction = headingDegreesToWorldDirection(cardinal.heading);
            approximatelyEqual(direction.x, cardinal.x, `${cardinal.label} world X`);
            approximatelyEqual(direction.z, cardinal.z, `${cardinal.label} world Z`);
            approximatelyEqual(
              worldDirectionToHeadingDegrees(direction.x, direction.z),
              cardinal.heading,
              `${cardinal.label} heading round trip`,
            );
          }

          for (const heading of [-720, -45, 0, 15, 90, 225, 359, 720]) {
            const direction = headingDegreesToWorldDirection(heading, 7.5);
            approximatelyEqual(
              Math.hypot(direction.x, direction.z),
              7.5,
              `${heading} degree magnitude`,
            );
            approximatelyEqual(
              worldDirectionToHeadingDegrees(direction.x, direction.z),
              normalizeHeadingDegrees(heading),
              `${heading} degree round trip`,
            );
          }

          assert.equal(normalizeSignedHeadingDeltaDegrees(181), -179);
          assert.equal(normalizeSignedHeadingDeltaDegrees(-181), 179);
          assert.equal(normalizeSignedHeadingDeltaDegrees(90), 90);

          const east = rotateWorldDirection(0, -1, 90);
          approximatelyEqual(east.x, 1, 'clockwise north-to-east rotation X');
          approximatelyEqual(east.z, 0, 'clockwise north-to-east rotation Z');
          approximatelyEqual(
            headingDegreesToYawRadians(90),
            -Math.PI / 2,
            'east heading yaw',
          );

          const sourceFiles = {
            boat: await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            ),
            weather: await fs.readFile(
              new URL('../components/WeatherEffects.tsx', import.meta.url),
              'utf8',
            ),
            ocean: await fs.readFile(
              new URL('../components/Ocean.tsx', import.meta.url),
              'utf8',
            ),
            scenarioDirector: await fs.readFile(
              new URL('../components/ScenarioDirector.tsx', import.meta.url),
              'utf8',
            ),
            scenarioRoute: await fs.readFile(
              new URL('../sim/scenarios/ScenarioRoute.ts', import.meta.url),
              'utf8',
            ),
            body: await fs.readFile(
              new URL('../sim/core/SixDofBody.ts', import.meta.url),
              'utf8',
            ),
            hud: await fs.readFile(
              new URL('../components/HUD.tsx', import.meta.url),
              'utf8',
            ),
          };

          assert.match(
            sourceFiles.boat,
            /setWorldVectorFromHeading\(windVelocity, windDir, windSpeed\)/,
            'Vessel wind force must use the authoritative heading conversion.',
          );
          assert.match(
            sourceFiles.boat,
            /setWorldVectorFromHeading\(\s*baseCurrentVelocity,\s*currentDir,\s*currentSpeed/,
            'Water current must use the authoritative heading conversion.',
          );
          assert.match(
            sourceFiles.boat,
            /worldDirectionToHeadingDegrees\(\s*forwardDir\.x,\s*forwardDir\.z/,
            'Vessel telemetry must publish the same compass convention.',
          );
          assert.doesNotMatch(
            sourceFiles.boat,
            /const windRad = MathUtils\.degToRad\(windDir\)/,
            'Boat physics must not keep a private wind-axis mapping.',
          );

          assert.match(
            sourceFiles.weather,
            /setWorldXZFromHeading\(/,
            'Precipitation and wind audio must use the shared heading conversion.',
          );
          assert.match(
            sourceFiles.weather,
            /uSnowBlend/,
            'Winter precipitation must share the authoritative wind drift.',
          );
          assert.doesNotMatch(
            sourceFiles.weather,
            /Math\.(?:sin|cos)\(windRadians\)/,
            'Weather effects must not keep a conflicting axis mapping.',
          );

          assert.match(
            sourceFiles.ocean,
            /cachedWindDir/,
            'Wave caching must invalidate when wind heading changes.',
          );
          assert.match(
            sourceFiles.ocean,
            /rotateWorldDirection/,
            'Gerstner wave directions must rotate with wind heading.',
          );
          assert.match(
            sourceFiles.scenarioDirector,
            /worldDirectionToHeadingDegrees\(deltaX, deltaZ\)/,
            'Mission bearings must use the shared compass convention.',
          );
          assert.match(
            sourceFiles.scenarioRoute,
            /worldDirectionToHeadingDegrees/,
            'Recovery checkpoint headings must use the shared compass convention.',
          );
          assert.match(
            sourceFiles.body,
            /headingDegreesToYawRadians\(spawn\.headingDeg\)/,
            'Vessel spawn orientation must use the shared compass convention.',
          );
          assert.match(
            sourceFiles.hud,
            /Wind heading \(toward\)/,
            'The HUD must disclose that wind headings describe travel toward.',
          );
          assert.match(
            sourceFiles.hud,
            /Current heading \(toward\)/,
            'The HUD must disclose that current headings describe travel toward.',
          );

          console.log('World direction contract passed.');
          '''
          write(
              'scripts/world-direction-contract.mjs',
              '\n'.join(line[10:] if line.startswith('          ') else line for line in direction_contract.splitlines()) + '\n',
          )

          # Store inputs are normalized at the boundary.
          replace_once(
              'store/useSimStore.ts',
              "import { queueNextSixDofBodySpawn } from '@/sim/core/SixDofBody';\n",
              "import { queueNextSixDofBodySpawn } from '@/sim/core/SixDofBody';\nimport { normalizeHeadingDegrees } from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "  setWindDir: (windDir) => set({ windDir }),\n",
              "  setWindDir: (windDir) =>\n    set({ windDir: normalizeHeadingDegrees(windDir) }),\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "  setCurrentDir: (currentDir) => set({ currentDir }),\n",
              "  setCurrentDir: (currentDir) =>\n    set({ currentDir: normalizeHeadingDegrees(currentDir) }),\n",
          )

          # Scenario data documents the shared semantic rather than leaving from/toward ambiguous.
          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "  windSpeed: number;\n  windDir: number;\n  currentSpeed: number;\n  currentDir: number;\n",
              "  windSpeed: number;\n  /** Compass heading the wind travels toward: 0° north (-Z), 90° east (+X). */\n  windDir: number;\n  currentSpeed: number;\n  /** Compass heading the current travels toward: 0° north (-Z), 90° east (+X). */\n  currentDir: number;\n",
          )

          # Spawn orientation, route bearings, and live navigation share the same helpers.
          replace_once(
              'sim/core/SixDofBody.ts',
              "import { Object3D, Quaternion, Vector3 } from 'three';\n",
              "import { Object3D, Quaternion, Vector3 } from 'three';\nimport { headingDegreesToYawRadians } from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'sim/core/SixDofBody.ts',
              "        (-spawn.headingDeg * Math.PI) / 180,\n",
              "        headingDegreesToYawRadians(spawn.headingDeg),\n",
          )

          replace_once(
              'components/ScenarioDirector.tsx',
              "import { MathUtils } from 'three';\n",
              "import { MathUtils } from 'three';\nimport {\n  normalizeSignedHeadingDeltaDegrees,\n  worldDirectionToHeadingDegrees,\n} from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'components/ScenarioDirector.tsx',
              "function normalizeBearing(degrees: number) {\n  return ((degrees % 360) + 360) % 360;\n}\n\nfunction normalizeSignedBearing(degrees: number) {\n  return ((degrees + 540) % 360) - 180;\n}\n\n",
              "",
          )
          replace_once(
              'components/ScenarioDirector.tsx',
              "    const bearingDeg = normalizeBearing(\n      MathUtils.radToDeg(Math.atan2(deltaX, -deltaZ)),\n    );\n    const relativeBearingDeg = normalizeSignedBearing(\n      bearingDeg - store.heading,\n    );\n",
              "    const bearingDeg = worldDirectionToHeadingDegrees(deltaX, deltaZ);\n    const relativeBearingDeg = normalizeSignedHeadingDeltaDegrees(\n      bearingDeg - store.heading,\n    );\n",
          )

          replace_once(
              'sim/scenarios/ScenarioRoute.ts',
              "import { getTerrainHeight } from '@/lib/terrain';\n",
              "import { getTerrainHeight } from '@/lib/terrain';\nimport { worldDirectionToHeadingDegrees } from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'sim/scenarios/ScenarioRoute.ts',
              "function normalizeBearing(degrees: number) {\n  return ((degrees % 360) + 360) % 360;\n}\n\n",
              "",
          )
          replace_once(
              'sim/scenarios/ScenarioRoute.ts',
              "    const headingDeg = normalizeBearing(\n      (Math.atan2(\n        headingTarget.x - headingSource.x,\n        -(headingTarget.z - headingSource.z),\n      ) *\n        180) /\n        Math.PI,\n    );\n",
              "    const headingDeg = worldDirectionToHeadingDegrees(\n      headingTarget.x - headingSource.x,\n      headingTarget.z - headingSource.z,\n    );\n",
          )

          # Vessel forces, telemetry, and apparent-wind flag use one world mapping.
          replace_once(
              'components/Boat.tsx',
              "import { EnvironmentalForces } from '@/sim/vessels/EnvironmentalForces';\n",
              "import { EnvironmentalForces } from '@/sim/vessels/EnvironmentalForces';\nimport {\n  setWorldVectorFromHeading,\n  worldDirectionToHeadingDegrees,\n} from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'components/Boat.tsx',
              "      apparentWindDir: new Vector3(),\n      windForce: new Vector3(),\n",
              "      apparentWindDir: new Vector3(),\n      flagApparentWindLocal: new Vector3(),\n      inverseBoatQuaternion: new Quaternion(),\n      windForce: new Vector3(),\n",
          )
          replace_once(
              'components/Boat.tsx',
              "      const windRad = MathUtils.degToRad(windDir);\n      windVelocity\n        .set(Math.sin(windRad), 0, Math.cos(windRad))\n        .multiplyScalar(windSpeed);\n\n      const currentRad = MathUtils.degToRad(currentDir);\n      baseCurrentVelocity\n        .set(Math.sin(currentRad), 0, Math.cos(currentRad))\n        .multiplyScalar(currentSpeed);\n",
              "      setWorldVectorFromHeading(windVelocity, windDir, windSpeed);\n      setWorldVectorFromHeading(\n        baseCurrentVelocity,\n        currentDir,\n        currentSpeed,\n      );\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    let headingDeg =\n      MathUtils.radToDeg(\n        Math.atan2(forwardDir.x, -forwardDir.z),\n      ) % 360;\n    if (headingDeg < 0) headingDeg += 360;\n",
              "    const headingDeg = worldDirectionToHeadingDegrees(\n      forwardDir.x,\n      forwardDir.z,\n    );\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    const renderWindRadians = MathUtils.degToRad(windDir);\n    const apparentWind = scratch.apparentWind\n      .set(\n        Math.sin(renderWindRadians),\n        0,\n        Math.cos(renderWindRadians),\n      )\n      .multiplyScalar(windSpeed)\n      .sub(physicsBody.current.linearVelocity);\n",
              "    setWorldVectorFromHeading(\n      scratch.windVelocity,\n      windDir,\n      windSpeed,\n    );\n    const apparentWind = scratch.apparentWind\n      .copy(scratch.windVelocity)\n      .sub(physicsBody.current.linearVelocity);\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    // --- Update Flag (Apparent Wind) ---\n    if (flagRef.current) {\n      if (apparentWind.lengthSq() > 0.1) {\n        // Flag points away from apparent wind\n        const targetAngle = Math.atan2(apparentWind.x, apparentWind.z);\n        // Local rotation needs to account for boat heading\n        flagRef.current.rotation.y = targetAngle - boat.rotation.y;\n      }\n    }\n",
              "    // --- Update Flag (Apparent Wind) ---\n    if (flagRef.current && apparentWind.lengthSq() > 0.1) {\n      const localAirflow = scratch.flagApparentWindLocal\n        .copy(apparentWind)\n        .applyQuaternion(\n          scratch.inverseBoatQuaternion.copy(boat.quaternion).invert(),\n        );\n      localAirflow.y = 0;\n      if (localAirflow.lengthSq() > 1e-8) {\n        // The flag mesh extends along local +Z and trails with the airflow.\n        flagRef.current.rotation.y = Math.atan2(\n          localAirflow.x,\n          localAirflow.z,\n        );\n      }\n    }\n",
          )

          # Rain, winter snow drift, and wind audio use the same heading vector.
          replace_once(
              'components/WeatherEffects.tsx',
              "} from '@/store/useSimStore';\n",
              "} from '@/store/useSimStore';\nimport { setWorldXZFromHeading } from '@/sim/world/WorldDirection';\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "uniform float uStormIntensity;\nuniform vec3 uCameraPosition;\n",
              "uniform float uStormIntensity;\nuniform float uSnowBlend;\nuniform vec3 uCameraPosition;\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "  float randomSpeed = hash11(aSeed.x * 97.0 + aSeed.z * 211.0);\n  float fallSpeed = mix(16.0, 34.0, randomSpeed) * mix(1.0, 1.7, uStormIntensity);\n  float cycle = mod(uTime * fallSpeed + aSeed.y * uHeight, uHeight);\n  float localY = uHeight * 0.5 - cycle;\n  float fallAge = cycle / max(fallSpeed, 0.001);\n",
              "  float randomSpeed = hash11(aSeed.x * 97.0 + aSeed.z * 211.0);\n  float rainFallSpeed =\n    mix(16.0, 34.0, randomSpeed) * mix(1.0, 1.7, uStormIntensity);\n  float snowFallSpeed = mix(2.2, 6.5, randomSpeed);\n  float fallSpeed = mix(rainFallSpeed, snowFallSpeed, uSnowBlend);\n  float cycle = mod(uTime * fallSpeed + aSeed.y * uHeight, uHeight);\n  float localY = uHeight * 0.5 - cycle;\n  float fallAge = cycle / max(fallSpeed, 0.001);\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "  localXZ += uWind * fallAge;\n",
              "  localXZ += uWind * fallAge * mix(1.0, 1.45, uSnowBlend);\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "  float streakWidth = mix(0.01, 0.035, uStormIntensity);\n  float streakLength = mix(0.28, 1.25, uStormIntensity);\n",
              "  float rainWidth = mix(0.01, 0.035, uStormIntensity);\n  float rainLength = mix(0.28, 1.25, uStormIntensity);\n  float snowSize = mix(0.07, 0.16, uStormIntensity);\n  float streakWidth = mix(rainWidth, snowSize, uSnowBlend);\n  float streakLength = mix(rainLength, snowSize, uSnowBlend);\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "varying vec2 vUv;\nvarying float vAlpha;\n\n#include <fog_pars_fragment>\n",
              "uniform float uSnowBlend;\n\nvarying vec2 vUv;\nvarying float vAlpha;\n\n#include <fog_pars_fragment>\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "  float across = 1.0 - smoothstep(0.28, 0.5, abs(vUv.x - 0.5));\n  float headFade = smoothstep(0.0, 0.15, vUv.y);\n  float tailFade = 1.0 - smoothstep(0.72, 1.0, vUv.y);\n  float alpha = across * headFade * tailFade * vAlpha;\n\n  if (alpha < 0.01) discard;\n\n  vec3 rainColor = mix(vec3(0.55, 0.72, 0.86), vec3(0.92, 0.97, 1.0), vUv.y);\n  gl_FragColor = vec4(rainColor, alpha);\n",
              "  float across = 1.0 - smoothstep(0.28, 0.5, abs(vUv.x - 0.5));\n  float headFade = smoothstep(0.0, 0.15, vUv.y);\n  float tailFade = 1.0 - smoothstep(0.72, 1.0, vUv.y);\n  float rainAlpha = across * headFade * tailFade;\n  float snowAlpha =\n    1.0 - smoothstep(0.24, 0.5, length(vUv - vec2(0.5)));\n  float alpha = mix(rainAlpha, snowAlpha, uSnowBlend) * vAlpha;\n\n  if (alpha < 0.01) discard;\n\n  vec3 rainColor = mix(\n    vec3(0.55, 0.72, 0.86),\n    vec3(0.92, 0.97, 1.0),\n    vUv.y\n  );\n  vec3 snowColor = vec3(0.94, 0.98, 1.0);\n  gl_FragColor = vec4(mix(rainColor, snowColor, uSnowBlend), alpha);\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "  const lightningFlashRef = useRef(0);\n  const cameraDirection = useRef(new Vector3());\n",
              "  const lightningFlashRef = useRef(0);\n  const precipitationTimeRef = useRef(0);\n  const precipitationWindRef = useRef(new Vector2());\n  const windSourceOffsetRef = useRef(new Vector2());\n  const cameraDirection = useRef(new Vector3());\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "            uStormIntensity: { value: 0 },\n            uCameraPosition: { value: new Vector3() },\n",
              "            uStormIntensity: { value: 0 },\n            uSnowBlend: { value: 0 },\n            uCameraPosition: { value: new Vector3() },\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "    const { windSpeed, windDir, renderQuality } = useSimStore.getState();\n    const stormIntensity = MathUtils.clamp((windSpeed - 15) / 35, 0, 1);\n    const windRadians = MathUtils.degToRad(windDir);\n    const windX = Math.cos(windRadians) * windSpeed * 0.4;\n    const windZ = Math.sin(windRadians) * windSpeed * 0.4;\n\n    rainGeometry.instanceCount = RAIN_COUNT_BY_QUALITY[renderQuality];\n    rainMaterial.uniforms.uTime.value = state.clock.elapsedTime;\n    rainMaterial.uniforms.uStormIntensity.value = stormIntensity;\n    rainMaterial.uniforms.uCameraPosition.value.copy(state.camera.position);\n    rainMaterial.uniforms.uWind.value.set(windX, windZ);\n",
              "    const { windSpeed, windDir, renderQuality } = useSimStore.getState();\n    const stormIntensity = MathUtils.clamp((windSpeed - 15) / 35, 0, 1);\n    const winter = MathUtils.clamp(\n      1 - Math.abs(sharedPhysics.season - 0.75) * 4,\n      0,\n      1,\n    );\n    const snowBlend =\n      winter * MathUtils.clamp((windSpeed + 2) / 20, 0.15, 1);\n    const precipitationIntensity = Math.max(\n      stormIntensity,\n      snowBlend * MathUtils.clamp(windSpeed / 22, 0.18, 0.72),\n    );\n    precipitationTimeRef.current += safeDelta;\n    setWorldXZFromHeading(\n      precipitationWindRef.current,\n      windDir,\n      windSpeed * MathUtils.lerp(0.4, 0.62, snowBlend),\n    );\n\n    rainGeometry.instanceCount = RAIN_COUNT_BY_QUALITY[renderQuality];\n    rainMaterial.uniforms.uTime.value = precipitationTimeRef.current;\n    rainMaterial.uniforms.uStormIntensity.value = precipitationIntensity;\n    rainMaterial.uniforms.uSnowBlend.value = snowBlend;\n    rainMaterial.uniforms.uCameraPosition.value.copy(state.camera.position);\n    rainMaterial.uniforms.uWind.value.copy(precipitationWindRef.current);\n",
          )
          replace_once(
              'components/WeatherEffects.tsx',
              "      const pannerDistance = 50;\n      if (windPanner.positionX) {\n        windPanner.positionX.setTargetAtTime(\n          cameraPosition.x - Math.cos(windRadians) * pannerDistance,\n          now,\n          0.1,\n        );\n        windPanner.positionY.setTargetAtTime(cameraPosition.y, now, 0.1);\n        windPanner.positionZ.setTargetAtTime(\n          cameraPosition.z - Math.sin(windRadians) * pannerDistance,\n          now,\n          0.1,\n        );\n      }\n",
              "      const pannerDistance = 50;\n      setWorldXZFromHeading(\n        windSourceOffsetRef.current,\n        windDir,\n        pannerDistance,\n      );\n      if (windPanner.positionX) {\n        windPanner.positionX.setTargetAtTime(\n          cameraPosition.x - windSourceOffsetRef.current.x,\n          now,\n          0.1,\n        );\n        windPanner.positionY.setTargetAtTime(cameraPosition.y, now, 0.1);\n        windPanner.positionZ.setTargetAtTime(\n          cameraPosition.z - windSourceOffsetRef.current.y,\n          now,\n          0.1,\n        );\n      }\n",
          )

          # Wave headings rotate around the current default 90° sea state.
          replace_once(
              'components/Ocean.tsx',
              "import type { WaterSurfaceSample } from '@/sim/water/WaterSurface';\n",
              "import type { WaterSurfaceSample } from '@/sim/water/WaterSurface';\nimport {\n  normalizeHeadingDegrees,\n  normalizeSignedHeadingDeltaDegrees,\n  rotateWorldDirection,\n} from '@/sim/world/WorldDirection';\n",
          )
          replace_section(
              'components/Ocean.tsx',
              'const CACHED_WAVES: GerstnerWaveDefinition[] = [',
              'const vertexShader = `',
              """const REFERENCE_WAVE_WIND_HEADING_DEG = 90;
          const BASE_WAVES: readonly GerstnerWaveDefinition[] = [
            { x: 0.894427, y: 0.447214, z: 0.12, w: 30 },
            { x: 0.707107, y: 0.707107, z: 0.1, w: 12 },
            { x: -0.196116, y: 0.980581, z: 0.08, w: 7 },
            { x: 0.707107, y: -0.707107, z: 0.05, w: 3 },
          ];
          const CACHED_WAVES: GerstnerWaveDefinition[] = BASE_WAVES.map(
            (wave) => ({ ...wave }),
          );
          let cachedWindSpeed = Number.NaN;
          let cachedWindDir = Number.NaN;

          """.replace('          ', ''),
          )
          replace_section(
              'components/Ocean.tsx',
              'export const getWaveData = () => {',
              'export const sampleOceanSurface = (',
              """export const getWaveData = () => {
            const { windSpeed, windDir } = useSimStore.getState();
            const normalizedWindDir = normalizeHeadingDegrees(windDir);
            const windHeadingChanged =
              !Number.isFinite(cachedWindDir) ||
              Math.abs(
                normalizeSignedHeadingDeltaDegrees(
                  normalizedWindDir - cachedWindDir,
                ),
              ) >= 0.001;

            if (
              Math.abs(windSpeed - cachedWindSpeed) < 0.001 &&
              !windHeadingChanged
            ) {
              return CACHED_WAVES;
            }

            cachedWindSpeed = windSpeed;
            cachedWindDir = normalizedWindDir;
            let stormFactor = Math.max(0.1, windSpeed / 8);
            let rogueWaveBoost = 0;

            if (windSpeed > 35) {
              rogueWaveBoost = (windSpeed - 35) * 0.2;
              stormFactor += rogueWaveBoost;
            }

            const steepness = Math.min(stormFactor, 1.8);
            const waveScale = 1 + stormFactor * 1.2 + rogueWaveBoost * 1.5;
            const directionRotationDeg = normalizeSignedHeadingDeltaDegrees(
              normalizedWindDir - REFERENCE_WAVE_WIND_HEADING_DEG,
            );

            for (let index = 0; index < BASE_WAVES.length; index += 1) {
              const baseWave = BASE_WAVES[index];
              const wave = CACHED_WAVES[index];
              const direction = rotateWorldDirection(
                baseWave.x,
                baseWave.y,
                directionRotationDeg,
              );
              wave.x = direction.x;
              wave.y = direction.z;
            }

            CACHED_WAVES[0].z = BASE_WAVES[0].z * steepness;
            CACHED_WAVES[0].w = BASE_WAVES[0].w * waveScale;
            CACHED_WAVES[1].z = BASE_WAVES[1].z * steepness;
            CACHED_WAVES[1].w = BASE_WAVES[1].w * waveScale;
            CACHED_WAVES[2].z = BASE_WAVES[2].z * steepness;
            CACHED_WAVES[2].w =
              BASE_WAVES[2].w + stormFactor * 2 + rogueWaveBoost;
            CACHED_WAVES[3].z = BASE_WAVES[3].z * steepness;
            CACHED_WAVES[3].w =
              BASE_WAVES[3].w + stormFactor + rogueWaveBoost;

            return CACHED_WAVES;
          };

          """.replace('          ', ''),
          )

          # The UI states the travel-toward semantic explicitly.
          replace_once(
              'components/HUD.tsx',
              '        label="Wind direction"\n',
              '        label="Wind heading (toward)"\n',
          )
          replace_once(
              'components/HUD.tsx',
              '        label="Current direction"\n',
              '        label="Current heading (toward)"\n',
