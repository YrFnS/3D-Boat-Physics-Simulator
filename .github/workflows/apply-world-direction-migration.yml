          )
          replace_once(
              'package.json',
              '"test:physics": "npm run test:runtime-authority && npm run test:world-environment && ',
              '"test:physics": "npm run test:runtime-authority && npm run test:world-environment && npm run test:world-direction && ',
          )
          PY

