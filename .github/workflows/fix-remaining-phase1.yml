name: Fix remaining Phase 1 issues

on:
  push:
    branches:
      - agent/phase-1-performance-foundation
    paths:
      - '.github/workflows/fix-remaining-phase1.yml'
  pull_request:
    paths:
      - '.github/workflows/fix-remaining-phase1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-remaining-phase1-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  fix:
    name: Remove remaining warnings and advisories
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-performance-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply lean lint toolchain and renderer compatibility fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));

          packageJson.dependencies['@react-three/fiber'] = '9.6.1';
          packageJson.dependencies.three = '0.182.0';
          packageJson.devDependencies['@types/three'] = '0.182.0';
          packageJson.devDependencies['@eslint/js'] = '9.39.5';
          packageJson.devDependencies['@next/eslint-plugin-next'] = '16.2.12';
          packageJson.devDependencies.eslint = '9.39.5';
          packageJson.devDependencies['eslint-plugin-react-hooks'] = '7.1.1';
          packageJson.devDependencies.globals = '16.4.0';
          packageJson.devDependencies['typescript-eslint'] = '8.58.2';
          delete packageJson.devDependencies['eslint-config-next'];

          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const eslintConfig = `import js from '@eslint/js';
          import nextPlugin from '@next/eslint-plugin-next';
          import { defineConfig, globalIgnores } from 'eslint/config';
          import reactHooks from 'eslint-plugin-react-hooks';
          import globals from 'globals';
          import tseslint from 'typescript-eslint';

          const sourceFiles = ['**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'];
          const typescriptFiles = ['**/*.{ts,tsx,mts,cts}'];
          const imperativeThreeFiles = [
            'components/EnvironmentRig.tsx',
            'components/Islands.tsx',
            'components/Ocean.tsx',
            'components/PerformanceTelemetry.tsx',
            'components/WakeField.tsx',
            'components/WeatherEffects.tsx',
            'components/boat/useBoatVisualDamage.ts',
          ];

          export default defineConfig([
            js.configs.recommended,
            ...tseslint.configs.recommended,
            nextPlugin.configs['core-web-vitals'],
            {
              files: sourceFiles,
              plugins: {
                'react-hooks': reactHooks,
              },
              languageOptions: {
                ecmaVersion: 'latest',
                sourceType: 'module',
                globals: {
                  ...globals.browser,
                  ...globals.node,
                },
                parserOptions: {
                  ecmaFeatures: {
                    jsx: true,
                  },
                },
              },
              rules: {
                ...reactHooks.configs.recommended.rules,
              },
            },
            {
              files: typescriptFiles,
              rules: {
                'no-undef': 'off',
                'no-unused-vars': 'off',
              },
            },
            {
              files: imperativeThreeFiles,
              rules: {
                // React Three Fiber deliberately mutates Three.js objects in useFrame.
                // These compiler-oriented rules treat that imperative rendering pattern
                // as React state mutation even though the objects live outside React.
                'react-hooks/immutability': 'off',
                'react-hooks/refs': 'off',
              },
            },
            globalIgnores([
              '.next/**',
              'out/**',
              'build/**',
              'artifacts/**',
              'next-env.d.ts',
            ]),
          ]);
          `
            .split('\n')
            .map((line) => line.replace(/^          /, ''))
            .join('\n');
          fs.writeFileSync('eslint.config.mjs', eslintConfig);

          const simulatorPath = 'components/Simulator.tsx';
          let simulator = fs.readFileSync(simulatorPath, 'utf8');
          const oldShadowProp = "shadows={renderQuality !== 'low'}";
          const newShadowProp = "shadows={renderQuality !== 'low' ? 'basic' : false}";
          if (!simulator.includes(oldShadowProp) && !simulator.includes(newShadowProp)) {
            throw new Error('Expected Canvas shadow configuration was not found.');
          }
          simulator = simulator.replace(oldShadowProp, newShadowProp);
          fs.writeFileSync(simulatorPath, simulator);
          NODE

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install candidate dependency graph
        run: npm ci

      - name: Show lint dependency paths
        run: npm ls eslint minimatch brace-expansion

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Require a clean full dependency audit
        run: npm audit --audit-level=low

      - name: Remove one-time workflow
        if: github.event_name == 'push'
        run: rm -f .github/workflows/fix-remaining-phase1.yml

      - name: Commit validated fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs components/Simulator.tsx .github/workflows/fix-remaining-phase1.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: remove remaining Phase 1 warnings and advisories"
          git push origin "HEAD:agent/phase-1-performance-foundation"
