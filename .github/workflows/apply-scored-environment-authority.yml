name: Apply scored environment authority

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: scored-environment-authority
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply scored environment authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:180]!r}'
                  )
              write(path, source.replace(old, new, 1))

          scored_authority = dedent(r'''
            export type ScenarioRunMode = 'standard' | 'assisted';

            export type ScoredScenarioRunStatus =
              | 'inactive'
              | 'active'
              | 'completed'
              | 'failed';

            export interface ScenarioEnvironmentSnapshot {
              windSpeed: number;
              windDir: number;
              currentSpeed: number;
              currentDir: number;
              targetTime: number;
              targetSeason: number;
            }

            export interface ScenarioHistoryPolicyRecord<TBoat extends string> {
              attempts: number;
              completions: number;
              failures: number;
              bestScore: number;
              bestTimeSeconds: number | null;
              bestHullHealth: number;
              lastScore: number;
              lastOutcome: 'completed' | 'failed' | null;
              lastBoat: TBoat | null;
              lastPlayedAt: string | null;
              assistedAttempts: number;
              assistedCompletions: number;
              assistedFailures: number;
            }

            export interface ScenarioHistoryPolicyResult {
              outcome: 'completed' | 'failed';
              score: number;
              elapsedSeconds: number;
              hullHealth: number;
              runMode: ScenarioRunMode;
            }

            export const ASSISTED_ENVIRONMENT_REASON =
              'Custom wind, current, time, or season controls were enabled.';

            const FULL_CIRCLE_DEGREES = 360;
            const FULL_DAY_HOURS = 24;
            const FULL_SEASON_CYCLE = 1;
            const ENVIRONMENT_EPSILON = 1e-6;

            function finiteOr(value: number, fallback = 0) {
              return Number.isFinite(value) ? value : fallback;
            }

            function normalizeCycle(value: number, cycle: number) {
              const finiteValue = finiteOr(value);
              return ((finiteValue % cycle) + cycle) % cycle;
            }

            export function normalizeScenarioHeadingDegrees(value: number) {
              return normalizeCycle(value, FULL_CIRCLE_DEGREES);
            }

            export function normalizeScenarioTimeHours(value: number) {
              return normalizeCycle(value, FULL_DAY_HOURS);
            }

            export function normalizeScenarioSeason(value: number) {
              return normalizeCycle(value, FULL_SEASON_CYCLE);
            }

            export function scenarioEnvironmentFromDefinition(
              scenario: ScenarioEnvironmentSnapshot,
            ): ScenarioEnvironmentSnapshot {
              return {
                windSpeed: Math.max(0, finiteOr(scenario.windSpeed)),
                windDir: normalizeScenarioHeadingDegrees(scenario.windDir),
                currentSpeed: Math.max(0, finiteOr(scenario.currentSpeed)),
                currentDir: normalizeScenarioHeadingDegrees(scenario.currentDir),
                targetTime: normalizeScenarioTimeHours(scenario.targetTime),
                targetSeason: normalizeScenarioSeason(scenario.targetSeason),
              };
            }

            export function canEditScenarioEnvironment(
              runStatus: ScoredScenarioRunStatus,
              runMode: ScenarioRunMode,
            ) {
              return runStatus !== 'active' || runMode === 'assisted';
            }

            export function isScenarioEnvironmentLocked(
              runStatus: ScoredScenarioRunStatus,
              runMode: ScenarioRunMode,
            ) {
              return !canEditScenarioEnvironment(runStatus, runMode);
            }

            function headingDifferenceDegrees(a: number, b: number) {
              const difference = normalizeScenarioHeadingDegrees(a - b);
              return Math.min(difference, FULL_CIRCLE_DEGREES - difference);
            }

            export function scenarioEnvironmentMatchesPreset(
              environment: ScenarioEnvironmentSnapshot,
              preset: ScenarioEnvironmentSnapshot,
              epsilon = ENVIRONMENT_EPSILON,
            ) {
              const tolerance = Number.isFinite(epsilon)
                ? Math.max(0, epsilon)
                : ENVIRONMENT_EPSILON;
              return (
                Math.abs(environment.windSpeed - preset.windSpeed) <= tolerance &&
                headingDifferenceDegrees(environment.windDir, preset.windDir) <= tolerance &&
                Math.abs(environment.currentSpeed - preset.currentSpeed) <= tolerance &&
                headingDifferenceDegrees(environment.currentDir, preset.currentDir) <= tolerance &&
                Math.abs(
                  normalizeScenarioTimeHours(environment.targetTime) -
                    normalizeScenarioTimeHours(preset.targetTime),
                ) <= tolerance &&
                Math.abs(
                  normalizeScenarioSeason(environment.targetSeason) -
                    normalizeScenarioSeason(preset.targetSeason),
                ) <= tolerance
              );
            }

            /**
             * Assisted attempts are deliberately separated from standard records.
             * They may still display an informational score, but they cannot alter
             * standard attempts, completions, best score, best time, or best hull.
             */
            export function applyScenarioHistoryResult<TBoat extends string>(
              current: ScenarioHistoryPolicyRecord<TBoat>,
              boat: TBoat,
              result: ScenarioHistoryPolicyResult,
              playedAt = new Date().toISOString(),
            ): ScenarioHistoryPolicyRecord<TBoat> {
              const completed = result.outcome === 'completed';

              if (result.runMode === 'assisted') {
                return {
                  ...current,
                  assistedAttempts: current.assistedAttempts + 1,
                  assistedCompletions:
                    current.assistedCompletions + (completed ? 1 : 0),
                  assistedFailures:
                    current.assistedFailures + (completed ? 0 : 1),
                };
              }

              const bestTimeSeconds = completed
                ? current.bestTimeSeconds === null
                  ? result.elapsedSeconds
                  : Math.min(current.bestTimeSeconds, result.elapsedSeconds)
                : current.bestTimeSeconds;

              return {
                ...current,
                attempts: current.attempts + 1,
                completions: current.completions + (completed ? 1 : 0),
                failures: current.failures + (completed ? 0 : 1),
                bestScore: completed
                  ? Math.max(current.bestScore, result.score)
                  : current.bestScore,
                bestTimeSeconds,
                bestHullHealth: completed
                  ? Math.max(current.bestHullHealth, result.hullHealth)
                  : current.bestHullHealth,
                lastScore: result.score,
                lastOutcome: result.outcome,
                lastBoat: boat,
                lastPlayedAt: playedAt,
              };
            }
          ''').lstrip()
          write('sim/scenarios/ScoredScenarioAuthority.ts', scored_authority)

          contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              applyScenarioHistoryResult,
              ASSISTED_ENVIRONMENT_REASON,
              canEditScenarioEnvironment,
              isScenarioEnvironmentLocked,
              scenarioEnvironmentFromDefinition,
              scenarioEnvironmentMatchesPreset,
            } from '../sim/scenarios/ScoredScenarioAuthority.ts';

            const preset = scenarioEnvironmentFromDefinition({
              windSpeed: 8,
              windDir: 450,
              currentSpeed: 1.5,
              currentDir: -345,
              targetTime: 36,
              targetSeason: 1.25,
            });
            assert.deepEqual(preset, {
              windSpeed: 8,
              windDir: 90,
              currentSpeed: 1.5,
              currentDir: 15,
              targetTime: 12,
              targetSeason: 0.25,
            });
            assert.equal(
              isScenarioEnvironmentLocked('active', 'standard'),
              true,
              'A standard active mission must lock its environment.',
            );
            assert.equal(
              canEditScenarioEnvironment('active', 'standard'),
              false,
              'Standard active runs must reject environment changes.',
            );
            assert.equal(
              canEditScenarioEnvironment('active', 'assisted'),
              true,
              'Explicitly assisted runs may edit the environment.',
            );
            assert.equal(
              canEditScenarioEnvironment('inactive', 'standard'),
              true,
              'Briefing previews may edit environment values.',
            );
            assert.equal(
              scenarioEnvironmentMatchesPreset(
                { ...preset, windDir: -270, currentDir: 375 },
                preset,
              ),
              true,
              'Equivalent wrapped headings must match the preset.',
            );
            assert.equal(
              scenarioEnvironmentMatchesPreset(
                { ...preset, windSpeed: 8.1 },
                preset,
              ),
              false,
              'A material environment change must not match the preset.',
            );
            assert.ok(ASSISTED_ENVIRONMENT_REASON.includes('Custom wind'));

            const emptyRecord = {
              attempts: 0,
              completions: 0,
              failures: 0,
              bestScore: 0,
              bestTimeSeconds: null,
              bestHullHealth: 0,
              lastScore: 0,
              lastOutcome: null,
              lastBoat: null,
              lastPlayedAt: null,
              assistedAttempts: 0,
              assistedCompletions: 0,
              assistedFailures: 0,
            };
            const standardResult = {
              outcome: 'completed',
              score: 840,
              elapsedSeconds: 95,
              hullHealth: 92,
              runMode: 'standard',
            };
            const standardRecord = applyScenarioHistoryResult(
              emptyRecord,
              'trawler',
              standardResult,
              '2026-08-05T00:00:00.000Z',
            );
            assert.equal(standardRecord.attempts, 1);
            assert.equal(standardRecord.completions, 1);
            assert.equal(standardRecord.bestScore, 840);
            assert.equal(standardRecord.bestTimeSeconds, 95);
            assert.equal(standardRecord.bestHullHealth, 92);
            assert.equal(standardRecord.assistedAttempts, 0);

            const assistedRecord = applyScenarioHistoryResult(
              standardRecord,
              'speedboat',
              {
                outcome: 'completed',
                score: 999,
                elapsedSeconds: 20,
                hullHealth: 100,
                runMode: 'assisted',
              },
              '2026-08-05T00:01:00.000Z',
            );
            assert.equal(assistedRecord.assistedAttempts, 1);
            assert.equal(assistedRecord.assistedCompletions, 1);
            assert.equal(assistedRecord.attempts, 1);
            assert.equal(assistedRecord.completions, 1);
            assert.equal(assistedRecord.bestScore, 840);
            assert.equal(assistedRecord.bestTimeSeconds, 95);
            assert.equal(assistedRecord.bestHullHealth, 92);
            assert.equal(assistedRecord.lastBoat, 'trawler');

            const storeSource = await fs.readFile(
              new URL('../store/useSimStore.ts', import.meta.url),
              'utf8',
            );
            const hudSource = await fs.readFile(
              new URL('../components/HUD.tsx', import.meta.url),
              'utf8',
            );
            const directorSource = await fs.readFile(
              new URL('../components/ScenarioDirector.tsx', import.meta.url),
              'utf8',
            );
            const historySource = await fs.readFile(
              new URL('../store/useScenarioHistory.ts', import.meta.url),
              'utf8',
            );
            const resultSource = await fs.readFile(
              new URL('../components/ScenarioResultOverlay.tsx', import.meta.url),
              'utf8',
            );
            const persistenceSource = await fs.readFile(
              new URL('../components/ExperiencePersistence.tsx', import.meta.url),
              'utf8',
            );

            assert.match(
              storeSource,
              /canEditScenarioEnvironment\(\s*state\.scenarioRunStatus,\s*state\.scenarioRunMode/,
              'Every environment setter must enforce the scored-run guard.',
            );
            assert.match(
              storeSource,
              /enableAssistedConditions:/,
              'The store must expose an explicit assisted-mode transition.',
            );
            assert.match(
              hudSource,
              /Use custom conditions/,
              'The HUD must disclose and explicitly unlock custom conditions.',
            );
            assert.match(
              hudSource,
              /disabled=\{environmentLocked\}/,
              'Standard mission environment controls must be disabled in the HUD.',
            );
            assert.match(
              directorSource,
              /runMode: latestStore\.scenarioRunMode/,
              'Mission results must retain their standard or assisted authority.',
            );
            assert.match(
              historySource,
              /applyScenarioHistoryResult/,
              'Scenario history must use the assisted-exclusion policy.',
            );
            assert.match(
              resultSource,
              /Assisted score/,
              'The result UI must label assisted scoring explicitly.',
            );
            assert.match(
              persistenceSource,
              /simScenarioEnvironmentLocked/,
              'Browser validation must be able to observe the environment lock.',
            );

            console.log('Scored scenario environment authority contract passed.');
          ''').lstrip()
          write('scripts/scored-scenario-environment-contract.mjs', contract)

          # Store authority and result metadata.
          replace_once(
              'store/useSimStore.ts',
              "} from '@/sim/scenarios/ScenarioCatalog';\n\nexport type BoatType",
              "} from '@/sim/scenarios/ScenarioCatalog';\nimport {\n  ASSISTED_ENVIRONMENT_REASON,\n  canEditScenarioEnvironment,\n  normalizeScenarioSeason,\n  normalizeScenarioTimeHours,\n  scenarioEnvironmentFromDefinition,\n  type ScenarioRunMode,\n} from '@/sim/scenarios/ScoredScenarioAuthority';\n\nexport type BoatType",
          )
          replace_once(
              'store/useSimStore.ts',
              "  outcome: 'completed' | 'failed';\n  reason: string;\n  elapsedSeconds: number;\n",
              "  outcome: 'completed' | 'failed';\n  reason: string;\n  runMode: ScenarioRunMode;\n  assistanceReason: string | null;\n  elapsedSeconds: number;\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "  return {\n    scenarioRunStatus,\n    activeWaypointIndex: 0,\n",
              "  return {\n    scenarioRunStatus,\n    scenarioRunMode: 'standard' as ScenarioRunMode,\n    scenarioAssistanceReason: '',\n    activeWaypointIndex: 0,\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "  scenarioRunStatus: ScenarioRunStatus;\n  scenarioRunId: number;\n  activeWaypointIndex: number;\n",
              "  scenarioRunStatus: ScenarioRunStatus;\n  scenarioRunId: number;\n  scenarioRunMode: ScenarioRunMode;\n  scenarioAssistanceReason: string;\n  activeWaypointIndex: number;\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "  setTargetTime: (value: number) => void;\n  setTargetSeason: (value: number) => void;\n  setQualityMode: (mode: QualityMode) => void;\n",
              "  setTargetTime: (value: number) => void;\n  setTargetSeason: (value: number) => void;\n  enableAssistedConditions: () => void;\n  restoreScenarioEnvironment: () => void;\n  setQualityMode: (mode: QualityMode) => void;\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "  setWindSpeed: (windSpeed) => set({ windSpeed }),\n  setWindDir: (windDir) =>\n    set({ windDir: normalizeHeadingDegrees(windDir) }),\n  setCurrentSpeed: (currentSpeed) => set({ currentSpeed }),\n  setCurrentDir: (currentDir) =>\n    set({ currentDir: normalizeHeadingDegrees(currentDir) }),\n",
              "  setWindSpeed: (windSpeed) =>\n    set((state) =>\n      canEditScenarioEnvironment(\n        state.scenarioRunStatus,\n        state.scenarioRunMode,\n      )\n        ? { windSpeed: MathUtils.clamp(windSpeed, 0, 60) }\n        : {},\n    ),\n  setWindDir: (windDir) =>\n    set((state) =>\n      canEditScenarioEnvironment(\n        state.scenarioRunStatus,\n        state.scenarioRunMode,\n      )\n        ? { windDir: normalizeHeadingDegrees(windDir) }\n        : {},\n    ),\n  setCurrentSpeed: (currentSpeed) =>\n    set((state) =>\n      canEditScenarioEnvironment(\n        state.scenarioRunStatus,\n        state.scenarioRunMode,\n      )\n        ? { currentSpeed: MathUtils.clamp(currentSpeed, 0, 10) }\n        : {},\n    ),\n  setCurrentDir: (currentDir) =>\n    set((state) =>\n      canEditScenarioEnvironment(\n        state.scenarioRunStatus,\n        state.scenarioRunMode,\n      )\n        ? { currentDir: normalizeHeadingDegrees(currentDir) }\n        : {},\n    ),\n",
          )
          # MathUtils is not imported in the store; use local clamps instead.
          replace_once(
              'store/useSimStore.ts',
              "MathUtils.clamp(windSpeed, 0, 60)",
              "Math.max(0, Math.min(60, windSpeed))",
          )
          replace_once(
              'store/useSimStore.ts',
              "MathUtils.clamp(currentSpeed, 0, 10)",
              "Math.max(0, Math.min(10, currentSpeed))",
          )
          replace_once(
              'store/useSimStore.ts',
              "  setTargetTime: (targetTime) => set({ targetTime }),\n  setTargetSeason: (targetSeason) => set({ targetSeason }),\n  setQualityMode: (qualityMode) =>\n",
              "  setTargetTime: (targetTime) =>\n    set((state) =>\n      canEditScenarioEnvironment(\n        state.scenarioRunStatus,\n        state.scenarioRunMode,\n      )\n        ? { targetTime: normalizeScenarioTimeHours(targetTime) }\n        : {},\n    ),\n  setTargetSeason: (targetSeason) =>\n    set((state) =>\n      canEditScenarioEnvironment(\n        state.scenarioRunStatus,\n        state.scenarioRunMode,\n      )\n        ? { targetSeason: normalizeScenarioSeason(targetSeason) }\n        : {},\n    ),\n  enableAssistedConditions: () =>\n    set((state) =>\n      state.scenarioRunStatus === 'active' &&\n      state.scenarioRunMode === 'standard'\n        ? {\n            scenarioRunMode: 'assisted',\n            scenarioAssistanceReason: ASSISTED_ENVIRONMENT_REASON,\n            scenarioEventMessage:\n              'Assisted conditions enabled. This attempt is excluded from standard records.',\n          }\n        : {},\n    ),\n  restoreScenarioEnvironment: () => {\n    const state = get();\n    const scenario = getScenarioDefinition(state.activeScenario);\n    set({\n      ...scenarioEnvironmentFromDefinition(scenario),\n      scenarioEventMessage:\n        state.scenarioRunStatus === 'active' &&\n        state.scenarioRunMode === 'assisted'\n          ? 'Scenario preset restored. This attempt remains assisted.'\n          : state.scenarioEventMessage,\n    });\n  },\n  setQualityMode: (qualityMode) =>\n",
          )
          replace_once(
              'store/useSimStore.ts',
              "    queueScenarioSpawn(0, 0, 0);\n    set({\n      activeBoat,\n",
              "    const scenario = getScenarioDefinition(state.activeScenario);\n    queueScenarioSpawn(0, 0, 0);\n    set({\n      activeBoat,\n      ...scenarioEnvironmentFromDefinition(scenario),\n",
          )
          for path in ['store/useSimStore.ts']:
              replace_once(
                  path,
                  "      windSpeed: scenario.windSpeed,\n      windDir: scenario.windDir,\n      currentSpeed: scenario.currentSpeed,\n      currentDir: scenario.currentDir,\n      targetTime: scenario.targetTime,\n      targetSeason: scenario.targetSeason,\n",
                  "      ...scenarioEnvironmentFromDefinition(scenario),\n",
              )
              replace_once(
                  path,
                  "      windSpeed: scenario.windSpeed,\n      windDir: scenario.windDir,\n      currentSpeed: scenario.currentSpeed,\n      currentDir: scenario.currentDir,\n      targetTime: scenario.targetTime,\n      targetSeason: scenario.targetSeason,\n",
                  "      ...scenarioEnvironmentFromDefinition(scenario),\n",
              )
              replace_once(
                  path,
                  "      windSpeed: scenario.windSpeed,\n      windDir: scenario.windDir,\n      currentSpeed: scenario.currentSpeed,\n      currentDir: scenario.currentDir,\n      targetTime: scenario.targetTime,\n      targetSeason: scenario.targetSeason,\n",
                  "      ...scenarioEnvironmentFromDefinition(scenario),\n",
              )
              replace_once(
                  path,
                  "        windSpeed: scenario.windSpeed,\n        windDir: scenario.windDir,\n        currentSpeed: scenario.currentSpeed,\n        currentDir: scenario.currentDir,\n        targetTime: scenario.targetTime,\n        targetSeason: scenario.targetSeason,\n",
                  "        ...scenarioEnvironmentFromDefinition(scenario),\n",
              )
          replace_once(
              'store/useSimStore.ts',
              "  returnToMenu: () =>\n    set({\n      sessionPhase: 'menu',\n      engineThrust: 0,\n      keys: createEmptyKeys(),\n      ...createScenarioGameplayState('inactive'),\n    }),\n",
              "  returnToMenu: () => {\n    const scenario = getScenarioDefinition(get().activeScenario);\n    set({\n      sessionPhase: 'menu',\n      ...scenarioEnvironmentFromDefinition(scenario),\n      engineThrust: 0,\n      keys: createEmptyKeys(),\n      ...createScenarioGameplayState('inactive'),\n    });\n  },\n",
          )

          # Mission results carry run authority.
          replace_once(
              'components/ScenarioDirector.tsx',
              "      const baseResult = {\n        elapsedSeconds: missionStatistics.elapsedSeconds,\n",
              "      const baseResult = {\n        runMode: latestStore.scenarioRunMode,\n        assistanceReason:\n          latestStore.scenarioAssistanceReason || null,\n        elapsedSeconds: missionStatistics.elapsedSeconds,\n",
          )

          # History records keep assisted attempts separate from standard records.
          history_source = dedent(r'''
            import { create } from 'zustand';
            import {
              SCENARIOS,
              type ScenarioId,
            } from '@/sim/scenarios/ScenarioCatalog';
            import {
              applyScenarioHistoryResult,
              type ScenarioHistoryPolicyRecord,
            } from '@/sim/scenarios/ScoredScenarioAuthority';
            import type { BoatType, ScenarioResult } from '@/store/useSimStore';

            export interface ScenarioHistoryRecord
              extends ScenarioHistoryPolicyRecord<BoatType> {}

            export type ScenarioHistorySnapshot = Record<
              ScenarioId,
              ScenarioHistoryRecord
            >;

            interface ScenarioHistoryState {
              hydrated: boolean;
              records: ScenarioHistorySnapshot;
              hydrate: (records: Partial<ScenarioHistorySnapshot>) => void;
              recordResult: (
                scenarioId: ScenarioId,
                boat: BoatType,
                result: ScenarioResult,
              ) => void;
              clearHistory: () => void;
            }

            function createEmptyRecord(): ScenarioHistoryRecord {
              return {
                attempts: 0,
                completions: 0,
                failures: 0,
                bestScore: 0,
                bestTimeSeconds: null,
                bestHullHealth: 0,
                lastScore: 0,
                lastOutcome: null,
                lastBoat: null,
                lastPlayedAt: null,
                assistedAttempts: 0,
                assistedCompletions: 0,
                assistedFailures: 0,
              };
            }

            function createEmptyHistory(): ScenarioHistorySnapshot {
              return Object.fromEntries(
                SCENARIOS.map((scenario) => [scenario.id, createEmptyRecord()]),
              ) as ScenarioHistorySnapshot;
            }

            function finiteNonNegative(value: unknown, fallback: number) {
              return typeof value === 'number' && Number.isFinite(value) && value >= 0
                ? value
                : fallback;
            }

            function normalizeRecord(
              value: Partial<ScenarioHistoryRecord> | undefined,
            ): ScenarioHistoryRecord {
              const empty = createEmptyRecord();
              if (!value) return empty;

              return {
                attempts: Math.floor(finiteNonNegative(value.attempts, 0)),
                completions: Math.floor(finiteNonNegative(value.completions, 0)),
                failures: Math.floor(finiteNonNegative(value.failures, 0)),
                bestScore: Math.min(1_000, finiteNonNegative(value.bestScore, 0)),
                bestTimeSeconds:
                  typeof value.bestTimeSeconds === 'number' &&
                  Number.isFinite(value.bestTimeSeconds) &&
                  value.bestTimeSeconds >= 0
                    ? value.bestTimeSeconds
                    : null,
                bestHullHealth: Math.min(
                  100,
                  finiteNonNegative(value.bestHullHealth, 0),
                ),
                lastScore: Math.min(1_000, finiteNonNegative(value.lastScore, 0)),
                lastOutcome:
                  value.lastOutcome === 'completed' || value.lastOutcome === 'failed'
                    ? value.lastOutcome
                    : null,
                lastBoat:
                  value.lastBoat === 'trawler' || value.lastBoat === 'speedboat'
                    ? value.lastBoat
                    : null,
                lastPlayedAt:
                  typeof value.lastPlayedAt === 'string' ? value.lastPlayedAt : null,
                assistedAttempts: Math.floor(
                  finiteNonNegative(value.assistedAttempts, 0),
                ),
                assistedCompletions: Math.floor(
                  finiteNonNegative(value.assistedCompletions, 0),
                ),
                assistedFailures: Math.floor(
                  finiteNonNegative(value.assistedFailures, 0),
                ),
              };
            }

            export const useScenarioHistory = create<ScenarioHistoryState>((set) => ({
              hydrated: false,
              records: createEmptyHistory(),

              hydrate: (records) =>
                set({
                  hydrated: true,
                  records: Object.fromEntries(
                    SCENARIOS.map((scenario) => [
                      scenario.id,
                      normalizeRecord(records[scenario.id]),
                    ]),
                  ) as ScenarioHistorySnapshot,
                }),

              recordResult: (scenarioId, boat, result) =>
                set((state) => ({
                  records: {
                    ...state.records,
                    [scenarioId]: applyScenarioHistoryResult(
                      state.records[scenarioId],
                      boat,
                      result,
                    ),
                  },
                })),

              clearHistory: () =>
                set({
                  hydrated: true,
                  records: createEmptyHistory(),
                }),
            }));
          ''').lstrip()
          write('store/useScenarioHistory.ts', history_source)

          # Browser datasets expose run authority and history separation.
          replace_once(
              'components/ExperiencePersistence.tsx',
              "import {\n  type ExperiencePreferences,\n  type SimState,\n  useSimStore,\n} from '@/store/useSimStore';\n",
              "import {\n  isScenarioEnvironmentLocked,\n} from '@/sim/scenarios/ScoredScenarioAuthority';\nimport {\n  type ExperiencePreferences,\n  type SimState,\n  useSimStore,\n} from '@/store/useSimStore';\n",
          )
          replace_once(
              'components/ExperiencePersistence.tsx',
