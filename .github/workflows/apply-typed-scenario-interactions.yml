      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source, physics contracts, build, and dependencies
        run: npm run validate

      - name: Commit typed interactions and remove migration workflow
