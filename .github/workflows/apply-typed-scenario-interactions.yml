        run: |
          rm .github/workflows/apply-typed-scenario-interactions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add typed scenario interactions"
          git push origin HEAD:agent/simulator-stabilization
