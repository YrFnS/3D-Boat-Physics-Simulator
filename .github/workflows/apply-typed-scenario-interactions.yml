name: Apply typed scenario interactions

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: typed-scenario-interactions
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply typed mission interaction authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:180]!r}'
                  )
              write(path, source.replace(old, new, 1))

          interaction_runtime = dedent(r'''
            export type ScenarioInteractionEntityType =
              | 'navigation-gate'
              | 'cargo-pickup'
              | 'cargo-delivery'
              | 'rescue-pickup'
              | 'rescue-delivery'
              | 'storm-beacon';

            export interface ScenarioInteractionDefinition {
              holdSeconds?: number;
              maxSpeedKnots?: number;
              gateHalfWidthM?: number;
              gateApproachDistanceM?: number;
            }

            export interface ScenarioInteractionEntity {
              id: string;
              label: string;
              type: ScenarioInteractionEntityType;
              x: number;
              z: number;
              radiusM: number;
              headingDeg: number;
              interaction?: ScenarioInteractionDefinition;
            }

            export type ScenarioInteractionStatus =
              | 'idle'
              | 'blocked'
              | 'approach'
              | 'holding'
              | 'too-fast'
              | 'completed';

            export interface ScenarioInteractionTelemetry {
              entityId: string | null;
              status: ScenarioInteractionStatus;
              progress: number;
              message: string;
              holdSeconds: number;
              requiredHoldSeconds: number;
            }

            export interface ScenarioInteractionSample {
              runId: number;
              vesselGeneration: number;
              boatX: number;
              boatZ: number;
              speedKnots: number;
              deltaSeconds: number;
              prerequisiteMet: boolean;
              alreadyCompleted: boolean;
            }

            export interface ScenarioInteractionEvaluation
              extends ScenarioInteractionTelemetry {
              completed: boolean;
            }

            interface InteractionState {
              previousBoatX: number;
              previousBoatZ: number;
              hasPreviousPosition: boolean;
              gateArmed: boolean;
              holdSeconds: number;
            }

            interface HoldProfile {
              holdSeconds: number;
              maxSpeedKnots: number;
              zoneLabel: string;
            }

            const DEGREES_TO_RADIANS = Math.PI / 180;
            const FORWARD_CROSSING_EPSILON_M = 0.05;
            const GATE_LATERAL_MARGIN_M = 0.75;

            function finiteOr(value: number, fallback = 0) {
              return Number.isFinite(value) ? value : fallback;
            }

            function positiveOr(value: number | undefined, fallback: number) {
              return typeof value === 'number' && Number.isFinite(value) && value > 0
                ? value
                : fallback;
            }

            function clamp01(value: number) {
              return Math.max(0, Math.min(1, value));
            }

            function normalizeIdentity(value: number) {
              return Number.isFinite(value) ? Math.trunc(value) : -1;
            }

            export function createIdleScenarioInteractionTelemetry(): ScenarioInteractionTelemetry {
              return {
                entityId: null,
                status: 'idle',
                progress: 0,
                message: '',
                holdSeconds: 0,
                requiredHoldSeconds: 0,
              };
            }

            export function resolveNavigationGateHalfWidthM(
              entity: Pick<ScenarioInteractionEntity, 'radiusM' | 'interaction'>,
            ) {
              return positiveOr(
                entity.interaction?.gateHalfWidthM,
                Math.max(4, Math.min(9, finiteOr(entity.radiusM) * 0.42)),
              );
            }

            export function resolveNavigationGateApproachDistanceM(
              entity: Pick<ScenarioInteractionEntity, 'radiusM' | 'interaction'>,
            ) {
              return positiveOr(
                entity.interaction?.gateApproachDistanceM,
                Math.max(10, Math.min(24, finiteOr(entity.radiusM) * 0.9)),
              );
            }

            function resolveHoldProfile(
              entity: ScenarioInteractionEntity,
            ): HoldProfile {
              const configuredHold = entity.interaction?.holdSeconds;
              const configuredSpeed = entity.interaction?.maxSpeedKnots;

              switch (entity.type) {
                case 'cargo-pickup':
                  return {
                    holdSeconds: positiveOr(configuredHold, 1.5),
                    maxSpeedKnots: positiveOr(configuredSpeed, 3),
                    zoneLabel: 'loading zone',
                  };
                case 'cargo-delivery':
                  return {
                    holdSeconds: positiveOr(configuredHold, 2),
                    maxSpeedKnots: positiveOr(configuredSpeed, 2.5),
                    zoneLabel: 'delivery zone',
                  };
                case 'rescue-pickup':
                  return {
                    holdSeconds: positiveOr(configuredHold, 2.5),
                    maxSpeedKnots: positiveOr(configuredSpeed, 3.5),
                    zoneLabel: 'recovery zone',
                  };
                case 'rescue-delivery':
                  return {
                    holdSeconds: positiveOr(configuredHold, 2),
                    maxSpeedKnots: positiveOr(configuredSpeed, 5),
                    zoneLabel: 'transfer zone',
                  };
                case 'storm-beacon':
                  return {
                    holdSeconds: positiveOr(configuredHold, 5),
                    maxSpeedKnots: positiveOr(configuredSpeed, 6),
                    zoneLabel: 'relay zone',
                  };
                default:
                  return {
                    holdSeconds: 0,
                    maxSpeedKnots: Number.POSITIVE_INFINITY,
                    zoneLabel: 'interaction zone',
                  };
              }
            }

            function telemetry(
              entity: ScenarioInteractionEntity,
              status: ScenarioInteractionStatus,
              progress: number,
              message: string,
              holdSeconds = 0,
              requiredHoldSeconds = 0,
              completed = false,
            ): ScenarioInteractionEvaluation {
              return {
                entityId: entity.id,
                status,
                progress: clamp01(progress),
                message,
                holdSeconds: Math.max(0, finiteOr(holdSeconds)),
                requiredHoldSeconds: Math.max(
                  0,
                  finiteOr(requiredHoldSeconds),
                ),
                completed,
              };
            }

            function createState(
              boatX: number,
              boatZ: number,
            ): InteractionState {
              return {
                previousBoatX: finiteOr(boatX),
                previousBoatZ: finiteOr(boatZ),
                hasPreviousPosition: false,
                gateArmed: false,
                holdSeconds: 0,
              };
            }

            export class ScenarioInteractionRuntime {
              private runId = -1;
              private vesselGeneration = -1;
              private readonly states = new Map<string, InteractionState>();

              reset(runId = -1, vesselGeneration = -1) {
                this.runId = normalizeIdentity(runId);
                this.vesselGeneration = normalizeIdentity(vesselGeneration);
                this.states.clear();
              }

              evaluate(
                entity: ScenarioInteractionEntity,
                sample: ScenarioInteractionSample,
              ): ScenarioInteractionEvaluation {
                this.ensureIdentity(sample.runId, sample.vesselGeneration);

                if (sample.alreadyCompleted) {
                  return telemetry(
                    entity,
                    'completed',
                    1,
                    `${entity.label} complete.`,
                    0,
                    0,
                    true,
                  );
                }

                let state = this.states.get(entity.id);
                if (!state) {
                  state = createState(sample.boatX, sample.boatZ);
                  this.states.set(entity.id, state);
                }

                if (!sample.prerequisiteMet) {
                  state.holdSeconds = 0;
                  this.reanchor(state, sample.boatX, sample.boatZ);
                  return telemetry(
                    entity,
                    'blocked',
                    0,
                    'Complete the prerequisite task before entering this zone.',
                  );
                }

                if (entity.type === 'navigation-gate') {
                  return this.evaluateGate(entity, sample, state);
                }
                return this.evaluateHold(entity, sample, state);
              }

              private ensureIdentity(runId: number, vesselGeneration: number) {
                const normalizedRunId = normalizeIdentity(runId);
                const normalizedGeneration = normalizeIdentity(vesselGeneration);
                if (
                  normalizedRunId !== this.runId ||
                  normalizedGeneration !== this.vesselGeneration
                ) {
                  this.reset(normalizedRunId, normalizedGeneration);
                }
              }

              private evaluateGate(
                entity: ScenarioInteractionEntity,
                sample: ScenarioInteractionSample,
                state: InteractionState,
              ) {
                const radians = finiteOr(entity.headingDeg) * DEGREES_TO_RADIANS;
                const forwardX = Math.sin(radians);
                const forwardZ = -Math.cos(radians);
                const rightX = -forwardZ;
                const rightZ = forwardX;
                const halfWidthM = resolveNavigationGateHalfWidthM(entity);
                const approachDistanceM =
                  resolveNavigationGateApproachDistanceM(entity);
                const currentX = finiteOr(sample.boatX);
                const currentZ = finiteOr(sample.boatZ);
                const relativeX = currentX - entity.x;
                const relativeZ = currentZ - entity.z;
                const alongM = relativeX * forwardX + relativeZ * forwardZ;
                const acrossM = relativeX * rightX + relativeZ * rightZ;
                const approachChannelHalfWidthM =
                  halfWidthM + GATE_LATERAL_MARGIN_M;

                let previousAlongM = alongM;
                let previousAcrossM = acrossM;
                if (state.hasPreviousPosition) {
                  const previousRelativeX = state.previousBoatX - entity.x;
                  const previousRelativeZ = state.previousBoatZ - entity.z;
                  previousAlongM =
                    previousRelativeX * forwardX +
                    previousRelativeZ * forwardZ;
                  previousAcrossM =
                    previousRelativeX * rightX +
                    previousRelativeZ * rightZ;
                }

                const currentApproachEligible =
                  alongM <= -FORWARD_CROSSING_EPSILON_M &&
                  alongM >= -approachDistanceM &&
                  Math.abs(acrossM) <= approachChannelHalfWidthM;
                const previousApproachEligible =
                  state.hasPreviousPosition &&
                  previousAlongM <= -FORWARD_CROSSING_EPSILON_M &&
                  previousAlongM >= -approachDistanceM &&
                  Math.abs(previousAcrossM) <= approachChannelHalfWidthM;
                if (currentApproachEligible || previousApproachEligible) {
                  state.gateArmed = true;
                }

                const forwardDeltaM = alongM - previousAlongM;
                const crossedForward =
                  state.hasPreviousPosition &&
                  state.gateArmed &&
                  previousAlongM < 0 &&
                  alongM >= 0 &&
                  forwardDeltaM > FORWARD_CROSSING_EPSILON_M;

                if (crossedForward) {
                  const interpolation = clamp01(
                    -previousAlongM / Math.max(forwardDeltaM, 1e-9),
                  );
                  const crossingAcrossM =
                    previousAcrossM +
                    (acrossM - previousAcrossM) * interpolation;
                  if (Math.abs(crossingAcrossM) <= halfWidthM) {
                    state.gateArmed = false;
                    this.reanchor(state, currentX, currentZ);
                    return telemetry(
                      entity,
                      'completed',
                      1,
                      `${entity.label} crossed between the posts.`,
                      0,
                      0,
                      true,
                    );
                  }
                }

                if (alongM > approachDistanceM * 0.5) {
                  state.gateArmed = false;
                }

                this.reanchor(state, currentX, currentZ);
                if (!state.gateArmed) {
                  return telemetry(
                    entity,
                    'approach',
                    0,
                    `Approach ${entity.label} from the marked route side.`,
                  );
                }

                const approachProgress = clamp01(
                  1 - Math.max(0, -alongM) / approachDistanceM,
                );
                return telemetry(
                  entity,
                  'approach',
                  0.2 + approachProgress * 0.7,
                  `Gate armed — cross between the ${entity.label} posts.`,
                );
              }

              private evaluateHold(
                entity: ScenarioInteractionEntity,
                sample: ScenarioInteractionSample,
                state: InteractionState,
              ) {
                const profile = resolveHoldProfile(entity);
                const distanceM = Math.hypot(
                  finiteOr(sample.boatX) - entity.x,
                  finiteOr(sample.boatZ) - entity.z,
                );
                const speedKnots = Math.abs(finiteOr(sample.speedKnots));
                const deltaSeconds = Math.max(0, finiteOr(sample.deltaSeconds));

                this.reanchor(state, sample.boatX, sample.boatZ);
                if (distanceM > entity.radiusM) {
                  state.holdSeconds = 0;
                  return telemetry(
                    entity,
                    'approach',
                    0,
                    `Approach the ${entity.label} ${profile.zoneLabel}.`,
                    0,
                    profile.holdSeconds,
                  );
                }

                if (speedKnots > profile.maxSpeedKnots) {
                  state.holdSeconds = 0;
                  return telemetry(
                    entity,
                    'too-fast',
                    0,
                    `Reduce speed below ${profile.maxSpeedKnots.toFixed(1)} knots and hold position.`,
                    0,
                    profile.holdSeconds,
                  );
                }

                state.holdSeconds = Math.min(
                  profile.holdSeconds,
                  state.holdSeconds + deltaSeconds,
                );
                const progress =
                  profile.holdSeconds <= 0
                    ? 1
                    : state.holdSeconds / profile.holdSeconds;
                if (progress >= 1) {
                  return telemetry(
                    entity,
                    'completed',
                    1,
                    `${entity.label} interaction complete.`,
                    state.holdSeconds,
                    profile.holdSeconds,
                    true,
                  );
                }

                const remainingSeconds = Math.max(
                  0,
                  profile.holdSeconds - state.holdSeconds,
                );
                return telemetry(
                  entity,
                  'holding',
                  progress,
                  `Hold position in the ${profile.zoneLabel} for ${remainingSeconds.toFixed(1)} more seconds.`,
                  state.holdSeconds,
                  profile.holdSeconds,
                );
              }

              private reanchor(
                state: InteractionState,
                boatX: number,
                boatZ: number,
              ) {
                state.previousBoatX = finiteOr(boatX);
                state.previousBoatZ = finiteOr(boatZ);
                state.hasPreviousPosition = true;
              }
            }
          ''').lstrip()
          write(
              'sim/scenarios/ScenarioInteractionRuntime.ts',
              interaction_runtime,
          )

          interaction_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              ScenarioInteractionRuntime,
              resolveNavigationGateHalfWidthM,
            } from '../sim/scenarios/ScenarioInteractionRuntime.ts';

            function sample(overrides = {}) {
              return {
                runId: 1,
                vesselGeneration: 1,
                boatX: 0,
                boatZ: 0,
                speedKnots: 0,
                deltaSeconds: 0.1,
                prerequisiteMet: true,
                alreadyCompleted: false,
                ...overrides,
              };
            }

            const gate = {
              id: 'test-gate',
              label: 'Test gate',
              type: 'navigation-gate',
              x: 0,
              z: 0,
              radiusM: 20,
              headingDeg: 0,
              interaction: {
                gateHalfWidthM: 8,
                gateApproachDistanceM: 16,
              },
            };
            assert.equal(resolveNavigationGateHalfWidthM(gate), 8);

            const standingRuntime = new ScenarioInteractionRuntime();
            const standing = standingRuntime.evaluate(gate, sample());
            assert.equal(
              standing.completed,
              false,
              'Standing inside a gate radius must not complete it.',
            );

            const forwardRuntime = new ScenarioInteractionRuntime();
            assert.equal(
              forwardRuntime.evaluate(gate, sample({ boatZ: 12 })).completed,
              false,
            );
            assert.equal(
              forwardRuntime.evaluate(gate, sample({ boatZ: 1 })).completed,
              false,
            );
            const forwardCrossing = forwardRuntime.evaluate(
              gate,
              sample({ boatZ: -1 }),
            );
            assert.equal(forwardCrossing.completed, true);
            assert.equal(forwardCrossing.status, 'completed');

            const reverseRuntime = new ScenarioInteractionRuntime();
            reverseRuntime.evaluate(gate, sample({ boatZ: -8 }));
            const reverseCrossing = reverseRuntime.evaluate(
              gate,
              sample({ boatZ: 8 }),
            );
            assert.equal(
              reverseCrossing.completed,
              false,
              'Crossing a gate backward must not complete it.',
            );

            const outsideRuntime = new ScenarioInteractionRuntime();
            outsideRuntime.evaluate(gate, sample({ boatX: 14, boatZ: 12 }));
            const outsideCrossing = outsideRuntime.evaluate(
              gate,
              sample({ boatX: 14, boatZ: -2 }),
            );
            assert.equal(
              outsideCrossing.completed,
              false,
              'Crossing outside the visible posts must not complete a gate.',
            );

            const recoveryRuntime = new ScenarioInteractionRuntime();
            recoveryRuntime.evaluate(gate, sample({ boatZ: 5 }));
            const recoveryTeleport = recoveryRuntime.evaluate(
              gate,
              sample({ vesselGeneration: 2, boatZ: -5 }),
            );
            assert.equal(
              recoveryTeleport.completed,
              false,
              'A vessel recovery teleport must reanchor gate state.',
            );

            const relay = {
              id: 'relay',
              label: 'Emergency relay',
              type: 'storm-beacon',
              x: 0,
              z: 0,
              radiusM: 10,
              headingDeg: 0,
              interaction: { holdSeconds: 2, maxSpeedKnots: 3 },
            };
            const relayRuntime = new ScenarioInteractionRuntime();
            const relayHalf = relayRuntime.evaluate(
              relay,
              sample({ deltaSeconds: 1 }),
            );
            assert.equal(relayHalf.status, 'holding');
            assert.equal(relayHalf.progress, 0.5);
            const relayTooFast = relayRuntime.evaluate(
              relay,
              sample({ speedKnots: 4, deltaSeconds: 0.5 }),
            );
            assert.equal(relayTooFast.status, 'too-fast');
            assert.equal(relayTooFast.progress, 0);
            relayRuntime.evaluate(relay, sample({ deltaSeconds: 1 }));
            const relayComplete = relayRuntime.evaluate(
              relay,
              sample({ deltaSeconds: 1 }),
            );
            assert.equal(relayComplete.completed, true);

            const deliveryRuntime = new ScenarioInteractionRuntime();
            const blockedDelivery = deliveryRuntime.evaluate(
              {
                id: 'delivery',
                label: 'Delivery',
                type: 'cargo-delivery',
                x: 0,
                z: 0,
                radiusM: 8,
                headingDeg: 0,
              },
              sample({ prerequisiteMet: false }),
            );
            assert.equal(blockedDelivery.status, 'blocked');

            const pickupRuntime = new ScenarioInteractionRuntime();
            const pickupTooFast = pickupRuntime.evaluate(
              {
                id: 'pickup',
                label: 'Cargo',
                type: 'cargo-pickup',
                x: 0,
                z: 0,
                radiusM: 8,
                headingDeg: 0,
              },
              sample({ speedKnots: 3.2 }),
            );
            assert.equal(pickupTooFast.status, 'too-fast');

            const rescueRuntime = new ScenarioInteractionRuntime();
            const rescueHolding = rescueRuntime.evaluate(
              {
                id: 'rescue',
                label: 'Survivor pod',
                type: 'rescue-pickup',
                x: 0,
                z: 0,
                radiusM: 8,
                headingDeg: 0,
              },
              sample({ speedKnots: 3, deltaSeconds: 1 }),
            );
            assert.equal(rescueHolding.status, 'holding');
            assert.ok(rescueHolding.requiredHoldSeconds > 2);

            const directorSource = await fs.readFile(
              new URL('../components/ScenarioDirector.tsx', import.meta.url),
              'utf8',
            );
            const routeSource = await fs.readFile(
              new URL('../sim/scenarios/ScenarioRoute.ts', import.meta.url),
              'utf8',
            );
            const entitySource = await fs.readFile(
              new URL('../components/ScenarioEntities.tsx', import.meta.url),
              'utf8',
            );
            const navigationSource = await fs.readFile(
              new URL('../components/NavigationHUD.tsx', import.meta.url),
              'utf8',
            );
            const persistenceSource = await fs.readFile(
              new URL('../components/ExperiencePersistence.tsx', import.meta.url),
              'utf8',
            );

            assert.match(
              directorSource,
              /interactionRuntime\.current\.evaluate\(/,
              'ScenarioDirector must delegate entity completion to the typed runtime.',
            );
            assert.doesNotMatch(
              directorSource,
              /Math\.hypot\(entity\.x - boatX, entity\.z - boatZ\) <= entity\.radiusM/,
              'ScenarioDirector must not retain the generic entity radius completion rule.',
            );
            assert.match(
              routeSource,
              /headingDeg: resolveInboundRouteHeading/,
              'Resolved entities must carry an inbound route heading.',
            );
            assert.match(
              entitySource,
              /headingDegreesToYawRadians\(entity\.headingDeg\)/,
              'Visible gate posts must rotate to the same crossing plane used by gameplay.',
            );
            assert.match(
              navigationSource,
              /scenarioInteractionProgress/,
              'Navigation UI must expose typed interaction progress.',
            );
            assert.match(
              persistenceSource,
              /simScenarioInteractionStatus/,
              'Browser validation must observe typed interaction state.',
            );

            console.log('Scenario interaction runtime contract passed.');
          ''').lstrip()
          write(
              'scripts/scenario-interaction-runtime-contract.mjs',
              interaction_contract,
          )

          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "export interface ScenarioEntityDefinition {\n  id: string;\n  label: string;\n  type: ScenarioEntityType;\n  waypointId: string;\n  radiusM: number;\n  guidance: string;\n  completionMessage: string;\n  required: boolean;\n  requiresEntityId?: string;\n  offsetX?: number;\n  offsetZ?: number;\n}\n",
              "export interface ScenarioEntityInteractionDefinition {\n  holdSeconds?: number;\n  maxSpeedKnots?: number;\n  gateHalfWidthM?: number;\n  gateApproachDistanceM?: number;\n}\n\nexport interface ScenarioEntityDefinition {\n  id: string;\n  label: string;\n  type: ScenarioEntityType;\n  waypointId: string;\n  radiusM: number;\n  guidance: string;\n  completionMessage: string;\n  required: boolean;\n  requiresEntityId?: string;\n  offsetX?: number;\n  offsetZ?: number;\n  interaction?: ScenarioEntityInteractionDefinition;\n}\n",
          )
          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "          radiusM: 12,\n          guidance: 'Approach the floating supply platform to load the crate.',\n          completionMessage: 'Supply crate secured aboard.',\n          required: true,\n          offsetX: 5,\n",
              "          radiusM: 12,\n          guidance:\n            'Enter the loading zone below 3 knots and hold position to secure the crate.',\n          completionMessage: 'Supply crate secured aboard.',\n          required: true,\n          interaction: { holdSeconds: 1.5, maxSpeedKnots: 3 },\n          offsetX: 5,\n",
          )
          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "          radiusM: 11,\n          guidance: 'Enter the delivery zone slowly to unload the supply crate.',\n          completionMessage: 'Supply crate delivered to the berth.',\n          required: true,\n          requiresEntityId: 'harbor-supply-pickup',\n",
              "          radiusM: 11,\n          guidance:\n            'Enter below 2.5 knots and hold position while the crate is unloaded.',\n          completionMessage: 'Supply crate delivered to the berth.',\n          required: true,\n          requiresEntityId: 'harbor-supply-pickup',\n          interaction: { holdSeconds: 2, maxSpeedKnots: 2.5 },\n",
          )
          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "          radiusM: 24,\n          guidance: 'Hold near the relay long enough to trigger the automatic handoff.',\n          completionMessage: 'Emergency relay activated.',\n          required: true,\n",
              "          radiusM: 24,\n          guidance:\n            'Remain in the relay zone below 6 knots for five seconds.',\n          completionMessage: 'Emergency relay activated.',\n          required: true,\n          interaction: { holdSeconds: 5, maxSpeedKnots: 6 },\n",
          )
          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "          radiusM: 18,\n          guidance: 'Approach the survivor pod carefully for automatic recovery.',\n          completionMessage: 'Survivor pod recovered.',\n          required: true,\n          offsetX: -4,\n",
              "          radiusM: 18,\n          guidance:\n            'Enter below 3.5 knots and hold beside the survivor pod for recovery.',\n          completionMessage: 'Survivor pod recovered.',\n          required: true,\n          interaction: { holdSeconds: 2.5, maxSpeedKnots: 3.5 },\n          offsetX: -4,\n",
          )
          replace_once(
              'sim/scenarios/ScenarioCatalog.ts',
              "          radiusM: 22,\n          guidance: 'Enter the safe-water zone below the arrival-speed limit.',\n          completionMessage: 'Survivor pod transferred to the rescue team.',\n          required: true,\n          requiresEntityId: 'winter-survivor-pickup',\n",
              "          radiusM: 22,\n          guidance:\n            'Enter below 5 knots and hold position for the rescue-team transfer.',\n          completionMessage: 'Survivor pod transferred to the rescue team.',\n          required: true,\n          requiresEntityId: 'winter-survivor-pickup',\n          interaction: { holdSeconds: 2, maxSpeedKnots: 5 },\n",
          )

          replace_once(
              'sim/scenarios/ScenarioRoute.ts',
              "export interface ResolvedScenarioEntity\n  extends ScenarioEntityDefinition,\n    ResolvedNavigablePosition {}\n",
              "export interface ResolvedScenarioEntity\n  extends ScenarioEntityDefinition,\n    ResolvedNavigablePosition {\n  headingDeg: number;\n}\n",
          )
          replace_once(
