name: Run vessel dynamics extraction

on:
  pull_request:
    paths:
      - .github/workflows/run-vessel-dynamics-extraction.yml

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  extract:
    if: github.head_ref == 'agent/simulator-stabilization'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Execute staged dynamics extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/extract-vessel-dynamics-runtime.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Set up Node.js"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          staged_script = dedent(source[start:end])
          exact_guard = "    if count != 1:\n"
          if staged_script.count(exact_guard) != 1:
              raise SystemExit('Unable to locate the exact replacement guard.')
          staged_script = staged_script.replace(
              exact_guard,
              "    if count < 1:\n",
              1,
          )
          exec(compile(staged_script, '<dynamics-extraction>', 'exec'))
          PY

      - name: Normalize Node-compatible dynamics imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'sim/vessels/EnvironmentalForces.ts': {
                  "@/sim/core/SixDofBody": "../core/SixDofBody.ts",
                  "@/sim/core/SeededRandom": "../core/SeededRandom.ts",
                  "@/sim/vessels/VesselConfig": "./VesselConfig.ts",
                  "@/sim/vessels/PhysicsCorrectness": "./PhysicsCorrectness.ts",
              },
              'sim/vessels/SectionalHydrostatics.ts': {
                  "@/sim/core/SixDofBody": "../core/SixDofBody.ts",
                  "@/sim/vessels/VesselConfig": "./VesselConfig.ts",
                  "@/sim/water/WaterSurface": "../water/WaterSurface.ts",
                  "@/sim/vessels/HydrostaticsMath": "./HydrostaticsMath.ts",
              },
          }

          for file_name, file_replacements in replacements.items():
              path = Path(file_name)
              source = path.read_text(encoding='utf-8')
              for old, new in file_replacements.items():
                  if old not in source:
                      raise SystemExit(
                          f'{file_name}: missing expected import {old}'
                      )
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY

      - name: Delegate world-direction ownership contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/world-direction-contract.mjs')
          source = path.read_text(encoding='utf-8')

          boat_entry = (
              "  boat: await fs.readFile(\n"
              "    new URL('../components/Boat.tsx', import.meta.url),\n"
              "    'utf8',\n"
              "  ),\n"
          )
          dynamics_entry = boat_entry + (
              "  dynamics: await fs.readFile(\n"
              "    new URL(\n"
              "      '../sim/vessels/VesselDynamicsRuntime.ts',\n"
              "      import.meta.url,\n"
              "    ),\n"
              "    'utf8',\n"
              "  ),\n"
          )
          if source.count(boat_entry) != 1:
              raise SystemExit('Unable to locate Boat source entry.')
          source = source.replace(boat_entry, dynamics_entry, 1)

          old_assertions = (
              "assert.match(\n"
              "  sourceFiles.boat,\n"
              "  /setWorldVectorFromHeading\\(windVelocity, windDir, windSpeed\\)/,\n"
              "  'Vessel wind force must use the authoritative heading conversion.',\n"
              ");\n"
              "assert.match(\n"
              "  sourceFiles.boat,\n"
              "  /setWorldVectorFromHeading\\(\\s*baseCurrentVelocity,\\s*currentDir,\\s*currentSpeed/,\n"
              "  'Water current must use the authoritative heading conversion.',\n"
              ");\n"
          )
          new_assertions = (
              "assert.match(\n"
              "  sourceFiles.dynamics,\n"
              "  /setWorldVectorFromHeading\\(\\s*this\\.windVelocity,\\s*input\\.windHeadingDegrees,\\s*input\\.windSpeedMps/,\n"
              "  'Vessel wind force must use the authoritative heading conversion.',\n"
              ");\n"
              "assert.match(\n"
              "  sourceFiles.dynamics,\n"
              "  /setWorldVectorFromHeading\\(\\s*this\\.baseCurrentVelocity,\\s*input\\.currentHeadingDegrees,\\s*input\\.currentSpeedMps/,\n"
              "  'Water current must use the authoritative heading conversion.',\n"
              ");\n"
          )
          if source.count(old_assertions) != 1:
              raise SystemExit('Unable to locate world-direction assertions.')
          source = source.replace(old_assertions, new_assertions, 1)

          old_private_mapping = (
              "assert.doesNotMatch(\n"
              "  sourceFiles.boat,\n"
              "  /const windRad = MathUtils\\.degToRad\\(windDir\\)/,\n"
              "  'Boat physics must not keep a private wind-axis mapping.',\n"
              ");\n"
          )
          new_private_mapping = (
              "assert.doesNotMatch(\n"
              "  `${sourceFiles.boat}\\n${sourceFiles.dynamics}`,\n"
              "  /const windRad = MathUtils\\.degToRad\\(windDir\\)/,\n"
              "  'Vessel physics must not keep a private wind-axis mapping.',\n"
              ");\n"
          )
          if source.count(old_private_mapping) != 1:
              raise SystemExit('Unable to locate private wind mapping assertion.')
          source = source.replace(
              old_private_mapping,
              new_private_mapping,
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dynamics contract
        run: node --experimental-strip-types --no-warnings scripts/vessel-dynamics-runtime-contract.mjs

      - name: Validate repository
        run: npm run validate

      - name: Commit validated extraction
        shell: bash
        run: |
          rm -f \
            .github/workflows/extract-vessel-dynamics-runtime.yml \
            .github/workflows/run-vessel-dynamics-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: extract vessel dynamics runtime"
          git push origin HEAD:agent/simulator-stabilization
