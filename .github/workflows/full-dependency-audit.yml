name: Finalize dependency audit

on:
  pull_request:
    paths:
      - '.github/workflows/full-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-full-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Apply compatible advisory patches and validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-performance-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin compatible patched transitive packages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.overrides = {
            ...(packageJson.overrides ?? {}),
            '@babel/core': '7.29.6',
            'js-yaml': '4.3.0',
            tar: '7.5.21',
            '@typescript-eslint/typescript-estree': {
              'brace-expansion': '5.0.8'
            }
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Install candidate dependency graph
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Require a clean runtime audit
        run: npm audit --omit=dev --audit-level=low

      - name: Verify only the accepted upstream lint-tool advisory remains
        run: |
          npm audit --json > /tmp/full-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/full-audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities ?? {};
          const names = Object.keys(vulnerabilities).sort();
          const allowed = new Set([
            '@eslint/config-array',
            '@eslint/eslintrc',
            'brace-expansion',
            'eslint',
            'eslint-config-next',
            'eslint-plugin-import',
            'eslint-plugin-jsx-a11y',
            'eslint-plugin-react',
            'minimatch'
          ]);
          const unexpected = names.filter((name) => !allowed.has(name));
          if (unexpected.length > 0) {
            console.error('Unexpected dependency advisories remain:', unexpected);
            process.exit(1);
          }
          for (const removed of ['@babel/core', 'js-yaml', 'tar']) {
            if (vulnerabilities[removed]) {
              console.error(`Expected ${removed} to be patched.`);
              process.exit(1);
            }
          }
          console.log('Remaining development-only advisory chain:', names);
          console.log('Audit metadata:', audit.metadata?.vulnerabilities ?? {});
          NODE

      - name: Remove one-time audit workflow
        run: rm -f .github/workflows/full-dependency-audit.yml

      - name: Commit validated package graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/full-dependency-audit.yml
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "security: patch compatible development dependencies"
          git push origin "HEAD:agent/phase-1-performance-foundation"
