name: Finalize dependency audit

on:
  pull_request:
    paths:
      - '.github/workflows/full-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-full-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Upgrade audit-blocked tooling and validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-performance-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade ESLint and regenerate lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.devDependencies.eslint = '10.8.0';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --force

      - name: Install candidate dependency graph
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Require a clean full audit
        run: npm audit --audit-level=low

      - name: Remove one-time audit workflow
        run: rm -f .github/workflows/full-dependency-audit.yml

      - name: Commit validated package graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/full-dependency-audit.yml
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "security: resolve development dependency advisories"
          git push origin "HEAD:agent/phase-1-performance-foundation"
