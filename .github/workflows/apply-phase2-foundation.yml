name: Apply Phase 2 simulation foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-phase2-foundation.mjs
      - scripts/fix-phase2-foundation.mjs
      - .github/workflows/apply-phase2-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-2-simulation-foundation
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Transform, validate, and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fixed-timestep refactor
        run: |
          node scripts/apply-phase2-foundation.mjs
          node scripts/fix-phase2-foundation.mjs

      - name: Validate repository
        run: npm run validate

      - name: Remove one-time migration tooling
        run: |
          rm -f scripts/apply-phase2-foundation.mjs
          rm -f scripts/fix-phase2-foundation.mjs
          rm -f .github/workflows/apply-phase2-foundation.yml

      - name: Commit validated foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase 2 changes to commit."
            exit 0
          fi
          git commit -m "feat: establish fixed timestep vessel simulation"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
