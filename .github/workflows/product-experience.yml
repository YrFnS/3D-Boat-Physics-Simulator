name: Product experience

on:
  pull_request:
    paths:
      - app/globals.css
      - components/CameraRig.tsx
      - components/ContextualControlHints.tsx
      - components/ExperienceChrome.tsx
      - components/ExperiencePersistence.tsx
      - components/FreeNavigationDirector.tsx
      - components/GameplayPersistence.tsx
      - components/HUD.tsx
      - components/InputModeTracker.tsx
      - components/NavigationHUD.tsx
      - components/OnboardingOverlay.tsx
      - components/ScenarioDirector.tsx
      - components/ScenarioEntities.tsx
      - components/ScenarioResultOverlay.tsx
      - components/ScenarioWaypoints.tsx
      - components/SessionOverlay.tsx
      - components/SettingsOverlay.tsx
      - components/SettingsPersistence.tsx
      - components/Simulator.tsx
      - components/SimulatorRecovery.tsx
      - hooks/useAutomationMode.ts
      - sim/core/SixDofBody.ts
      - sim/scenarios/**
      - store/useExperienceSettings.ts
      - store/useNavigationPlanner.ts
      - store/useScenarioHistory.ts
      - store/useSimStore.ts
      - scripts/gameplay-systems-smoke.mjs
      - scripts/onboarding-settings-smoke.mjs
      - scripts/product-experience-smoke.mjs
      - package.json
      - package-lock.json
      - .github/workflows/product-experience.yml
  push:
    branches:
      - main
    paths:
      - app/globals.css
      - components/CameraRig.tsx
      - components/ContextualControlHints.tsx
      - components/ExperienceChrome.tsx
      - components/ExperiencePersistence.tsx
      - components/FreeNavigationDirector.tsx
      - components/GameplayPersistence.tsx
      - components/HUD.tsx
      - components/InputModeTracker.tsx
      - components/NavigationHUD.tsx
      - components/OnboardingOverlay.tsx
      - components/ScenarioDirector.tsx
      - components/ScenarioEntities.tsx
      - components/ScenarioResultOverlay.tsx
      - components/ScenarioWaypoints.tsx
      - components/SessionOverlay.tsx
      - components/SettingsOverlay.tsx
      - components/SettingsPersistence.tsx
      - components/Simulator.tsx
      - components/SimulatorRecovery.tsx
      - hooks/useAutomationMode.ts
      - sim/core/SixDofBody.ts
      - sim/scenarios/**
      - store/useExperienceSettings.ts
      - store/useNavigationPlanner.ts
      - store/useScenarioHistory.ts
      - store/useSimStore.ts
      - scripts/gameplay-systems-smoke.mjs
      - scripts/onboarding-settings-smoke.mjs
      - scripts/product-experience-smoke.mjs
      - package.json
      - package-lock.json
      - .github/workflows/product-experience.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  experience:
    name: Session, gameplay, onboarding, settings, and persistence flow
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright without changing the lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare standalone server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/boat-product-server.log 2>&1 &
          echo $! > /tmp/boat-product-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/boat-product-server.log
          exit 1

      - name: Run session and navigation smoke
        id: product_experience
        continue-on-error: true
        run: node scripts/product-experience-smoke.mjs

      - name: Run gameplay systems smoke
        id: gameplay_systems
        continue-on-error: true
        run: node scripts/gameplay-systems-smoke.mjs

      - name: Run onboarding and settings smoke
        id: onboarding_settings
        continue-on-error: true
        run: node scripts/onboarding-settings-smoke.mjs

      - name: Collect server log
        if: always()
        run: |
          mkdir -p artifacts/product-experience
          cp /tmp/boat-product-server.log artifacts/product-experience/server.log || true

      - name: Upload product experience artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience
          path: artifacts/product-experience
          if-no-files-found: error
          retention-days: 14

      - name: Enforce product experience result
        if: >-
          steps.product_experience.outcome != 'success' ||
          steps.gameplay_systems.outcome != 'success' ||
          steps.onboarding_settings.outcome != 'success'
        run: exit 1
