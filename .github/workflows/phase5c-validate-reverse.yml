name: Validate Phase 5C reverse maneuvering

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5c-validate-reverse.yml'

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: phase5c-validate-reverse-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/phase-5c-propulsion-maneuvering'
    name: Apply, calibrate, and publish reverse fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5C branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5c-propulsion-maneuvering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply reverse-maneuvering fixtures
        run: |
          git show cf82647381f101a1c312be20a97009373626c211:scripts/.phase5c-reverse-patch.b64 \
            | base64 --decode > "$RUNNER_TEMP/phase5c-reverse.patch.gz"
          echo '956dde8e7ada119ab991c298fd06c765d43fc4ead293a6cabe065e90a945aeb5  '"$RUNNER_TEMP/phase5c-reverse.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5c-reverse.patch.gz" > "$RUNNER_TEMP/phase5c-reverse.patch"
          echo '78cf4ee8ded4282a1a66e81019c4b7454b90a6dd9333a8981feacf2934645504  '"$RUNNER_TEMP/phase5c-reverse.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/phase5c-reverse.patch"
          git apply "$RUNNER_TEMP/phase5c-reverse.patch"
          python <<'PY'
          from pathlib import Path

          path = Path('sim/calibration/VesselCalibration.ts')
          source = path.read_text(encoding='utf-8')
          if source.count('-0.75') != 1:
              raise SystemExit('Expected one representative speedboat reverse-turn throttle.')
          path.write_text(source.replace('-0.75', '-0.76', 1), encoding='utf-8')
          PY
          git diff --check

      - name: Install committed dependencies
        run: npm ci

      - name: Validate source and dependency graph
        run: npm run validate

      - name: Install calibration browser without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare standalone production server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/phase5c-reverse-server.log 2>&1 &
          echo $! > /tmp/phase5c-reverse-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase5c-reverse-server.log
          exit 1

      - name: Run twenty-scenario vessel calibration
        id: calibration
        continue-on-error: true
        run: node scripts/physics-calibration.mjs

      - name: Run visual smoke
        id: smoke
        continue-on-error: true
        run: node scripts/visual-smoke.mjs

      - name: Collect validation artifacts
        if: always()
        run: |
          mkdir -p artifacts/phase5c-reverse-validation
          touch artifacts/phase5c-reverse-validation/placeholder.txt
          cp /tmp/phase5c-reverse-server.log artifacts/phase5c-reverse-validation/server.log || true
          cp -R artifacts/physics-calibration artifacts/phase5c-reverse-validation/ || true
          cp -R artifacts/visual-smoke artifacts/phase5c-reverse-validation/ || true

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-reverse-validation
          path: artifacts/phase5c-reverse-validation
          if-no-files-found: error
          retention-days: 3

      - name: Enforce reverse and smoke gates
        if: steps.calibration.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1

      - name: Remove temporary reverse tooling
        run: |
          rm -f scripts/.phase5c-reverse-patch.b64
          rm -f .github/workflows/phase5c-validate-reverse.yml

      - name: Commit and push validated reverse fixtures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate Phase 5C reverse maneuvering'
          git push origin HEAD:agent/phase-5c-propulsion-maneuvering
