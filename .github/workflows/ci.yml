name: Apply final Phase 2 tuning through CI

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: write

concurrency:
  group: apply-final-phase2-tuning
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Apply, validate, and push final Phase 2 tuning
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded final tuning
        run: node scripts/apply-phase2-final-tuning.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/Boat.tsx \
            sim/collision/RapierCollisionWorld.ts
          if git diff --cached --quiet; then
            echo "No final tuning changes to commit."
            exit 0
          fi
          git commit -m "physics: stabilize planing turns and fast contacts"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
