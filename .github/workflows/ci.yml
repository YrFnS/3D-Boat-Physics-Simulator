name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  fix-mobile-pointer-capture:
    name: Fix and validate mobile pointer capture
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/phase-2-fixed-timestep-physics' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply safe pointer lifecycle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'components/HUD.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before = `function holdKey(
            event: ReactPointerEvent<HTMLButtonElement>,
            key: HeldKey,
            active: boolean,
          ) {
            event.preventDefault();
            if (active) {
              event.currentTarget.setPointerCapture?.(event.pointerId);
            }
            useSimStore.getState().setKey(key, active);
          }`;
          const after = `function holdKey(
            event: ReactPointerEvent<HTMLButtonElement>,
            key: HeldKey,
            active: boolean,
          ) {
            event.preventDefault();
            const target = event.currentTarget;

            try {
              if (active) {
                if (!target.hasPointerCapture?.(event.pointerId)) {
                  target.setPointerCapture?.(event.pointerId);
                }
              } else if (target.hasPointerCapture?.(event.pointerId)) {
                target.releasePointerCapture?.(event.pointerId);
              }
            } catch {
              // Synthetic pointer events and interrupted touch streams may no
              // longer own an active pointer. Key state must still be updated.
            }

            useSimStore.getState().setKey(key, active);
          }`;
          if (!source.includes(before)) {
            throw new Error('Expected holdKey implementation was not found.');
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run validate

      - name: Restore permanent CI
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/HUD.tsx .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No pointer lifecycle changes to commit."
            exit 0
          fi
          git commit -m "fix: make mobile pointer capture best effort"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"

  validate:
    name: Lint, typecheck, build, and full audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Reject dependency advisories
        run: npm run audit
