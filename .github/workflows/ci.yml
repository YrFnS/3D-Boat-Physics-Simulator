name: Apply vessel calibration through CI

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: write

concurrency:
  group: apply-vessel-calibration-through-ci
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Apply, validate, and push calibration code
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded calibration integration
        run: node scripts/run-vessel-calibration-patched.mjs

      - name: Check calibration runner syntax
        run: node --check scripts/physics-calibration.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated non-workflow calibration code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/Boat.tsx \
            components/PerformanceTelemetry.tsx \
            store/useSimStore.ts \
            sim/calibration/VesselCalibration.ts \
            scripts/physics-calibration.mjs
          if git diff --cached --quiet; then
            echo "No calibration code changes to commit."
            exit 0
          fi
          git commit -m "test: add deterministic vessel calibration"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
