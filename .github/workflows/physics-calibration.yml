name: Physics calibration

on:
  pull_request:
    paths:
      - components/Boat.tsx
      - components/PerformanceTelemetry.tsx
      - sim/core/**
      - sim/vessels/**
      - sim/collision/**
      - sim/calibration/**
      - store/useSimStore.ts
      - scripts/physics-calibration.mjs
      - scripts/physics-correctness.mjs
      - scripts/physical-calibration-contract.mjs
      - scripts/reference-vessel-validation.mjs
      - package.json
      - package-lock.json
      - .github/workflows/physics-calibration.yml
  push:
    branches:
      - main
    paths:
      - components/Boat.tsx
      - components/PerformanceTelemetry.tsx
      - sim/core/**
      - sim/vessels/**
      - sim/collision/**
      - sim/calibration/**
      - store/useSimStore.ts
      - scripts/physics-calibration.mjs
      - scripts/physics-correctness.mjs
      - scripts/physical-calibration-contract.mjs
      - scripts/reference-vessel-validation.mjs
      - package.json
      - package-lock.json
      - .github/workflows/physics-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  calibrate:
    name: Trawler and speedboat calibration envelopes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run physics correctness regression tests
        run: npm run test:physics

      - name: Install Playwright without changing the lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare standalone server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/boat-calibration-server.log 2>&1 &
          echo $! > /tmp/boat-calibration-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/boat-calibration-server.log
          exit 1

      - name: Run deterministic vessel calibration and physical comparison
        id: calibration
        continue-on-error: true
        run: >-
          node --experimental-strip-types --no-warnings
          scripts/physics-calibration.mjs

      - name: Collect server log
        if: always()
        run: |
          mkdir -p artifacts/physics-calibration
          cp /tmp/boat-calibration-server.log artifacts/physics-calibration/server.log || true

      - name: Upload calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-calibration
          path: artifacts/physics-calibration
          if-no-files-found: error
          retention-days: 14

      - name: Upload physical-reference baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-reference-baseline
          path: artifacts/physical-reference
          if-no-files-found: error
          retention-days: 14

      - name: Enforce calibration result
        if: steps.calibration.outcome != 'success'
        run: exit 1
