name: Apply Phase 5 turn-fixture correction

on:
  pull_request:
    paths:
      - .github/workflows/physics-calibration.yml

permissions:
  contents: write

concurrency:
  group: phase5-turn-fixture-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'agent/phase-5-physics-correctness'
    name: Validate and publish representative turn throttle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-physics-correctness
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore representative speedboat turn entry
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('sim/calibration/VesselCalibration.ts')
          source = path.read_text()
          old = "this.request.vessel === 'speedboat' ? 0.21 : 0.82;"
          new = "this.request.vessel === 'speedboat' ? 0.24 : 0.82;"
          if source.count(old) != 1:
              raise SystemExit('expected exactly one speedboat turn-throttle fixture')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run physics correctness regression tests
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push fixture correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/calibration/VesselCalibration.ts
          git commit -m 'test: restore representative speedboat turn entry'
          git push origin HEAD:agent/phase-5-physics-correctness
