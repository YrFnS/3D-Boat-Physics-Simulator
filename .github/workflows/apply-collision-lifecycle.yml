name: Apply collision lifecycle migration

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: collision-lifecycle-migration
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply contact-start event lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:140]!r}'
                  )
              write(path, source.replace(old, new, 1))

          lifecycle_source = dedent(r'''
            export type CollisionContactKind = 'terrain' | 'obstacle';

            export interface CollisionContactPairObservation {
              pairKey: string;
              externalKey: string;
              kind: CollisionContactKind;
              fixture?: boolean;
              debugProbe?: boolean;
            }

            export interface CollisionContactLifecycleSummary {
              activeContactPairCount: number;
              activeExternalContactCount: number;
              contactStartCount: number;
              terrainContactStartCount: number;
              obstacleContactStartCount: number;
              fixtureContactStartCount: number;
              debugProbeContactStartCount: number;
              contactEndCount: number;
            }

            interface ExternalContactState {
              observation: CollisionContactPairObservation;
              activePairKeys: Set<string>;
              missingSeconds: number;
            }

            export const DEFAULT_CONTACT_RELEASE_GRACE_SECONDS = 0.12;

            function normalizeObservation(
              observation: CollisionContactPairObservation,
            ): CollisionContactPairObservation {
              return {
                pairKey: observation.pairKey,
                externalKey: observation.externalKey,
                kind: observation.kind === 'terrain' ? 'terrain' : 'obstacle',
                fixture: observation.fixture === true,
                debugProbe: observation.debugProbe === true,
              };
            }

            function mergeObservation(
              current: CollisionContactPairObservation,
              incoming: CollisionContactPairObservation,
            ): CollisionContactPairObservation {
              return {
                pairKey: current.pairKey,
                externalKey: current.externalKey,
                kind:
                  current.kind === 'terrain' || incoming.kind === 'terrain'
                    ? 'terrain'
                    : 'obstacle',
                fixture: current.fixture === true || incoming.fixture === true,
                debugProbe:
                  current.debugProbe === true || incoming.debugProbe === true,
              };
            }

            /**
             * Converts Rapier's compound-collider contact pairs into stable
             * gameplay collision events.
             *
             * Several hull pieces may touch one terrain or obstacle collider at
             * the same time. That remains one external contact until every pair
             * separates for the release grace period. Brief solver jitter or a
             * contact moving from the bow piece to the center piece therefore
             * cannot multiply a single grounding into dozens of score events.
             */
            export class CollisionContactLifecycle {
              private readonly activePairs = new Map<
                string,
                CollisionContactPairObservation
              >();
              private readonly externalContacts = new Map<
                string,
                ExternalContactState
              >();
              readonly releaseGraceSeconds: number;

              constructor(
                releaseGraceSeconds = DEFAULT_CONTACT_RELEASE_GRACE_SECONDS,
              ) {
                this.releaseGraceSeconds = Number.isFinite(releaseGraceSeconds)
                  ? Math.max(0, releaseGraceSeconds)
                  : DEFAULT_CONTACT_RELEASE_GRACE_SECONDS;
              }

              advance(
                observations: Iterable<CollisionContactPairObservation>,
                deltaSeconds: number,
              ): CollisionContactLifecycleSummary {
                const currentPairs = new Map<
                  string,
                  CollisionContactPairObservation
                >();

                for (const rawObservation of observations) {
                  if (
                    !rawObservation?.pairKey ||
                    !rawObservation.externalKey
                  ) {
                    continue;
                  }

                  const observation = normalizeObservation(rawObservation);
                  const existing = currentPairs.get(observation.pairKey);
                  if (
                    existing &&
                    existing.externalKey === observation.externalKey
                  ) {
                    currentPairs.set(
                      observation.pairKey,
                      mergeObservation(existing, observation),
                    );
                  } else if (!existing) {
                    currentPairs.set(observation.pairKey, observation);
                  }
                }

                let contactStartCount = 0;
                let terrainContactStartCount = 0;
                let obstacleContactStartCount = 0;
                let fixtureContactStartCount = 0;
                let debugProbeContactStartCount = 0;

                const recordStart = (
                  observation: CollisionContactPairObservation,
                ) => {
                  contactStartCount += 1;
                  if (observation.kind === 'terrain') {
                    terrainContactStartCount += 1;
                  } else {
                    obstacleContactStartCount += 1;
                  }
                  if (observation.fixture) fixtureContactStartCount += 1;
                  if (observation.debugProbe) {
                    debugProbeContactStartCount += 1;
                  }
                };

                // Add current pairs before removing old ones. If a sustained
                // contact transfers between two compound hull pieces in one
                // step, the external contact never appears to end.
                for (const [pairKey, observation] of currentPairs) {
                  const previousPair = this.activePairs.get(pairKey);
                  if (
                    previousPair &&
                    previousPair.externalKey === observation.externalKey
                  ) {
                    const state = this.externalContacts.get(
                      observation.externalKey,
                    );
                    if (state) {
                      state.observation = mergeObservation(
                        state.observation,
                        observation,
                      );
                      state.activePairKeys.add(pairKey);
                      state.missingSeconds = 0;
                      continue;
                    }
                  }

                  let state = this.externalContacts.get(
                    observation.externalKey,
                  );
                  if (!state) {
                    state = {
                      observation,
                      activePairKeys: new Set<string>(),
                      missingSeconds: 0,
                    };
                    this.externalContacts.set(
                      observation.externalKey,
                      state,
                    );
                    recordStart(observation);
                  } else {
                    state.observation = mergeObservation(
                      state.observation,
                      observation,
                    );
                    state.missingSeconds = 0;
                  }
                  state.activePairKeys.add(pairKey);
                }

                for (const [pairKey, previousPair] of this.activePairs) {
                  if (currentPairs.has(pairKey)) continue;
                  const state = this.externalContacts.get(
                    previousPair.externalKey,
                  );
                  if (!state) continue;
                  state.activePairKeys.delete(pairKey);
                  if (state.activePairKeys.size === 0) {
                    state.missingSeconds = 0;
                  }
                }

                this.activePairs.clear();
                for (const [pairKey, observation] of currentPairs) {
                  this.activePairs.set(pairKey, observation);
                }

                const safeDeltaSeconds = Number.isFinite(deltaSeconds)
                  ? Math.max(0, deltaSeconds)
                  : 0;
                let contactEndCount = 0;
                for (const [externalKey, state] of this.externalContacts) {
                  if (state.activePairKeys.size > 0) {
                    state.missingSeconds = 0;
                    continue;
                  }

                  state.missingSeconds += safeDeltaSeconds;
                  if (
                    state.missingSeconds + Number.EPSILON >=
                    this.releaseGraceSeconds
                  ) {
                    this.externalContacts.delete(externalKey);
                    contactEndCount += 1;
                  }
                }

                let activeExternalContactCount = 0;
                for (const state of this.externalContacts.values()) {
                  if (state.activePairKeys.size > 0) {
                    activeExternalContactCount += 1;
                  }
                }

                return {
                  activeContactPairCount: currentPairs.size,
                  activeExternalContactCount,
                  contactStartCount,
                  terrainContactStartCount,
                  obstacleContactStartCount,
                  fixtureContactStartCount,
                  debugProbeContactStartCount,
                  contactEndCount,
                };
              }

              reset() {
                this.activePairs.clear();
                this.externalContacts.clear();
              }
            }
          ''').lstrip()
          write('sim/collision/CollisionContactLifecycle.ts', lifecycle_source)

          lifecycle_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              CollisionContactLifecycle,
            } from '../sim/collision/CollisionContactLifecycle.ts';

            const STEP_SECONDS = 1 / 60;
            const lifecycle = new CollisionContactLifecycle(0.12);
            const terrainBow = {
              pairKey: 'vessel-bow:terrain',
              externalKey: 'terrain',
              kind: 'terrain',
            };
            const terrainCenter = {
              pairKey: 'vessel-center:terrain',
              externalKey: 'terrain',
              kind: 'terrain',
            };

            let summary = lifecycle.advance(
              [terrainBow, terrainBow, terrainCenter],
              STEP_SECONDS,
            );
            assert.equal(
              summary.contactStartCount,
              1,
              'Compound hull pieces touching one terrain collider must emit one start.',
            );
            assert.equal(summary.terrainContactStartCount, 1);
            assert.equal(summary.obstacleContactStartCount, 0);
            assert.equal(summary.activeContactPairCount, 2);
            assert.equal(summary.activeExternalContactCount, 1);

            for (let step = 0; step < 180; step += 1) {
              summary = lifecycle.advance(
                [terrainBow, terrainCenter],
                STEP_SECONDS,
              );
              assert.equal(
                summary.contactStartCount,
                0,
                'A sustained grounding must not emit per-step collision starts.',
              );
            }

            summary = lifecycle.advance([terrainCenter], STEP_SECONDS);
            assert.equal(
              summary.contactStartCount,
              0,
              'Moving a contact between compound hull pieces must remain one event.',
            );
            assert.equal(summary.activeExternalContactCount, 1);

            summary = lifecycle.advance([], 0.05);
            assert.equal(summary.contactEndCount, 0);
            assert.equal(summary.activeExternalContactCount, 0);

            summary = lifecycle.advance([terrainBow], 0.04);
            assert.equal(
              summary.contactStartCount,
              0,
              'A brief solver dropout inside the release grace must not re-score.',
            );
            assert.equal(summary.activeExternalContactCount, 1);

            summary = lifecycle.advance([], 0.07);
            assert.equal(summary.contactEndCount, 0);
            summary = lifecycle.advance([], 0.06);
            assert.equal(
              summary.contactEndCount,
              1,
              'A contact must end after sustained separation.',
            );

            summary = lifecycle.advance([terrainBow], STEP_SECONDS);
            assert.equal(
              summary.contactStartCount,
              1,
              'A new impact after full separation must emit a new event.',
            );

            const classified = new CollisionContactLifecycle();
            summary = classified.advance(
              [
                {
                  pairKey: 'vessel-bow:probe',
                  externalKey: 'probe',
                  kind: 'obstacle',
                  debugProbe: true,
                },
                {
                  pairKey: 'vessel-center:fixture',
                  externalKey: 'fixture',
                  kind: 'obstacle',
                  fixture: true,
                },
              ],
              STEP_SECONDS,
            );
            assert.equal(summary.contactStartCount, 2);
            assert.equal(summary.obstacleContactStartCount, 2);
            assert.equal(summary.debugProbeContactStartCount, 1);
            assert.equal(summary.fixtureContactStartCount, 1);

            classified.reset();
            summary = classified.advance(
              [
                {
                  pairKey: 'vessel-bow:probe',
                  externalKey: 'probe',
                  kind: 'obstacle',
                  debugProbe: true,
                },
              ],
              STEP_SECONDS,
            );
            assert.equal(
              summary.contactStartCount,
              1,
              'Resetting a vessel generation must reset contact identity.',
            );

            const rapierSource = await fs.readFile(
              new URL(
                '../sim/collision/RapierCollisionWorld.ts',
                import.meta.url,
              ),
              'utf8',
            );
            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const calibrationSource = await fs.readFile(
              new URL(
                '../sim/calibration/CollisionCalibration.ts',
                import.meta.url,
              ),
              'utf8',
            );

            assert.match(
              rapierSource,
              /new CollisionContactLifecycle\(\)/,
              'Rapier must own one lifecycle tracker per collision world.',
            );
            assert.match(
              rapierSource,
              /contactLifecycle\.advance\(\s*activeContactPairs,/,
              'Rapier contact pairs must feed the lifecycle tracker every step.',
            );
            assert.match(
              boatSource,
              /collisionSummary\.contactStartCount/,
              'Gameplay sequences must consume contact-start events.',
            );
            assert.doesNotMatch(
              boatSource,
              /collisionSequence \+= collisionSummary\.contactCount/,
              'Gameplay scoring must not accumulate raw contact points.',
            );
            assert.match(
              calibrationSource,
              /collisionEventRecorded:/,
              'Browser collision calibration must verify lifecycle integration.',
            );

            console.log('Collision contact lifecycle contract passed.');
          ''').lstrip()
          write(
              'scripts/collision-contact-lifecycle-contract.mjs',
              lifecycle_contract,
          )

          rapier_path = 'sim/collision/RapierCollisionWorld.ts'
          replace_once(
              rapier_path,
              "import type { VesselConfig } from '@/sim/vessels/VesselConfig';\n",
              "import type { VesselConfig } from '@/sim/vessels/VesselConfig';\nimport {\n  CollisionContactLifecycle,\n  type CollisionContactPairObservation,\n} from './CollisionContactLifecycle';\n",
          )
          replace_once(
              rapier_path,
              "export interface RapierContactSummary {\n  contactCount: number;\n  terrainContactCount: number;\n  obstacleContactCount: number;\n  debugProbeContactCount: number;\n  fixtureContactCount: number;\n",
              "export interface RapierContactSummary {\n  /** Raw active manifold-point count for diagnostics and calibration only. */\n  contactCount: number;\n  terrainContactCount: number;\n  obstacleContactCount: number;\n  debugProbeContactCount: number;\n  fixtureContactCount: number;\n  activeContactPairCount: number;\n  activeExternalContactCount: number;\n  contactStartCount: number;\n  terrainContactStartCount: number;\n  obstacleContactStartCount: number;\n  debugProbeContactStartCount: number;\n  fixtureContactStartCount: number;\n  contactEndCount: number;\n",
          )
          replace_once(
              rapier_path,
              "    debugProbeContactCount: 0,\n    fixtureContactCount: 0,\n    fixtureKind: null,\n",
              "    debugProbeContactCount: 0,\n    fixtureContactCount: 0,\n    activeContactPairCount: 0,\n    activeExternalContactCount: 0,\n    contactStartCount: 0,\n    terrainContactStartCount: 0,\n    obstacleContactStartCount: 0,\n    debugProbeContactStartCount: 0,\n    fixtureContactStartCount: 0,\n    contactEndCount: 0,\n    fixtureKind: null,\n",
          )
          replace_once(
              rapier_path,
              "  private readonly vesselColliderHandles = new Set<number>();\n\n  private vesselBody",
              "  private readonly vesselColliderHandles = new Set<number>();\n  private readonly contactLifecycle = new CollisionContactLifecycle();\n\n  private vesselBody",
          )
          replace_once(
              rapier_path,
              "  dispose() {\n    this.world.free();\n  }\n",
              "  dispose() {\n    this.contactLifecycle.reset();\n    this.world.free();\n  }\n",
          )
          replace_once(
              rapier_path,
              "    const summary = createEmptySummary();\n    const visitedPairs = new Set<string>();\n",
              "    const summary = createEmptySummary();\n    const visitedPairs = new Set<string>();\n    const activeContactPairs: CollisionContactPairObservation[] = [];\n",
          )
          replace_once(
              rapier_path,
              "        if (visitedPairs.has(pairKey)) return;\n        visitedPairs.add(pairKey);\n\n        this.world.contactPair(\n",
              "        if (visitedPairs.has(pairKey)) return;\n        visitedPairs.add(pairKey);\n\n        const isCalibrationFixture =\n          otherCollider.handle === this.calibrationFixtureCollider?.handle;\n        const fixtureIsTerrain =\n          isCalibrationFixture &&\n          this.calibrationFixtureKind === 'shoreline';\n        const isTerrain =\n          otherCollider.handle === this.terrainCollider.handle ||\n          fixtureIsTerrain;\n        const isDebugProbe =\n          otherCollider.handle === this.debugProbeCollider?.handle;\n        let pairHasContact = false;\n\n        this.world.contactPair(\n",
          )
          replace_once(
              rapier_path,
              "            const isCalibrationFixture =\n              otherCollider.handle === this.calibrationFixtureCollider?.handle;\n            const fixtureIsTerrain =\n              isCalibrationFixture &&\n              this.calibrationFixtureKind === 'shoreline';\n            const isTerrain =\n              otherCollider.handle === this.terrainCollider.handle ||\n              fixtureIsTerrain;\n            const isDebugProbe =\n              otherCollider.handle === this.debugProbeCollider?.handle;\n\n            const rawNormal = manifold.normal();\n",
              "            pairHasContact = true;\n\n            const rawNormal = manifold.normal();\n",
          )
          replace_once(
              rapier_path,
              "          },\n        );\n      });\n",
              "          },\n        );\n\n        if (pairHasContact) {\n          activeContactPairs.push({\n            pairKey,\n            externalKey: `collider:${otherCollider.handle}`,\n            kind: isTerrain ? 'terrain' : 'obstacle',\n            fixture: isCalibrationFixture,\n            debugProbe: isDebugProbe,\n          });\n        }\n      });\n",
          )
          replace_once(
              rapier_path,
              "    const solvedTranslation = vesselBody.translation();\n",
              "    const lifecycleSummary = this.contactLifecycle.advance(\n      activeContactPairs,\n      deltaSeconds,\n    );\n    summary.activeContactPairCount =\n      lifecycleSummary.activeContactPairCount;\n    summary.activeExternalContactCount =\n      lifecycleSummary.activeExternalContactCount;\n    summary.contactStartCount = lifecycleSummary.contactStartCount;\n    summary.terrainContactStartCount =\n      lifecycleSummary.terrainContactStartCount;\n    summary.obstacleContactStartCount =\n      lifecycleSummary.obstacleContactStartCount;\n    summary.debugProbeContactStartCount =\n      lifecycleSummary.debugProbeContactStartCount;\n    summary.fixtureContactStartCount =\n      lifecycleSummary.fixtureContactStartCount;\n    summary.contactEndCount = lifecycleSummary.contactEndCount;\n\n    const solvedTranslation = vesselBody.translation();\n",
          )
          replace_once(
              rapier_path,
              "    this.removeDebugProbe();\n    this.removeCalibrationFixture();\n\n    this.vesselType = vessel.type;\n",
              "    this.removeDebugProbe();\n    this.removeCalibrationFixture();\n    this.contactLifecycle.reset();\n\n    this.vesselType = vessel.type;\n",
          )

          boat_path = 'components/Boat.tsx'
          replace_once(
              boat_path,
              "      if (collisionSummary.contactCount > 0) {\n        sharedPhysics.collisionSequence += collisionSummary.contactCount;\n      }\n      if (collisionSummary.terrainContactCount > 0) {\n        sharedPhysics.terrainCollisionSequence +=\n          collisionSummary.terrainContactCount;\n      }\n      if (collisionSummary.obstacleContactCount > 0) {\n        sharedPhysics.obstacleCollisionSequence +=\n          collisionSummary.obstacleContactCount;\n      }\n      if (collisionSummary.debugProbeContactCount > 0) {\n        sharedPhysics.debugProbeCollisionSequence +=\n          collisionSummary.debugProbeContactCount;\n      }\n",
              "      // Gameplay and mission scoring count external contact starts.\n      // Raw manifold points remain available on the collision summary for\n      // calibration and impact diagnostics, but cannot multiply one sustained\n      // grounding into a collision every fixed step.\n      if (collisionSummary.contactStartCount > 0) {\n        sharedPhysics.collisionSequence +=\n          collisionSummary.contactStartCount;\n      }\n      if (collisionSummary.terrainContactStartCount > 0) {\n        sharedPhysics.terrainCollisionSequence +=\n          collisionSummary.terrainContactStartCount;\n      }\n      if (collisionSummary.obstacleContactStartCount > 0) {\n        sharedPhysics.obstacleCollisionSequence +=\n          collisionSummary.obstacleContactStartCount;\n      }\n      if (collisionSummary.debugProbeContactStartCount > 0) {\n        sharedPhysics.debugProbeCollisionSequence +=\n          collisionSummary.debugProbeContactStartCount;\n      }\n",
          )

          calibration_path = 'sim/calibration/CollisionCalibration.ts'
          replace_once(
              calibration_path,
              "  private obstacleContactCount = 0;\n  private firstContactTimeSeconds",
              "  private obstacleContactCount = 0;\n  private contactStartCount = 0;\n  private terrainContactStartCount = 0;\n  private obstacleContactStartCount = 0;\n  private firstContactTimeSeconds",
          )
          replace_once(
              calibration_path,
              "    const collision = metrics.collisionSummary;\n    const stepContactCount = collision?.contactCount ?? 0;\n    if (stepContactCount > 0) {\n",
              "    const collision = metrics.collisionSummary;\n    const stepContactCount = collision?.contactCount ?? 0;\n    const stepContactStartCount = collision?.contactStartCount ?? 0;\n    if (stepContactStartCount > 0) {\n      this.contactStartCount += stepContactStartCount;\n      this.terrainContactStartCount +=\n        collision?.terrainContactStartCount ?? 0;\n      this.obstacleContactStartCount +=\n        collision?.obstacleContactStartCount ?? 0;\n    }\n    if (stepContactCount > 0) {\n",
          )
          replace_once(
              calibration_path,
              "      collisionClassRecorded: expectedTerrain\n        ? this.terrainContactCount > 0\n        : this.obstacleContactCount > 0,\n      impactSpeedWithinEnvelope:",
              "      collisionClassRecorded: expectedTerrain\n        ? this.terrainContactCount > 0\n        : this.obstacleContactCount > 0,\n      collisionEventRecorded: this.contactStartCount > 0,\n      collisionClassEventRecorded: expectedTerrain\n        ? this.terrainContactStartCount > 0\n        : this.obstacleContactStartCount > 0,\n      impactSpeedWithinEnvelope:",
          )

          package_path = 'package.json'
          replace_once(
              package_path,
              '    "test:world-direction": "node --experimental-strip-types --no-warnings scripts/world-direction-contract.mjs",\n',
              '    "test:world-direction": "node --experimental-strip-types --no-warnings scripts/world-direction-contract.mjs",\n    "test:collision-lifecycle": "node --experimental-strip-types --no-warnings scripts/collision-contact-lifecycle-contract.mjs",\n',
          )
          replace_once(
              package_path,
              'npm run test:world-direction && node --experimental-strip-types --no-warnings scripts/physics-correctness.mjs && node --no-warnings scripts/collision-authority.mjs',
              'npm run test:world-direction && npm run test:collision-lifecycle && node --experimental-strip-types --no-warnings scripts/physics-correctness.mjs && node --no-warnings scripts/collision-authority.mjs',
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate collision lifecycle implementation
        run: npm run validate

      - name: Commit validated implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-collision-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: score collision contact-start events"
          git push origin HEAD:agent/simulator-stabilization
