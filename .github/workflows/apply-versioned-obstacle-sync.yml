name: Apply versioned obstacle synchronization

on:
  pull_request:
    paths:
      - .github/workflows/apply-versioned-obstacle-sync.yml

permissions:
  contents: write

concurrency:
  group: versioned-obstacle-sync
  cancel-in-progress: false

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/simulator-stabilization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Install versioned obstacle authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(dedent(content).lstrip(), encoding='utf-8')

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected exactly one target, found {count}'
                  )
              target.write_text(source.replace(old, new, 1), encoding='utf-8')

          write(
              'sim/collision/VersionedObstacleField.ts',
              r'''
              export const MAX_SHARED_OBSTACLES = 250;
              export const OBSTACLE_POSITION_EPSILON_M = 0.02;
              export const OBSTACLE_RADIUS_EPSILON_M = 0.0001;

              export interface ObstacleChangeCollection {
                version: number;
                fullSync: boolean;
              }

              function finite(value: number) {
                return Number.isFinite(value) ? value : 0;
              }

              /**
               * Single-writer/multi-reader obstacle authority for the simulator.
               *
               * Writers mutate slots through set/clear, which advances a monotonic
               * revision only when collider-relevant data changes. Rapier readers
               * can then collect the unique slots changed since their own revision.
               * If a reader falls behind the bounded history, it receives one full
               * synchronization rather than silently missing an update.
               */
              export class VersionedObstacleField {
                readonly data: Float32Array;
                readonly maxObstacles: number;

                private versionValue = 0;
                private readonly historyVersions: Float64Array;
                private readonly historyIndices: Uint32Array;
                private historyStart = 0;
                private historyCount = 0;
                private readonly collectionMarks: Uint32Array;
                private collectionEpoch = 0;
                private readonly collectionResult: ObstacleChangeCollection = {
                  version: 0,
                  fullSync: false,
                };

                constructor(
                  maxObstacles = MAX_SHARED_OBSTACLES,
                  historyCapacity = Math.max(maxObstacles * 8, maxObstacles),
                ) {
                  if (!Number.isInteger(maxObstacles) || maxObstacles <= 0) {
                    throw new RangeError('maxObstacles must be a positive integer.');
                  }
                  if (!Number.isInteger(historyCapacity) || historyCapacity <= 0) {
                    throw new RangeError('historyCapacity must be a positive integer.');
                  }

                  this.maxObstacles = maxObstacles;
                  this.data = new Float32Array(maxObstacles * 4);
                  this.historyVersions = new Float64Array(historyCapacity);
                  this.historyIndices = new Uint32Array(historyCapacity);
                  this.collectionMarks = new Uint32Array(maxObstacles);
                }

                get version() {
                  return this.versionValue;
                }

                set(
                  index: number,
                  x: number,
                  y: number,
                  z: number,
                  radius: number,
                ) {
                  this.assertIndex(index);
                  if (
                    !Number.isFinite(x) ||
                    !Number.isFinite(y) ||
                    !Number.isFinite(z) ||
                    !Number.isFinite(radius) ||
                    radius <= 0
                  ) {
                    return this.clear(index);
                  }

                  const offset = index * 4;
                  const currentRadius = this.data[offset + 3];
                  const changed =
                    currentRadius <= 0 ||
                    Math.abs(this.data[offset] - x) >
                      OBSTACLE_POSITION_EPSILON_M ||
                    Math.abs(this.data[offset + 1] - y) >
                      OBSTACLE_POSITION_EPSILON_M ||
                    Math.abs(this.data[offset + 2] - z) >
                      OBSTACLE_POSITION_EPSILON_M ||
                    Math.abs(currentRadius - radius) >
                      OBSTACLE_RADIUS_EPSILON_M;
                  if (!changed) return false;

                  this.data[offset] = finite(x);
                  this.data[offset + 1] = finite(y);
                  this.data[offset + 2] = finite(z);
                  this.data[offset + 3] = Math.max(0, finite(radius));
                  this.recordChange(index);
                  return true;
                }

                clear(index: number) {
                  this.assertIndex(index);
                  const offset = index * 4;
                  if (
                    this.data[offset] === 0 &&
                    this.data[offset + 1] === 0 &&
                    this.data[offset + 2] === 0 &&
                    this.data[offset + 3] === 0
                  ) {
                    return false;
                  }

                  this.data.fill(0, offset, offset + 4);
                  this.recordChange(index);
                  return true;
                }

                collectChangedIndicesSince(
                  sinceVersion: number,
                  target: number[],
                ): Readonly<ObstacleChangeCollection> {
                  target.length = 0;
                  const currentVersion = this.versionValue;
                  this.collectionResult.version = currentVersion;
                  this.collectionResult.fullSync = false;

                  if (sinceVersion === currentVersion) {
                    return this.collectionResult;
                  }

                  if (
                    !Number.isFinite(sinceVersion) ||
                    sinceVersion < 0 ||
                    sinceVersion > currentVersion ||
                    this.historyCount === 0
                  ) {
                    this.collectFullSync(target);
                    return this.collectionResult;
                  }

                  const oldestVersion =
                    this.historyVersions[this.historyStart];
                  if (sinceVersion < oldestVersion - 1) {
                    this.collectFullSync(target);
                    return this.collectionResult;
                  }

                  this.collectionEpoch = (this.collectionEpoch + 1) >>> 0;
                  if (this.collectionEpoch === 0) {
                    this.collectionMarks.fill(0);
                    this.collectionEpoch = 1;
                  }

                  for (let offset = 0; offset < this.historyCount; offset += 1) {
                    const historyIndex =
                      (this.historyStart + offset) %
                      this.historyVersions.length;
                    if (this.historyVersions[historyIndex] <= sinceVersion) {
                      continue;
                    }
                    const obstacleIndex = this.historyIndices[historyIndex];
                    if (
                      this.collectionMarks[obstacleIndex] ===
                      this.collectionEpoch
                    ) {
                      continue;
                    }
                    this.collectionMarks[obstacleIndex] = this.collectionEpoch;
                    target.push(obstacleIndex);
                  }

                  return this.collectionResult;
                }

                private collectFullSync(target: number[]) {
                  for (let index = 0; index < this.maxObstacles; index += 1) {
                    target.push(index);
                  }
                  this.collectionResult.fullSync = true;
                }

                private recordChange(index: number) {
                  this.versionValue += 1;
                  const capacity = this.historyVersions.length;
                  let historyIndex: number;

                  if (this.historyCount < capacity) {
                    historyIndex =
                      (this.historyStart + this.historyCount) % capacity;
                    this.historyCount += 1;
                  } else {
                    historyIndex = this.historyStart;
                    this.historyStart = (this.historyStart + 1) % capacity;
                  }

                  this.historyVersions[historyIndex] = this.versionValue;
                  this.historyIndices[historyIndex] = index;
                }

                private assertIndex(index: number) {
                  if (
                    !Number.isInteger(index) ||
                    index < 0 ||
                    index >= this.maxObstacles
                  ) {
                    throw new RangeError(
                      `Obstacle index ${index} is outside 0-${
                        this.maxObstacles - 1
                      }.`,
                    );
                  }
                }
              }

              export const sharedObstacleField = new VersionedObstacleField();
              ''',
          )

          write(
              'scripts/versioned-obstacle-field-contract.mjs',
              r'''
              import assert from 'node:assert/strict';
              import fs from 'node:fs/promises';
              import {
                OBSTACLE_POSITION_EPSILON_M,
                VersionedObstacleField,
              } from '../sim/collision/VersionedObstacleField.ts';

              const field = new VersionedObstacleField(4, 8);
              const changed = [];

              const initial = field.collectChangedIndicesSince(-1, changed);
              assert.equal(initial.version, 0);
              assert.equal(initial.fullSync, true);
              assert.deepEqual(changed, [0, 1, 2, 3]);

              const unchanged = field.collectChangedIndicesSince(0, changed);
              assert.equal(unchanged.fullSync, false);
              assert.deepEqual(changed, []);

              assert.equal(field.set(1, 10, 0, -5, 1), true);
              assert.equal(field.version, 1);
              assert.equal(field.set(1, 10, 0, -5, 1), false);
              assert.equal(field.version, 1);
              assert.equal(
                field.set(
                  1,
                  10,
                  OBSTACLE_POSITION_EPSILON_M * 0.5,
                  -5,
                  1,
                ),
                false,
                'Sub-centimetre visual movement must not dirty the collider.',
              );

              assert.equal(field.set(1, 10, 0.05, -5, 1), true);
              assert.equal(field.set(1, 10, 0.1, -5, 1), true);
              assert.equal(field.set(2, -3, 1, 4, 0.8), true);
              const incremental = field.collectChangedIndicesSince(1, changed);
              assert.equal(incremental.fullSync, false);
              assert.equal(incremental.version, 4);
              assert.deepEqual(
                changed,
                [1, 2],
                'Repeated changes to one slot must be deduplicated per sync.',
              );

              assert.equal(field.clear(1), true);
              assert.equal(field.clear(1), false);
              field.collectChangedIndicesSince(4, changed);
              assert.deepEqual(changed, [1]);
              assert.equal(field.data[1 * 4 + 3], 0);

              assert.equal(field.set(3, Number.NaN, 0, 0, 1), false);
              assert.throws(() => field.set(4, 0, 0, 0, 1), RangeError);

              const shortHistory = new VersionedObstacleField(3, 2);
              shortHistory.set(0, 0, 0, 0, 1);
              shortHistory.set(1, 1, 0, 0, 1);
              shortHistory.set(2, 2, 0, 0, 1);
              const recovered = shortHistory.collectChangedIndicesSince(0, changed);
              assert.equal(recovered.fullSync, true);
              assert.deepEqual(changed, [0, 1, 2]);

              const storeSource = await fs.readFile(
                new URL('../store/useSimStore.ts', import.meta.url),
                'utf8',
              );
              const buoySource = await fs.readFile(
                new URL('../components/Buoys.tsx', import.meta.url),
                'utf8',
              );
              const boatSource = await fs.readFile(
                new URL('../components/Boat.tsx', import.meta.url),
                'utf8',
              );
              const rapierSource = await fs.readFile(
                new URL(
                  '../sim/collision/RapierCollisionWorld.ts',
                  import.meta.url,
                ),
                'utf8',
              );

              assert.match(
                storeSource,
                /obstacleField: sharedObstacleField/,
                'Shared physics must expose the versioned obstacle authority.',
              );
              assert.doesNotMatch(
                storeSource,
                /obstacles: new Float32Array/,
                'The raw unversioned obstacle array must not return.',
              );
              assert.match(buoySource, /sharedPhysics\.obstacleField\.set\(/);
              assert.match(buoySource, /sharedPhysics\.obstacleField\.clear\(id\)/);
              assert.doesNotMatch(buoySource, /sharedPhysics\.obstacles\[/);
              assert.match(
                boatSource,
                /sharedPhysics\.obstacleField,/,
                'Boat must pass the obstacle authority into Rapier.',
              );
              assert.match(
                rapierSource,
                /if \(obstacleField\.version === this\.lastObstacleVersion\) return;/,
                'Unchanged physics steps must skip obstacle synchronization.',
              );
              assert.match(
                rapierSource,
                /collectChangedIndicesSince\(/,
                'Rapier must request only slots changed since its revision.',
              );
              assert.doesNotMatch(
                rapierSource,
                /for \(let index = 0; index < MAX_OBSTACLES; index \+= 1\)/,
                'The per-step 250-slot scan must not return.',
              );

              console.log('Versioned obstacle field contract passed.');
              ''',
          )

          replace_once(
              'store/useSimStore.ts',
              "import { normalizeHeadingDegrees } from '@/sim/world/WorldDirection';\n",
              "import { normalizeHeadingDegrees } from '@/sim/world/WorldDirection';\nimport {\n  MAX_SHARED_OBSTACLES,\n  sharedObstacleField,\n} from '@/sim/collision/VersionedObstacleField';\n",
              'Store obstacle authority import',
          )
          replace_once(
              'store/useSimStore.ts',
              'export const MAX_OBSTACLES = 250;\n',
              'export const MAX_OBSTACLES = MAX_SHARED_OBSTACLES;\n',
              'Store obstacle maximum',
          )
          replace_once(
              'store/useSimStore.ts',
              '  obstacles: new Float32Array(MAX_OBSTACLES * 4), // x, y, z, radius\n',
              '  obstacleField: sharedObstacleField,\n',
              'Store versioned obstacle field',
          )

          replace_once(
              'components/Buoys.tsx',
              "  useEffect(() => {\n    const obstacleOffset = id * 4;\n    sharedPhysics.obstacles[obstacleOffset] = x;\n    sharedPhysics.obstacles[obstacleOffset + 1] = 0;\n    sharedPhysics.obstacles[obstacleOffset + 2] = z;\n    sharedPhysics.obstacles[obstacleOffset + 3] = 1;\n\n    return () => {\n      sharedPhysics.obstacles.fill(0, obstacleOffset, obstacleOffset + 4);\n    };\n  }, [id, x, z]);\n",
              "  useEffect(() => {\n    sharedPhysics.obstacleField.set(id, x, 0, z, 1);\n\n    return () => {\n      sharedPhysics.obstacleField.clear(id);\n    };\n  }, [id, x, z]);\n",
              'Buoy obstacle registration',
          )
          replace_once(
              'components/Buoys.tsx',
              '      sharedPhysics.obstacles[id * 4 + 1] = wave.y;\n',
              '      sharedPhysics.obstacleField.set(id, x, wave.y, z, 1);\n',
              'Buoy obstacle motion',
          )

          replace_once(
              'components/Boat.tsx',
              '            sharedPhysics.obstacles,\n',
              '            sharedPhysics.obstacleField,\n',
              'Boat obstacle authority input',
          )

          replace_once(
              'sim/collision/RapierCollisionWorld.ts',
              "import type { SixDofBody } from '@/sim/core/SixDofBody';\n",
              "import type { SixDofBody } from '@/sim/core/SixDofBody';\nimport type { VersionedObstacleField } from './VersionedObstacleField';\n",
              'Rapier obstacle field import',
          )
          replace_once(
              'sim/collision/RapierCollisionWorld.ts',
              '  private readonly obstacleRadii = new Float32Array(MAX_OBSTACLES);\n',
              '  private readonly obstacleRadii = new Float32Array(MAX_OBSTACLES);\n  private readonly changedObstacleIndices: number[] = [];\n  private lastObstacleVersion = -1;\n',
              'Rapier obstacle revision state',
          )
          replace_once(
              'sim/collision/RapierCollisionWorld.ts',
              '    obstacleData: Float32Array,\n',
              '    obstacleField: VersionedObstacleField,\n',
              'Rapier step obstacle input',
          )
          replace_once(
              'sim/collision/RapierCollisionWorld.ts',
              '    this.syncObstacles(obstacleData);\n',
              '    this.syncObstacles(obstacleField);\n',
              'Rapier obstacle synchronization call',
          )

          rapier_path = Path('sim/collision/RapierCollisionWorld.ts')
          rapier = rapier_path.read_text(encoding='utf-8')
          sync_start = rapier.index(
              '  private syncObstacles(obstacleData: Float32Array) {'
          )
          sync_end = rapier.index(
              '\n  private syncCalibrationFixture(',
              sync_start,
          )
          replacement = dedent(r'''
            private syncObstacles(obstacleField: VersionedObstacleField) {
              if (obstacleField.version === this.lastObstacleVersion) return;
              if (obstacleField.maxObstacles !== MAX_OBSTACLES) {
                throw new RangeError(
                  `Expected ${MAX_OBSTACLES} obstacle slots, received ${
                    obstacleField.maxObstacles
                  }.`,
                );
              }

              const collection = obstacleField.collectChangedIndicesSince(
                this.lastObstacleVersion,
                this.changedObstacleIndices,
              );
              const obstacleData = obstacleField.data;

              for (const index of this.changedObstacleIndices) {
                const offset = index * 4;
                const x = obstacleData[offset];
                const y = obstacleData[offset + 1];
                const z = obstacleData[offset + 2];
                const radius = obstacleData[offset + 3];
                const active =
                  radius > 0 && Number.isFinite(x + y + z + radius);
                let collider = this.obstacleColliders[index];

                if (!active) {
                  collider?.setEnabled(false);
                  continue;
                }

                const safeRadius = Math.max(0.2, radius);
                if (!collider) {
                  collider = this.world.createCollider(
                    this.rapier.ColliderDesc.ball(safeRadius)
                      .setTranslation(x, y, z)
                      .setFriction(0.15)
                      .setRestitution(0.08)
                      .setContactSkin(CONTACT_PREDICTION_M)
                      .setActiveCollisionTypes(
                        this.rapier.ActiveCollisionTypes.ALL,
                      ),
                  );
                  this.obstacleColliders[index] = collider;
                  this.obstacleRadii[index] = safeRadius;
                } else {
                  collider.setEnabled(true);
                  collider.setTranslation({ x, y, z });
                  if (
                    Math.abs(this.obstacleRadii[index] - safeRadius) >
                    1e-4
                  ) {
                    collider.setRadius(safeRadius);
                    this.obstacleRadii[index] = safeRadius;
                  }
                }
              }

              this.lastObstacleVersion = collection.version;
            }
          ''').rstrip()
          rapier_path.write_text(
              rapier[:sync_start] + replacement + rapier[sync_end:],
              encoding='utf-8',
          )

          replace_once(
              'package.json',
              '    "test:collision-lifecycle": "node --experimental-strip-types --no-warnings scripts/collision-contact-lifecycle-contract.mjs",\n',
              '    "test:obstacle-sync": "node --experimental-strip-types --no-warnings scripts/versioned-obstacle-field-contract.mjs",\n    "test:collision-lifecycle": "node --experimental-strip-types --no-warnings scripts/collision-contact-lifecycle-contract.mjs",\n',
              'Obstacle synchronization test command',
          )
          replace_once(
              'package.json',
              '    "test:collision-architecture": "npm run test:collision-lifecycle && npm run test:collision-runtime",\n',
              '    "test:collision-architecture": "npm run test:obstacle-sync && npm run test:collision-lifecycle && npm run test:collision-runtime",\n',
              'Collision architecture gate',
          )

          replace_once(
              'SIMULATOR_STABILIZATION_PLAN.md',
              '- [ ] Version obstacle data and synchronize Rapier colliders only when obstacle state changes.\n',
              '- [x] Version obstacle data and synchronize only changed Rapier collider slots, skipping unchanged fixed steps entirely.\n',
              'P2 obstacle synchronization checkpoint',
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate obstacle synchronization contract
        run: npm run test:obstacle-sync

      - name: Validate complete repository
        run: npm run validate

      - name: Commit validated synchronization
        shell: bash
        run: |
          rm .github/workflows/apply-versioned-obstacle-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: version obstacle collider synchronization"
          git push origin HEAD:agent/simulator-stabilization
