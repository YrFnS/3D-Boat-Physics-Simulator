name: Phase 5E source snapshot

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5e-source-snapshot.yml'
      - 'P5E_PHYSICAL_CALIBRATION_PLAN.md'
  push:
    branches:
      - agent/phase-5e-physical-calibration
    paths:
      - '.github/workflows/phase5e-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5e-physical-calibration'
    name: Package exact Phase 5E source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Phase 5E branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5e-physical-calibration

      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/phase5e-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5e-source-snapshot
          path: ${{ runner.temp }}/phase5e-source.tar.gz
          include-hidden-files: true
          retention-days: 1
