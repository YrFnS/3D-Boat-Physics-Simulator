name: Measure Phase 5E propulsion tuning

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5e-source-snapshot.yml'
      - 'scripts/.phase5e-tuning.patch.gz.b64'
  push:
    branches:
      - agent/phase-5e-physical-calibration
    paths:
      - '.github/workflows/phase5e-source-snapshot.yml'
      - 'scripts/.phase5e-tuning.patch.gz.b64'

permissions:
  contents: read

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: phase5e-propulsion-measurement-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5e-physical-calibration'
    name: Apply and measure reference-driven propulsion
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out Phase 5E branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5e-physical-calibration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply tuning patch
        run: |
          echo '44c18ae276995c11b28e953040eb244a0fa22235babf4ec841efe9f33357b85a  scripts/.phase5e-tuning.patch.gz.b64' | sha256sum --check
          base64 --decode scripts/.phase5e-tuning.patch.gz.b64 > "$RUNNER_TEMP/phase5e-tuning.patch.gz"
          echo 'df0e85053341c8a8f0b59d33045e761e7e1bdd737441ea7162d3895044e5d110  '"$RUNNER_TEMP/phase5e-tuning.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5e-tuning.patch.gz" > "$RUNNER_TEMP/phase5e-tuning.patch"
          echo '491d3e6b912d801cb6c3f9ee8ce626083c04f9bda8539b680173f6fee85c7ec7  '"$RUNNER_TEMP/phase5e-tuning.patch" | sha256sum --check
          git apply -p1 --check "$RUNNER_TEMP/phase5e-tuning.patch"
          git apply -p1 "$RUNNER_TEMP/phase5e-tuning.patch"
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run marine, collision, and physical-reference regressions
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Install calibration browser without changing the lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare standalone server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/phase5e-tuning-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase5e-tuning-server.log
          exit 1

      - name: Run twenty-scenario vessel calibration
        id: calibration
        continue-on-error: true
        run: node scripts/physics-calibration.mjs

      - name: Collect tuning diagnostics
        if: always()
        run: |
          mkdir -p artifacts/phase5e-propulsion-tuning
          cp /tmp/phase5e-tuning-server.log artifacts/phase5e-propulsion-tuning/server.log || true
          cp artifacts/physics-calibration/report.json artifacts/phase5e-propulsion-tuning/calibration-report.json || true
          cp artifacts/physical-reference/report.json artifacts/phase5e-propulsion-tuning/reference-report.json || true
          printf 'workflow reached diagnostics\n' > artifacts/phase5e-propulsion-tuning/workflow.txt

      - name: Upload tuning diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5e-propulsion-tuning
          path: artifacts/phase5e-propulsion-tuning
          if-no-files-found: error
          retention-days: 7

      - name: Enforce tuning calibration
        if: steps.calibration.outcome != 'success'
        run: exit 1
