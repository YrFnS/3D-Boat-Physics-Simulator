name: Phase 5E source snapshot

on:
  push:
    branches:
      - agent/phase-5e-physical-calibration
    paths:
      - '.github/workflows/phase5e-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    name: Package exact Phase 5E source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Phase 5E branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5e-physical-calibration

      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/phase5e-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5e-source-snapshot
          path: ${{ runner.temp }}/phase5e-source.tar.gz
          include-hidden-files: true
          retention-days: 1
