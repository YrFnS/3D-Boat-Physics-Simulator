name: Fix Phase 5D contact impulse indexing

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-fix-impulse-indexing.yml'
      - 'scripts/phase5d-fix-impulse-indexing.py'
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-fix-impulse-indexing.yml'

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: phase5d-fix-impulse-indexing-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority')
    name: Correct, calibrate, and publish impulse telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct geometric-contact impulse indexing
        run: |
          python scripts/phase5d-fix-impulse-indexing.py
          git diff --check

      - name: Remove competing one-use validators
        run: |
          rm -f scripts/phase5d-fix-impulse-indexing.py
          rm -f .github/workflows/phase5d-fix-impulse-indexing.yml
          rm -f .github/workflows/phase5d-aggregate-impulse.yml

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic physics regressions
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Install calibration browser without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare standalone production server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/phase5d-impulse-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase5d-impulse-server.log
          exit 1

      - name: Run twenty-scenario calibration
        run: node scripts/physics-calibration.mjs

      - name: Run desktop, mobile, and collision smoke
        run: node scripts/visual-smoke.mjs

      - name: Verify final source invariants
        run: |
          git diff --check
          ! grep -R "remainingNormalImpulseNs\|applyPositionCorrection" sim components scripts
          grep -q "index < geometricContactCount" sim/collision/RapierCollisionWorld.ts
          grep -q "index < contactCount" scripts/collision-authority.mjs

      - name: Commit and push calibrated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: read Rapier impulses from geometric contacts'
          git push origin HEAD:agent/phase-5d-collision-authority
