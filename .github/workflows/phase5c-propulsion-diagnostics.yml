name: Phase 5C propulsion diagnostics

on:
  push:
    branches:
      - agent/phase-5c-propulsion-maneuvering
    paths:
      - '.github/workflows/phase5c-propulsion-diagnostics.yml'
      - 'scripts/phase5c-propulsion-diagnostics.mjs'

permissions:
  contents: read

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  diagnose:
    name: Capture drivetrain time series
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 5C branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5c-propulsion-maneuvering

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install diagnostic browser without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare standalone server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/phase5c-diagnostics-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase5c-diagnostics-server.log
          exit 1

      - name: Capture propulsion diagnostics
        run: node scripts/phase5c-propulsion-diagnostics.mjs

      - name: Collect server log
        if: always()
        run: |
          mkdir -p artifacts/phase5c-propulsion-diagnostics
          cp /tmp/phase5c-diagnostics-server.log artifacts/phase5c-propulsion-diagnostics/server.log || true

      - name: Upload propulsion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-propulsion-diagnostics
          path: artifacts/phase5c-propulsion-diagnostics
          if-no-files-found: error
          retention-days: 2
