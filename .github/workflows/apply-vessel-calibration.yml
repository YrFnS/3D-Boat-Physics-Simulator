name: Apply vessel calibration suite

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - scripts/apply-vessel-calibration.mjs
      - .github/workflows/apply-vessel-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-vessel-calibration-suite
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Transform, validate, and commit calibration suite
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded calibration integration
        run: node scripts/apply-vessel-calibration.mjs

      - name: Remove one-time tooling
        run: |
          rm -f scripts/apply-vessel-calibration.mjs
          rm -f .github/workflows/apply-vessel-calibration.yml

      - name: Check calibration runner syntax
        run: node --check scripts/physics-calibration.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated calibration suite
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No calibration changes to commit."
            exit 0
          fi
          git commit -m "test: add deterministic vessel calibration"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
