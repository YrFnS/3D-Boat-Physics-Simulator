name: Apply field repair fairness

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: field-repair-fairness-migration
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply field repair and scoring authority
        shell: bash
        run: |
          git fetch origin agent/simulator-stabilization
          git reset --hard origin/agent/simulator-stabilization

          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:180]!r}'
                  )
              write(path, source.replace(old, new, 1))

          field_repair_policy = dedent(r'''
            export interface FieldRepairEligibilityInput {
              requested: boolean;
              speedKnots: number;
              throttle: number;
              propulsionInputActive: boolean;
            }

            export interface FieldRepairStepInput {
              active: boolean;
              deltaSeconds: number;
              hullHealth: number;
              engineHealth: number;
              rudderHealth: number;
              engineTemperatureC: number;
              engineConditionRestoredThisRun: number;
              rudderConditionRestoredThisRun: number;
            }

            export interface FieldRepairStepResult {
              hullHealth: number;
              engineHealth: number;
              rudderHealth: number;
              engineTemperatureC: number;
              engineConditionRestored: number;
              rudderConditionRestored: number;
              meaningful: boolean;
            }

            export interface FieldRepairUsage {
              repairActiveSeconds: number;
              repairActivationCount: number;
              engineConditionRestored: number;
              rudderConditionRestored: number;
            }

            export const FIELD_REPAIR_LIMITS = Object.freeze({
              maximumSpeedKnots: 2,
              maximumThrottleMagnitude: 0.1,
              engineConditionCeiling: 55,
              rudderConditionCeiling: 65,
              engineRestoreRatePerSecond: 0.6,
              rudderRestoreRatePerSecond: 0.9,
              maximumEngineRestorePerRun: 12,
              maximumRudderRestorePerRun: 18,
              engineCoolingCelsiusPerSecond: 4,
              breachStabilizationPerSecond: 0.012,
            });

            const MINIMUM_ENGINE_TEMPERATURE_C = 20;

            function finiteNonNegative(value: number) {
              return Number.isFinite(value) ? Math.max(0, value) : 0;
            }

            function clampHealth(value: number) {
              if (!Number.isFinite(value)) return 0;
              return Math.max(0, Math.min(100, value));
            }

            export function isFieldRepairEligible(
              input: FieldRepairEligibilityInput,
            ) {
              return (
                input.requested &&
                Number.isFinite(input.speedKnots) &&
                Math.abs(input.speedKnots) <=
                  FIELD_REPAIR_LIMITS.maximumSpeedKnots &&
                Number.isFinite(input.throttle) &&
                Math.abs(input.throttle) <=
                  FIELD_REPAIR_LIMITS.maximumThrottleMagnitude &&
                !input.propulsionInputActive
              );
            }

            export function applyFieldRepairStep(
              input: FieldRepairStepInput,
            ): FieldRepairStepResult {
              const hullHealth = clampHealth(input.hullHealth);
              const engineHealth = clampHealth(input.engineHealth);
              const rudderHealth = clampHealth(input.rudderHealth);
              const engineTemperatureC = Number.isFinite(input.engineTemperatureC)
                ? Math.max(MINIMUM_ENGINE_TEMPERATURE_C, input.engineTemperatureC)
                : MINIMUM_ENGINE_TEMPERATURE_C;
              const deltaSeconds = finiteNonNegative(input.deltaSeconds);

              if (!input.active || deltaSeconds <= 0) {
                return {
                  hullHealth,
                  engineHealth,
                  rudderHealth,
                  engineTemperatureC,
                  engineConditionRestored: 0,
                  rudderConditionRestored: 0,
                  meaningful: false,
                };
              }

              const engineBudgetRemaining = Math.max(
                0,
                FIELD_REPAIR_LIMITS.maximumEngineRestorePerRun -
                  finiteNonNegative(input.engineConditionRestoredThisRun),
              );
              const rudderBudgetRemaining = Math.max(
                0,
                FIELD_REPAIR_LIMITS.maximumRudderRestorePerRun -
                  finiteNonNegative(input.rudderConditionRestoredThisRun),
              );
              const engineConditionRestored = Math.min(
                FIELD_REPAIR_LIMITS.engineRestoreRatePerSecond * deltaSeconds,
                Math.max(
                  0,
                  FIELD_REPAIR_LIMITS.engineConditionCeiling - engineHealth,
                ),
                engineBudgetRemaining,
              );
              const rudderConditionRestored = Math.min(
                FIELD_REPAIR_LIMITS.rudderRestoreRatePerSecond * deltaSeconds,
                Math.max(
                  0,
                  FIELD_REPAIR_LIMITS.rudderConditionCeiling - rudderHealth,
                ),
                rudderBudgetRemaining,
              );
              const cooledTemperatureC = Math.max(
                MINIMUM_ENGINE_TEMPERATURE_C,
                engineTemperatureC -
                  FIELD_REPAIR_LIMITS.engineCoolingCelsiusPerSecond *
                    deltaSeconds,
              );

              return {
                // Structural hull condition requires a dockyard and cannot be
                // restored by the underway bilge/emergency-repair action.
                hullHealth,
                engineHealth: clampHealth(
                  engineHealth + engineConditionRestored,
                ),
                rudderHealth: clampHealth(
                  rudderHealth + rudderConditionRestored,
                ),
                engineTemperatureC: cooledTemperatureC,
                engineConditionRestored,
                rudderConditionRestored,
                meaningful:
                  engineConditionRestored > 0 ||
                  rudderConditionRestored > 0 ||
                  cooledTemperatureC < engineTemperatureC,
              };
            }

            export function calculateFieldRepairPenalty(
              usage: FieldRepairUsage,
            ) {
              const activeSeconds = finiteNonNegative(
                usage.repairActiveSeconds,
              );
              const activationCount = Math.floor(
                finiteNonNegative(usage.repairActivationCount),
              );
              const engineRestored = finiteNonNegative(
                usage.engineConditionRestored,
              );
              const rudderRestored = finiteNonNegative(
                usage.rudderConditionRestored,
              );

              return Math.round(
                Math.min(
                  250,
                  activeSeconds * 1.25 +
                    activationCount * 12 +
                    engineRestored * 5 +
                    rudderRestored * 3.5,
                ),
              );
            }
          ''').lstrip()
          write('sim/vessels/FieldRepairPolicy.ts', field_repair_policy)

          mission_runtime = dedent(r'''
            export interface MissionRuntimeStatisticsStep {
              runId: number;
              vesselGeneration: number;
              enabled: boolean;
              deltaSeconds: number;
              boatX: number;
              boatZ: number;
              speedKnots: number;
              repairActive?: boolean;
              engineConditionRestored?: number;
              rudderConditionRestored?: number;
            }

            export interface MissionRuntimeStatisticsSnapshot {
              runId: number;
              vesselGeneration: number;
              elapsedSeconds: number;
              distanceTravelledM: number;
              maximumSpeedKnots: number;
              fixedStepCount: number;
              repairActiveSeconds: number;
              repairActivationCount: number;
              engineConditionRestored: number;
              rudderConditionRestored: number;
            }

            export const DEFAULT_MAXIMUM_MISSION_SAMPLE_DISTANCE_M = 60;

            function normalizeIdentity(value: number) {
              return Number.isFinite(value) ? Math.trunc(value) : -1;
            }

            function finiteNonNegative(value: number | undefined) {
              return typeof value === 'number' && Number.isFinite(value)
                ? Math.max(0, value)
                : 0;
            }

            /**
             * Fixed-step authority for scored mission movement and repair use.
             *
             * A new scenario run resets every statistic. Vessel recovery only
             * reanchors position and repair activation state, preserving elapsed
             * time, travelled distance, and already-consumed repair allowance.
             */
            export class MissionRuntimeStatistics {
              private readonly state: MissionRuntimeStatisticsSnapshot = {
                runId: -1,
                vesselGeneration: -1,
                elapsedSeconds: 0,
                distanceTravelledM: 0,
                maximumSpeedKnots: 0,
                fixedStepCount: 0,
                repairActiveSeconds: 0,
                repairActivationCount: 0,
                engineConditionRestored: 0,
                rudderConditionRestored: 0,
              };
              private previousBoatX = 0;
              private previousBoatZ = 0;
              private hasPreviousPosition = false;
              private repairWasActive = false;
              readonly maximumSampleDistanceM: number;

              constructor(
                maximumSampleDistanceM =
                  DEFAULT_MAXIMUM_MISSION_SAMPLE_DISTANCE_M,
              ) {
                this.maximumSampleDistanceM =
                  Number.isFinite(maximumSampleDistanceM) &&
                  maximumSampleDistanceM > 0
                    ? maximumSampleDistanceM
                    : DEFAULT_MAXIMUM_MISSION_SAMPLE_DISTANCE_M;
              }

              get snapshot(): Readonly<MissionRuntimeStatisticsSnapshot> {
                return this.state;
              }

              reset(
                runId = -1,
                vesselGeneration = -1,
                boatX = Number.NaN,
                boatZ = Number.NaN,
              ) {
                this.state.runId = normalizeIdentity(runId);
                this.state.vesselGeneration = normalizeIdentity(vesselGeneration);
                this.state.elapsedSeconds = 0;
                this.state.distanceTravelledM = 0;
                this.state.maximumSpeedKnots = 0;
                this.state.fixedStepCount = 0;
                this.state.repairActiveSeconds = 0;
                this.state.repairActivationCount = 0;
                this.state.engineConditionRestored = 0;
                this.state.rudderConditionRestored = 0;
                this.repairWasActive = false;
                this.reanchor(boatX, boatZ);
                return this.state;
              }

              advance(
                step: MissionRuntimeStatisticsStep,
              ): Readonly<MissionRuntimeStatisticsSnapshot> {
                const runId = normalizeIdentity(step.runId);
                const vesselGeneration = normalizeIdentity(
                  step.vesselGeneration,
                );

                if (this.state.runId !== runId) {
                  this.reset(
                    runId,
                    vesselGeneration,
                    step.boatX,
                    step.boatZ,
                  );
                } else if (
                  this.state.vesselGeneration !== vesselGeneration
                ) {
                  this.state.vesselGeneration = vesselGeneration;
                  this.repairWasActive = false;
                  this.reanchor(step.boatX, step.boatZ);
                }

                const deltaSeconds = finiteNonNegative(step.deltaSeconds);
                if (!step.enabled || deltaSeconds <= 0) {
                  this.repairWasActive = false;
                  this.reanchor(step.boatX, step.boatZ);
                  return this.state;
                }

                this.state.elapsedSeconds += deltaSeconds;
                this.state.fixedStepCount += 1;
                if (Number.isFinite(step.speedKnots)) {
                  this.state.maximumSpeedKnots = Math.max(
                    this.state.maximumSpeedKnots,
                    Math.abs(step.speedKnots),
                  );
                }

                const repairActive = step.repairActive === true;
                if (repairActive) {
                  this.state.repairActiveSeconds += deltaSeconds;
                  if (!this.repairWasActive) {
                    this.state.repairActivationCount += 1;
                  }
                }
                this.repairWasActive = repairActive;
                this.state.engineConditionRestored += finiteNonNegative(
                  step.engineConditionRestored,
                );
                this.state.rudderConditionRestored += finiteNonNegative(
                  step.rudderConditionRestored,
                );

                if (
                  Number.isFinite(step.boatX) &&
                  Number.isFinite(step.boatZ)
                ) {
                  if (this.hasPreviousPosition) {
                    const sampleDistanceM = Math.hypot(
                      step.boatX - this.previousBoatX,
                      step.boatZ - this.previousBoatZ,
                    );
                    if (
                      Number.isFinite(sampleDistanceM) &&
                      sampleDistanceM <= this.maximumSampleDistanceM
                    ) {
                      this.state.distanceTravelledM += sampleDistanceM;
                    }
                  }
                  this.previousBoatX = step.boatX;
                  this.previousBoatZ = step.boatZ;
                  this.hasPreviousPosition = true;
                } else {
                  this.hasPreviousPosition = false;
                }

                return this.state;
              }

              private reanchor(boatX: number, boatZ: number) {
                if (Number.isFinite(boatX) && Number.isFinite(boatZ)) {
                  this.previousBoatX = boatX;
                  this.previousBoatZ = boatZ;
                  this.hasPreviousPosition = true;
                } else {
                  this.hasPreviousPosition = false;
                }
              }
            }

            /** Shared authority survives Boat remounts caused by recovery. */
            export const sharedMissionRuntimeStatistics =
              new MissionRuntimeStatistics();
          ''').lstrip()
          write('sim/scenarios/MissionRuntimeStatistics.ts', mission_runtime)

          field_repair_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              applyFieldRepairStep,
              calculateFieldRepairPenalty,
              FIELD_REPAIR_LIMITS,
              isFieldRepairEligible,
            } from '../sim/vessels/FieldRepairPolicy.ts';

            assert.equal(
              isFieldRepairEligible({
                requested: true,
                speedKnots: 1.5,
                throttle: 0,
                propulsionInputActive: false,
              }),
              true,
            );
            assert.equal(
              isFieldRepairEligible({
                requested: true,
                speedKnots: 2.1,
                throttle: 0,
                propulsionInputActive: false,
              }),
              false,
            );
            assert.equal(
              isFieldRepairEligible({
                requested: true,
                speedKnots: 0,
                throttle: 0.2,
                propulsionInputActive: false,
              }),
              false,
            );

            const oneSecond = applyFieldRepairStep({
              active: true,
              deltaSeconds: 1,
              hullHealth: 40,
              engineHealth: 30,
              rudderHealth: 35,
              engineTemperatureC: 80,
              engineConditionRestoredThisRun: 0,
              rudderConditionRestoredThisRun: 0,
            });
            assert.equal(oneSecond.hullHealth, 40);
            assert.equal(
              oneSecond.engineHealth,
              30 + FIELD_REPAIR_LIMITS.engineRestoreRatePerSecond,
            );
            assert.equal(
              oneSecond.rudderHealth,
              35 + FIELD_REPAIR_LIMITS.rudderRestoreRatePerSecond,
            );
            assert.equal(oneSecond.engineTemperatureC, 76);

            const capped = applyFieldRepairStep({
              active: true,
              deltaSeconds: 120,
              hullHealth: 25,
              engineHealth: 10,
              rudderHealth: 10,
              engineTemperatureC: 120,
              engineConditionRestoredThisRun: 0,
              rudderConditionRestoredThisRun: 0,
            });
            assert.equal(capped.hullHealth, 25);
            assert.equal(capped.engineHealth, 22);
            assert.equal(capped.rudderHealth, 28);
            assert.equal(
              capped.engineConditionRestored,
              FIELD_REPAIR_LIMITS.maximumEngineRestorePerRun,
            );
            assert.equal(
              capped.rudderConditionRestored,
              FIELD_REPAIR_LIMITS.maximumRudderRestorePerRun,
            );

            const ceiling = applyFieldRepairStep({
              active: true,
              deltaSeconds: 120,
              hullHealth: 90,
              engineHealth: 54,
              rudderHealth: 64.5,
              engineTemperatureC: 20,
              engineConditionRestoredThisRun: 0,
              rudderConditionRestoredThisRun: 0,
            });
            assert.equal(
              ceiling.engineHealth,
              FIELD_REPAIR_LIMITS.engineConditionCeiling,
            );
            assert.equal(
              ceiling.rudderHealth,
              FIELD_REPAIR_LIMITS.rudderConditionCeiling,
            );

            assert.equal(
              calculateFieldRepairPenalty({
                repairActiveSeconds: 20,
                repairActivationCount: 1,
                engineConditionRestored: 12,
                rudderConditionRestored: 18,
              }),
              160,
            );

            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const storeSource = await fs.readFile(
              new URL('../store/useSimStore.ts', import.meta.url),
              'utf8',
            );
            const directorSource = await fs.readFile(
              new URL('../components/ScenarioDirector.tsx', import.meta.url),
              'utf8',
            );
            const floodingSource = await fs.readFile(
              new URL('../sim/vessels/FloodingModel.ts', import.meta.url),
              'utf8',
            );
            const overlaySource = await fs.readFile(
              new URL('../components/ScenarioResultOverlay.tsx', import.meta.url),
              'utf8',
            );
            const persistenceSource = await fs.readFile(
              new URL('../components/ExperiencePersistence.tsx', import.meta.url),
              'utf8',
            );

            assert.match(boatSource, /applyFieldRepairStep\(/);
            assert.match(boatSource, /repairActive: activeFieldRepair/);
            assert.doesNotMatch(boatSource, /hullHealth\.current \+ 8\.0 \* dt/);
            assert.doesNotMatch(boatSource, /engineHealth\.current \+ 12\.0 \* dt/);
            assert.doesNotMatch(boatSource, /rudderHealth\.current \+ 15\.0 \* dt/);
            assert.match(
              boatSource,
              /preserveConditionAcrossRecovery/,
              'Boat remounts must rehydrate component condition after recovery.',
            );

            const resetStart = storeSource.indexOf('resetVessel: () =>');
            const resetEnd = storeSource.indexOf('fireInstantRepair:', resetStart);
            const resetBlock = storeSource.slice(resetStart, resetEnd);
            assert.doesNotMatch(
              resetBlock,
              /resetTelemetry\(\)/,
              'Recovery must not restore hull, engine, or rudder condition.',
            );
            assert.match(resetBlock, /floodingRatio: 0/);

            assert.match(
              floodingSource,
              /FIELD_REPAIR_LIMITS\.breachStabilizationPerSecond/,
            );
            assert.match(directorSource, /result\.repairPenaltyPoints/);
            assert.match(directorSource, /repairPenaltyPoints,/);
            assert.match(
              overlaySource,
              /Field repair used/,
              'Mission results must disclose field-repair use.',
            );
            assert.match(persistenceSource, /simFieldRepairSeconds/);

            console.log('Field repair policy contract passed.');
          ''').lstrip()
          write('scripts/field-repair-policy-contract.mjs', field_repair_contract)

          mission_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              MissionRuntimeStatistics,
            } from '../sim/scenarios/MissionRuntimeStatistics.ts';

            const EPSILON = 1e-9;
            const STEP_SECONDS = 1 / 60;

            function approximatelyEqual(actual, expected, message) {
              assert.ok(
                Math.abs(actual - expected) <= EPSILON,
                `${message}: expected ${expected}, received ${actual}`,
              );
            }

            function capture(tracker) {
              return { ...tracker.snapshot };
            }

            const tracker = new MissionRuntimeStatistics(5);
            tracker.advance({
              runId: 1,
              vesselGeneration: 10,
              enabled: true,
              deltaSeconds: 0,
              boatX: 0,
              boatZ: 0,
              speedKnots: 0,
            });

            for (let step = 1; step <= 60; step += 1) {
              tracker.advance({
                runId: 1,
                vesselGeneration: 10,
                enabled: true,
                deltaSeconds: STEP_SECONDS,
                boatX: step / 60,
                boatZ: 0,
                speedKnots: step === 40 ? 14 : 8,
                repairActive: step <= 30,
                engineConditionRestored: step <= 30 ? 0.01 : 0,
                rudderConditionRestored: step <= 30 ? 0.02 : 0,
              });
            }

            let snapshot = capture(tracker);
            approximatelyEqual(snapshot.elapsedSeconds, 1, 'fixed-step elapsed time');
            approximatelyEqual(snapshot.distanceTravelledM, 1, 'fixed-step distance');
            approximatelyEqual(snapshot.repairActiveSeconds, 0.5, 'repair duration');
            approximatelyEqual(snapshot.engineConditionRestored, 0.3, 'engine restoration');
            approximatelyEqual(snapshot.rudderConditionRestored, 0.6, 'rudder restoration');
            assert.equal(snapshot.repairActivationCount, 1);
            assert.equal(snapshot.maximumSpeedKnots, 14);
            assert.equal(snapshot.fixedStepCount, 60);

            const beforeDisabled = capture(tracker);
            tracker.advance({
              runId: 1,
              vesselGeneration: 10,
              enabled: false,
              deltaSeconds: 4,
              boatX: 25,
              boatZ: -12,
              speedKnots: 40,
              repairActive: true,
              engineConditionRestored: 5,
            });
            snapshot = capture(tracker);
            assert.deepEqual(
              snapshot,
              beforeDisabled,
              'Disabled/menu/free-navigation frames must not alter scored statistics.',
            );

            tracker.advance({
              runId: 1,
              vesselGeneration: 10,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: 25 + 1 / 60,
              boatZ: -12,
              speedKnots: 7,
            });
            snapshot = capture(tracker);
            approximatelyEqual(
              snapshot.distanceTravelledM,
              beforeDisabled.distanceTravelledM + 1 / 60,
              'disabled interval must reanchor distance',
            );

            const beforeRecovery = capture(tracker);
            tracker.advance({
              runId: 1,
              vesselGeneration: 11,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: -120,
              boatZ: 80,
              speedKnots: 6,
              repairActive: true,
              engineConditionRestored: 0.01,
            });
            snapshot = capture(tracker);
            approximatelyEqual(
              snapshot.distanceTravelledM,
              beforeRecovery.distanceTravelledM,
              'vessel recovery teleport must not add distance',
            );
            approximatelyEqual(
              snapshot.elapsedSeconds,
              beforeRecovery.elapsedSeconds + STEP_SECONDS,
              'vessel recovery must not reset mission time',
            );
            assert.equal(
              snapshot.repairActivationCount,
              beforeRecovery.repairActivationCount + 1,
              'Recovery starts a new repair activation without resetting usage.',
            );

            tracker.advance({
              runId: 2,
              vesselGeneration: 12,
              enabled: true,
              deltaSeconds: STEP_SECONDS,
              boatX: 0,
              boatZ: 0,
              speedKnots: 5,
            });
            snapshot = capture(tracker);
            assert.equal(snapshot.runId, 2);
            approximatelyEqual(snapshot.elapsedSeconds, STEP_SECONDS, 'new-run elapsed time');
            assert.equal(snapshot.repairActiveSeconds, 0);
            assert.equal(snapshot.repairActivationCount, 0);
            assert.equal(snapshot.engineConditionRestored, 0);
            assert.equal(snapshot.rudderConditionRestored, 0);

            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const directorSource = await fs.readFile(
              new URL('../components/ScenarioDirector.tsx', import.meta.url),
              'utf8',
            );

            assert.match(boatSource, /sharedMissionRuntimeStatistics\.advance\(\{/);
            assert.match(boatSource, /engineConditionRestored:/);
            assert.match(directorSource, /sharedMissionRuntimeStatistics\.snapshot/);
            assert.doesNotMatch(directorSource, /statistics\.elapsedSeconds \+= frameDelta/);

            console.log('Mission runtime statistics contract passed.');
          ''').lstrip()
          write('scripts/mission-runtime-statistics-contract.mjs', mission_contract)

          # Flooding stabilization remains available but is no longer an instant seal.
          replace_once(
              'sim/vessels/FloodingModel.ts',
              "} from '@/sim/vessels/VesselConfig';\n",
              "} from '@/sim/vessels/VesselConfig';\nimport { FIELD_REPAIR_LIMITS } from '@/sim/vessels/FieldRepairPolicy';\n",
          )
          replace_once(
              'sim/vessels/FloodingModel.ts',
              '          state.breachSeverity - 0.055 * dt,\n',
              '          state.breachSeverity -\n            FIELD_REPAIR_LIMITS.breachStabilizationPerSecond * dt,\n',
          )

          # Boat runtime: shared eligibility, capped restoration, repair telemetry,
          # deterministic test seed, and condition persistence across recovery.
          replace_once(
              'components/Boat.tsx',
              "} from '@/sim/vessels/VesselDamagePolicy';\n",
              "} from '@/sim/vessels/VesselDamagePolicy';\nimport {\n  applyFieldRepairStep,\n  calculateFieldRepairPenalty,\n  isFieldRepairEligible,\n} from '@/sim/vessels/FieldRepairPolicy';\n",
          )
          replace_once(
              'components/Boat.tsx',
              '  const collisionTestEnabled = useRef(false);\n',
              '  const collisionTestEnabled = useRef(false);\n  const repairTestEnabled = useRef(false);\n',
          )
          replace_once(
              'components/Boat.tsx',
              "  // Phase 1: Health tracking refs\n  const hullHealth = useRef(100);\n  const engineHealth = useRef(100);\n  const engineTemperature = useRef(20);\n  const rudderHealth = useRef(100);\n",
