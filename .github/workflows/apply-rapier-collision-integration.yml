name: Apply Rapier collision integration

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - scripts/apply-rapier-collision-integration.mjs
      - .github/workflows/apply-rapier-collision-integration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rapier-collision-integration
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  integrate:
    name: Integrate, lock, validate, and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Rapier integration
        run: node scripts/apply-rapier-collision-integration.mjs

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove one-time integration tooling
        run: |
          rm -f scripts/apply-rapier-collision-integration.mjs
          rm -f .github/workflows/apply-rapier-collision-integration.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated collision integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Rapier collision changes to commit."
            exit 0
          fi
          git commit -m "physics: integrate Rapier hull contacts"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
