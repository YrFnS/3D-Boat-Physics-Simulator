name: Apply WebGL recovery readiness

on:
  push:
    branches:
      - agent/simulator-stabilization

permissions:
  contents: write

concurrency:
  group: webgl-recovery-readiness
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Make WebGL monitor readiness observable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:120]!r}'
                  )
              target.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'components/SimulatorRecovery.tsx',
              "    canvas.addEventListener('webglcontextlost', handleLost);\n    canvas.addEventListener('webglcontextrestored', handleRestored);\n\n    return () => {\n      canvas.removeEventListener('webglcontextlost', handleLost);\n      canvas.removeEventListener('webglcontextrestored', handleRestored);\n    };\n",
              "    canvas.addEventListener('webglcontextlost', handleLost);\n    canvas.addEventListener('webglcontextrestored', handleRestored);\n    document.documentElement.dataset.simWebglContextMonitorReady = '1';\n\n    return () => {\n      canvas.removeEventListener('webglcontextlost', handleLost);\n      canvas.removeEventListener('webglcontextrestored', handleRestored);\n      delete document.documentElement.dataset.simWebglContextMonitorReady;\n    };\n",
          )

          replace_once(
              'scripts/release-validation.mjs',
              "      await page.waitForSelector('canvas', { timeout: 60_000 });\n      await waitForCanvasReady(page);\n      await page.evaluate(() => {\n        const canvas = document.querySelector('canvas');\n        canvas?.dispatchEvent(\n",
              "      await page.waitForSelector('canvas', { timeout: 60_000 });\n      await waitForCanvasReady(page);\n      await waitForDataset(page, 'simWebglContextMonitorReady', '1');\n      await page.evaluate(() => {\n        const canvas = document.querySelector('canvas');\n        canvas?.dispatchEvent(\n",
          )

          contract = Path('scripts/runtime-authority-contract.mjs')
          source = contract.read_text(encoding='utf-8')
          source = source.replace(
              "import assert from 'node:assert/strict';\n",
              "import assert from 'node:assert/strict';\nimport fs from 'node:fs/promises';\n",
              1,
          )
          marker = "console.log('Runtime authority contract passed.');\n"
          insertion = """const recoveryMonitorSource = await fs.readFile(\n  new URL('../components/SimulatorRecovery.tsx', import.meta.url),\n  'utf8',\n);\nconst releaseValidationSource = await fs.readFile(\n  new URL('./release-validation.mjs', import.meta.url),\n  'utf8',\n);\nassert.match(\n  recoveryMonitorSource,\n  /simWebglContextMonitorReady = '1'/,\n  'The application must expose when its WebGL recovery listener is attached.',\n);\nassert.match(\n  releaseValidationSource,\n  /waitForDataset\\(page, 'simWebglContextMonitorReady', '1'\\)/,\n  'Release validation must wait for the recovery listener before dispatching context loss.',\n);\n\nconsole.log('Runtime authority contract passed.');\n"""
          if source.count(marker) != 1:
              raise SystemExit('runtime-authority-contract.mjs: completion marker not unique')
          contract.write_text(source.replace(marker, insertion, 1), encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source graph
        run: npm run validate

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-webgl-recovery-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: synchronize WebGL recovery probe"
          git push origin HEAD:agent/simulator-stabilization
