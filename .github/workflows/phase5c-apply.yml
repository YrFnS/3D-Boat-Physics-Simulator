name: Apply Phase 5C propulsion and maneuvering

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5c-apply.yml'
  push:
    branches:
      - agent/phase-5c-propulsion-maneuvering
    paths:
      - '.github/workflows/phase5c-apply.yml'

permissions:
  contents: write

concurrency:
  group: phase5c-apply-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5c-propulsion-maneuvering'
    name: Verify, apply, validate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Phase 5C branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5c-propulsion-maneuvering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and verify patch
        run: |
          cat scripts/.phase5c-patch/part-* > "$RUNNER_TEMP/phase5c.patch.gz.b64"
          echo '1e64be5b31d4ad5219454667d60ed69759249269ca4587155ecb81e81da56613  '"$RUNNER_TEMP/phase5c.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/phase5c.patch.gz.b64" > "$RUNNER_TEMP/phase5c.patch.gz"
          echo '951373067c1553fe534cbe9b0178929e37f2ddd9085440799641c568e073906c  '"$RUNNER_TEMP/phase5c.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5c.patch.gz" > "$RUNNER_TEMP/phase5c.patch"
          echo 'a6e6d3dae640bc8be558fc46faac8fa879451a07c8ff05a39cd2a267f0452754  '"$RUNNER_TEMP/phase5c.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/phase5c.patch"
          git apply "$RUNNER_TEMP/phase5c.patch"

      - name: Remove one-use transfer tooling
        run: |
          rm -rf scripts/.phase5c-patch
          rm -f .github/workflows/phase5c-apply.yml
          rm -f .github/workflows/phase5c-source-snapshot.yml

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic physics correctness
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 5C: power-limited propulsion and local-flow steering'
          git push origin HEAD:agent/phase-5c-propulsion-maneuvering
