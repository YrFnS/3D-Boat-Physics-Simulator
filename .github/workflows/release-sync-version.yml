name: Synchronize v1.0.0 lockfile metadata

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release-sync-version.yml'
      - 'package.json'
  push:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/release-sync-version.yml'

permissions:
  contents: write

concurrency:
  group: release-sync-version-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-4-release-validation')
    name: Update lockfile and remove one-use workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-release-validation
          fetch-depth: 0

      - name: Synchronize package-lock version
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('package-lock.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = '1.0.0'
          data['packages']['']['version'] = '1.0.0'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          grep -q '"version": "1.0.0"' package.json
          test "$(grep -c '"version": "1.0.0"' package-lock.json)" -ge 2
          git diff --check

      - name: Remove this one-use workflow
        run: rm -f .github/workflows/release-sync-version.yml

      - name: Verify committed dependency graph
        run: npm ci

      - name: Commit synchronized release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/release-sync-version.yml
          git commit -m 'release: synchronize v1.0.0 lockfile'
          git push origin HEAD:agent/phase-4-release-validation
