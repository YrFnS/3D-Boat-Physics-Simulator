name: Validate Phase 5D collision robustness

on:
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-robustness.yml'
      - 'scripts/.phase5d-robustness.patch.b64'
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-robustness.yml'
      - 'scripts/.phase5d-robustness.patch.b64'

permissions:
  contents: write

concurrency:
  group: phase5d-robustness-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority')
    name: Apply, validate, clean, and publish robustness coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply verified robustness patch
        run: |
          base64 --decode scripts/.phase5d-robustness.patch.b64 > "$RUNNER_TEMP/phase5d-robustness.patch.gz"
          echo '4a6fbb38efa087c3142d2185505f63dae8f37e62bcce29a9d206273662fd9438  '"$RUNNER_TEMP/phase5d-robustness.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5d-robustness.patch.gz" > "$RUNNER_TEMP/phase5d-robustness.patch"
          echo 'bd24f30020d4ea314d011f9e41a0690ca84a5b35728a5622a6f569fc8bfc6865  '"$RUNNER_TEMP/phase5d-robustness.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/phase5d-robustness.patch"
          git apply "$RUNNER_TEMP/phase5d-robustness.patch"
          git diff --check

      - name: Remove all one-use Phase 5D tooling
        run: |
          rm -rf scripts/.phase5d-patch
          rm -rf scripts/.phase5d-finalize-patch
          rm -rf scripts/.phase5d-refinement
          rm -f scripts/.phase5d-implementation.patch.b64
          rm -f scripts/.phase5d-robustness.patch.b64
          rm -f .github/workflows/phase5d-apply.yml
          rm -f .github/workflows/phase5d-current-snapshot.yml
          rm -f .github/workflows/phase5d-finalize.yml
          rm -f .github/workflows/phase5d-inspect-staged-patch.yml
          rm -f .github/workflows/phase5d-review-snapshot.yml
          rm -f .github/workflows/phase5d-publish-refinement.yml
          rm -f .github/workflows/phase5d-source-snapshot.yml
          rm -f .github/workflows/phase5d-robustness.yml

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic physics and collision regressions
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Reject dependency advisories
        run: npm run audit

      - name: Verify collision-authority source invariants
        run: |
          git diff --check
          ! grep -R "applyPositionCorrection\|setNextKinematic\|kinematicPositionBased\|remainingNormalImpulseNs" sim components scripts/physics-correctness.mjs scripts/collision-authority.mjs
          grep -q "RigidBodyDesc.dynamic" sim/collision/RapierCollisionWorld.ts
          grep -q "applyExternalSolverState" sim/collision/RapierCollisionWorld.ts
          grep -q "integrateVelocities(dt" components/Boat.tsx
          grep -q "contact-order invariance" scripts/collision-authority.mjs

      - name: Commit and push validated robustness work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: harden Phase 5D collision authority'
          git push origin HEAD:agent/phase-5d-collision-authority
