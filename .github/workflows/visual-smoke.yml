name: Visual smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'store/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'scripts/visual-smoke.mjs'
      - '.github/workflows/visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  browser-smoke:
    name: Desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright without changing the lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare standalone server
        run: |
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start production server
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/boat-server.log 2>&1 &
          echo $! > /tmp/boat-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/boat-server.log
          exit 1

      - name: Capture desktop and mobile smoke results
        id: smoke
        continue-on-error: true
        run: node scripts/visual-smoke.mjs

      - name: Collect server log
        if: always()
        run: |
          mkdir -p artifacts/visual-smoke
          cp /tmp/boat-server.log artifacts/visual-smoke/server.log || true

      - name: Upload visual smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-smoke
          path: artifacts/visual-smoke
          if-no-files-found: error
          retention-days: 7

      - name: Enforce smoke result
        if: steps.smoke.outcome != 'success'
        run: exit 1
