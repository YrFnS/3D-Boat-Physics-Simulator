name: Apply Phase 1 boat performance pass

on:
  push:
    branches:
      - agent/phase-1-performance-foundation
    paths:
      - scripts/apply-phase1-boat-pass.mjs
      - .github/workflows/apply-phase1-boat-pass.yml

permissions:
  contents: write

concurrency:
  group: phase-1-boat-performance-pass
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded refactor
        run: node scripts/apply-phase1-boat-pass.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Boat.tsx components/Ocean.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "perf: optimize boat frame loop"
          git push origin "HEAD:${GITHUB_REF_NAME}"
