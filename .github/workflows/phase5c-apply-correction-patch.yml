name: Apply verified Phase 5C dynamics correction

on:
  push:
    branches:
      - agent/phase-5c-propulsion-maneuvering
    paths:
      - '.github/workflows/phase5c-apply-correction-patch.yml'

permissions:
  contents: write

concurrency:
  group: phase5c-verified-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    name: Apply, validate, and publish verified correction
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 5C branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5c-propulsion-maneuvering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply verified correction
        run: |
          echo 'bb77572cd73a007806d4624d0b07ffa627865df294c4ecbdc1024ca18b8386a0  scripts/.phase5c-correction-patch.b64' | sha256sum --check
          base64 --decode scripts/.phase5c-correction-patch.b64 > "$RUNNER_TEMP/phase5c-correction.patch.gz"
          echo '08df03e2f0f216d4168af02a419364a19666167689c9bbe16d68ffe46ddb90fd  '"$RUNNER_TEMP/phase5c-correction.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5c-correction.patch.gz" > "$RUNNER_TEMP/phase5c-correction.patch"
          echo 'bdd44ad1bbf4260456094a06fac5d1498c2357409e05eec33af0c5d68adff800  '"$RUNNER_TEMP/phase5c-correction.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/phase5c-correction.patch"
          git apply "$RUNNER_TEMP/phase5c-correction.patch"

      - name: Remove temporary diagnostics and correction tooling
        run: |
          rm -f PHASE5C_PROPULSION_DIAGNOSTICS.json
          rm -f scripts/phase5c-propulsion-diagnostics.mjs
          rm -f scripts/.phase5c-correction-patch.b64
          rm -f .github/workflows/phase5c-propulsion-diagnostics.yml
          rm -f .github/workflows/phase5c-correct-dynamics.yml
          rm -f .github/workflows/phase5c-apply-correction-patch.yml

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic physics correctness
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push validated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct Phase 5C immersion and rudder dynamics'
          git push origin HEAD:agent/phase-5c-propulsion-maneuvering
