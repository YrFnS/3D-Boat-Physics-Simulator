name: Apply physics smoke diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-physics-diagnostics.mjs
      - .github/workflows/apply-physics-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-physics-smoke-diagnostics
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Transform, validate, and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add debug physics bridge
        run: node scripts/apply-physics-diagnostics.mjs

      - name: Validate repository
        run: npm run validate

      - name: Remove one-time migration tooling
        run: |
          rm -f scripts/apply-physics-diagnostics.mjs
          rm -f .github/workflows/apply-physics-diagnostics.yml

      - name: Commit validated diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No physics diagnostic changes to commit."
            exit 0
          fi
          git commit -m "test: expose authoritative vessel state to browser smoke"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
