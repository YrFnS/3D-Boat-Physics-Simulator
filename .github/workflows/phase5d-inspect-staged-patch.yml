name: Inspect staged Phase 5D patch

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-inspect-staged-patch.yml'
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-inspect-staged-patch.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority'
    name: Decode staged Phase 5D patch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority

      - name: Decode staged patch
        run: |
          cat scripts/.phase5d-patch/part-* > "$RUNNER_TEMP/phase5d.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/phase5d.patch.gz.b64" > "$RUNNER_TEMP/phase5d.patch.gz"
          gzip -dc "$RUNNER_TEMP/phase5d.patch.gz" > "$RUNNER_TEMP/phase5d.patch"
          git apply --stat "$RUNNER_TEMP/phase5d.patch" | tee "$RUNNER_TEMP/phase5d.patch.stat"

      - name: Upload decoded patch
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-staged-patch
          path: |
            ${{ runner.temp }}/phase5d.patch
            ${{ runner.temp }}/phase5d.patch.stat
          retention-days: 1
