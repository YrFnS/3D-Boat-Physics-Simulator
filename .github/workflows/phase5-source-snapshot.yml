name: Phase 5 source snapshot

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation

permissions:
  contents: read

jobs:
  snapshot:
    name: Package exact branch source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/phase5-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5-source-snapshot
          path: ${{ runner.temp }}/phase5-source.tar.gz
          include-hidden-files: true
          retention-days: 1
