name: Diagnose Phase 5 patch transfer

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation

permissions:
  contents: read

concurrency:
  group: phase5-diagnose-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/phase-5-physics-correctness'
    name: Reconstruct and export transferred patch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-physics-correctness

      - name: Reconstruct transferred data
        run: |
          cat scripts/.phase5-patch/part-* > "$RUNNER_TEMP/phase5-remote.b64"
          base64 --decode "$RUNNER_TEMP/phase5-remote.b64" > "$RUNNER_TEMP/phase5-remote.patch"
          echo 'Transferred base64:'
          sha256sum "$RUNNER_TEMP/phase5-remote.b64"
          echo 'Decoded patch:'
          sha256sum "$RUNNER_TEMP/phase5-remote.patch"
          wc -c "$RUNNER_TEMP/phase5-remote.b64" "$RUNNER_TEMP/phase5-remote.patch"

      - name: Upload reconstructed transfer
        uses: actions/upload-artifact@v4
        with:
          name: phase5-patch-diagnostic
          path: |
            ${{ runner.temp }}/phase5-remote.b64
            ${{ runner.temp }}/phase5-remote.patch
          retention-days: 1
