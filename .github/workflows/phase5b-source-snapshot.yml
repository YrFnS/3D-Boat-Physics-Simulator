name: Phase 5B source snapshot

on:
  push:
    branches:
      - agent/phase-5b-water-hydrostatics
    paths:
      - '.github/workflows/phase5b-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    name: Package exact Phase 5B source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5b-water-hydrostatics

      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/phase5b-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-source-snapshot
          path: ${{ runner.temp }}/phase5b-source.tar.gz
          include-hidden-files: true
          retention-days: 1
