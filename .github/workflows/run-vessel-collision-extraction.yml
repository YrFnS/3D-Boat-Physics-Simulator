name: Run vessel collision extraction

on:
  pull_request:
    paths:
      - .github/workflows/run-vessel-collision-extraction.yml

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  extract:
    if: github.head_ref == 'agent/simulator-stabilization'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Execute staged extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/extract-vessel-collision-runtime.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Set up Node.js"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          staged_script = dedent(source[start:end])
          exec(compile(staged_script, '<collision-extraction>', 'exec'))
          PY

      - name: Stabilize collision runtime effect ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/Boat.tsx')
          source = path.read_text(encoding='utf-8')

          old_effect_start = """  useEffect(() => {
            let cancelled = false;
            const searchParams = new URLSearchParams(window.location.search);
          """
          new_effect_start = """  useEffect(() => {
            let cancelled = false;
            const activeCollisionRuntime = collisionRuntime.current;
            const searchParams = new URLSearchParams(window.location.search);
          """
          if source.count(old_effect_start) != 1:
              raise SystemExit('Unable to locate collision initialization effect.')
          source = source.replace(old_effect_start, new_effect_start, 1)

          replacements = (
              (
                  '    collisionRuntime.current.reset(sharedPhysics);',
                  '    activeCollisionRuntime.reset(sharedPhysics);',
              ),
              (
                  '        collisionRuntime.current.setReady(sharedPhysics, true);',
                  '        activeCollisionRuntime.setReady(sharedPhysics, true);',
              ),
              (
                  '      collisionRuntime.current.setReady(sharedPhysics, false);',
                  '      activeCollisionRuntime.setReady(sharedPhysics, false);',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Unable to locate ownership target: {old}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extracted architecture
        run: npm run validate

      - name: Commit validated extraction
        shell: bash
        run: |
          rm -f \
            .github/workflows/extract-vessel-collision-runtime.yml \
            .github/workflows/run-vessel-collision-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: extract vessel collision runtime"
          git push origin HEAD:agent/simulator-stabilization
