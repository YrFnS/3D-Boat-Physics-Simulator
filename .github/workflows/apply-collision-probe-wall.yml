name: Apply robust collision probe

on:
  push:
    branches:
      - agent/phase-2-fixed-timestep-physics
    paths:
      - scripts/apply-collision-probe-wall.mjs
      - .github/workflows/apply-collision-probe-wall.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-collision-probe-wall
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Transform, validate, and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-fixed-timestep-physics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply collision probe wall
        run: node scripts/apply-collision-probe-wall.mjs

      - name: Remove one-time tooling
        run: |
          rm -f scripts/apply-collision-probe-wall.mjs
          rm -f .github/workflows/apply-collision-probe-wall.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Commit validated probe fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No collision probe changes to commit."
            exit 0
          fi
          git commit -m "test: make Rapier collision probe drift tolerant"
          git push origin "HEAD:agent/phase-2-fixed-timestep-physics"
