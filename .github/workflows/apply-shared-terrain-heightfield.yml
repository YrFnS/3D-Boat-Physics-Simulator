name: Apply shared terrain heightfield

on:
  pull_request:
    paths:
      - .github/workflows/apply-shared-terrain-heightfield.yml

permissions:
  contents: write

concurrency:
  group: shared-terrain-heightfield
  cancel-in-progress: false

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/simulator-stabilization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Apply canonical terrain authority
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/YrFnS/3D-Boat-Physics-Simulator/contents/.github/workflows/apply-shared-terrain-heightfield.yml?ref=fc61d0d801d57b5d320d0593450e4cf71a44852e" \
            --output /tmp/original-terrain-migration.yml
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('/tmp/original-terrain-migration.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/apply_shared_terrain.py').write_text(
              dedent(source[start:end]),
              encoding='utf-8',
          )
          PY
          python /tmp/apply_shared_terrain.py

          python - <<'PY'
          from pathlib import Path

          path = Path('components/Ocean.tsx')
          source = path.read_text(encoding='utf-8')
          old_import = (
              "import { getSharedTerrainHeightfield } "
              "from '@/sim/terrain/TerrainHeightfield';\n"
          )
          new_import = (
              "import {\n"
              "  getSharedTerrainHeightfield,\n"
              "  sampleTerrainHeightfield,\n"
              "} from '@/sim/terrain/TerrainHeightfield';\n"
          )
          if source.count(old_import) != 1:
              raise SystemExit(
                  f'Expected one migrated Ocean terrain import, found '
                  f'{source.count(old_import)}.'
              )
          source = source.replace(old_import, new_import, 1)
          source = source.replace(
              'getTerrainHeight(',
              'sampleTerrainHeightfield(',
          )
          if 'getTerrainHeight' in source:
              raise SystemExit(
                  'Ocean.tsx still contains direct procedural terrain reads.'
              )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate shared terrain contract
        run: npm run test:terrain-heightfield

      - name: Validate complete repository
        run: npm run validate

      - name: Commit validated terrain authority
        shell: bash
        run: |
          rm .github/workflows/apply-shared-terrain-heightfield.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: unify terrain rendering and collision"
          git push origin HEAD:agent/simulator-stabilization
