name: Extract vessel collision runtime

on:
  push:
    branches:
      - agent/simulator-stabilization
    paths:
      - .github/workflows/extract-vessel-collision-runtime.yml

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v7
        with:
          ref: agent/simulator-stabilization
          fetch-depth: 0

      - name: Extract collision response authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one target, found {count}: {old[:180]!r}'
                  )
              write(path, source.replace(old, new, 1))

          def replace_section(
              path: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              source = read(path)
              if source.count(start_marker) != 1:
                  raise SystemExit(
                      f'{path}: expected one start marker: {start_marker!r}'
                  )
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              write(path, source[:start] + replacement + source[end:])

          collision_runtime = dedent(r'''
            import type { RapierContactSummary } from './RapierCollisionWorld.ts';
            import type { VesselConfig } from '../vessels/VesselConfig.ts';
            import type { VesselDamageEvent } from '../vessels/VesselDamagePolicy.ts';

            export type VesselImpactKind = 'terrain' | 'obstacle';

            export interface VesselCollisionTelemetryTarget {
              collisionReady: number;
              collisionSequence: number;
              terrainCollisionSequence: number;
              obstacleCollisionSequence: number;
              debugProbeCollisionSequence: number;
              collisionMaxImpactSpeed: number;
              collisionMaxImpulse: number;
              collisionMaxPenetration: number;
            }

            export interface VesselCollisionConditionSink {
              applyDamage(event: VesselDamageEvent): unknown;
            }

            export interface VesselCollisionFloodingSink {
              registerBreach(
                vessel: VesselConfig,
                compartmentId: string,
                severity: number,
              ): void;
            }

            export interface VesselCollisionAudioSink {
              playImpact(severity: number, kind: VesselImpactKind): void;
            }

            export interface VesselCollisionRandomSource {
              next(): number;
            }

            export interface VesselCollisionRuntimeStep {
              summary: RapierContactSummary;
              scenarioRunId: number;
              vesselGeneration: number;
              simulationTimeSeconds: number;
              effectiveMassKg: number;
              forwardWaterRelativeSpeedMps: number;
              vessel: VesselConfig;
              condition: VesselCollisionConditionSink;
              flooding: VesselCollisionFloodingSink;
              telemetry: VesselCollisionTelemetryTarget;
              random: VesselCollisionRandomSource;
              audio: VesselCollisionAudioSink;
            }

            export interface AppliedCollisionImpact {
              kind: VesselImpactKind;
              speedMps: number;
              damage: number;
              compartmentId: string;
              breachSeverity: number;
            }

            export interface VesselCollisionRuntimeResult {
              terrainImpact: AppliedCollisionImpact | null;
              obstacleImpact: AppliedCollisionImpact | null;
            }

            export const VESSEL_COLLISION_RESPONSE_POLICY = Object.freeze({
              terrainImpactThresholdMps: 1.8,
              terrainImpactCooldownSeconds: 0.25,
              terrainMaximumDamage: 24,
              obstacleImpactThresholdMps: 0.65,
              obstacleImpactCooldownSeconds: 0.2,
              obstacleMaximumDamage: 28,
            });

            function finiteNonNegative(value: number) {
              return Number.isFinite(value) ? Math.max(0, value) : 0;
            }

            function finiteCount(value: number) {
              return Math.floor(finiteNonNegative(value));
            }

            function normalizeIdentity(value: number) {
              return Number.isFinite(value) ? Math.trunc(value) : -1;
            }

            function clamp(value: number, minimum: number, maximum: number) {
              if (!Number.isFinite(value)) return minimum;
              return Math.max(minimum, Math.min(maximum, value));
            }

            function normalizedMass(value: number, fallback: number) {
              if (Number.isFinite(value) && value > 0) return value;
              if (Number.isFinite(fallback) && fallback > 0) return fallback;
              return 1;
            }

            function chooseObstacleCompartment(
              vessel: VesselConfig,
              headOnFactor: number,
              random: VesselCollisionRandomSource,
            ) {
              if (headOnFactor > 0.45) return 'bow';
              const randomValue = clamp(random.next(), 0, 1);
              if (vessel.type === 'trawler') {
                return randomValue < 0.5 ? 'port' : 'starboard';
              }
              return randomValue < 0.5
                ? 'cockpit-port'
                : 'cockpit-starboard';
            }

            /**
             * Owns all post-Rapier collision effects for one mounted vessel.
             *
             * Rapier remains the authoritative contact solver. This runtime turns
             * its summary into stable gameplay counters, diagnostic maxima,
             * cooldown-gated condition damage, breach selection, and impact audio.
             */
            export class VesselCollisionRuntime {
              private lastTerrainImpactTime = Number.NEGATIVE_INFINITY;
              private lastObstacleImpactTime = Number.NEGATIVE_INFINITY;
              private scenarioRunId = -1;
              private vesselGeneration = -1;

              reset(telemetry?: VesselCollisionTelemetryTarget) {
                this.scenarioRunId = -1;
                this.vesselGeneration = -1;
                this.resetImpactCooldowns();
                if (telemetry) {
                  telemetry.collisionReady = 0;
                  telemetry.collisionSequence = 0;
                  telemetry.terrainCollisionSequence = 0;
                  telemetry.obstacleCollisionSequence = 0;
                  telemetry.debugProbeCollisionSequence = 0;
                  telemetry.collisionMaxImpactSpeed = 0;
                  telemetry.collisionMaxImpulse = 0;
                  telemetry.collisionMaxPenetration = 0;
                }
              }

              setReady(
                telemetry: VesselCollisionTelemetryTarget,
                ready: boolean,
              ) {
                telemetry.collisionReady = ready ? 1 : 0;
              }

              process(
                input: VesselCollisionRuntimeStep,
              ): VesselCollisionRuntimeResult {
                const simulationTimeSeconds = Number.isFinite(
                  input.simulationTimeSeconds,
                )
                  ? input.simulationTimeSeconds
                  : 0;
                this.synchronizeIdentity(
                  input.scenarioRunId,
                  input.vesselGeneration,
                  simulationTimeSeconds,
                );
                this.publishTelemetry(input.summary, input.telemetry);

                const massKg = normalizedMass(
                  input.effectiveMassKg,
                  input.vessel.massKg,
                );
                const terrainImpact = this.applyTerrainImpact(
                  input,
                  massKg,
                  simulationTimeSeconds,
                );
                const obstacleImpact = this.applyObstacleImpact(
                  input,
                  massKg,
                  simulationTimeSeconds,
                );

                return { terrainImpact, obstacleImpact };
              }

              private synchronizeIdentity(
                scenarioRunId: number,
                vesselGeneration: number,
                simulationTimeSeconds: number,
              ) {
                const normalizedRunId = normalizeIdentity(scenarioRunId);
                const normalizedGeneration = normalizeIdentity(
                  vesselGeneration,
                );
                const identityChanged =
                  this.scenarioRunId !== normalizedRunId ||
                  this.vesselGeneration !== normalizedGeneration;
                const clockMovedBackward =
                  simulationTimeSeconds < this.lastTerrainImpactTime ||
                  simulationTimeSeconds < this.lastObstacleImpactTime;

                if (identityChanged || clockMovedBackward) {
                  this.scenarioRunId = normalizedRunId;
                  this.vesselGeneration = normalizedGeneration;
                  this.resetImpactCooldowns();
                }
              }

              private resetImpactCooldowns() {
                this.lastTerrainImpactTime = Number.NEGATIVE_INFINITY;
                this.lastObstacleImpactTime = Number.NEGATIVE_INFINITY;
              }

              private publishTelemetry(
                summary: RapierContactSummary,
                telemetry: VesselCollisionTelemetryTarget,
              ) {
                this.setReady(telemetry, true);
                telemetry.collisionMaxImpactSpeed = Math.max(
                  finiteNonNegative(telemetry.collisionMaxImpactSpeed),
                  finiteNonNegative(summary.maxTerrainImpactSpeedMps),
                  finiteNonNegative(summary.maxObstacleImpactSpeedMps),
                );
                telemetry.collisionMaxImpulse = Math.max(
                  finiteNonNegative(telemetry.collisionMaxImpulse),
                  finiteNonNegative(summary.maxTerrainImpulseNs),
                  finiteNonNegative(summary.maxObstacleImpulseNs),
                );
                telemetry.collisionMaxPenetration = Math.max(
                  finiteNonNegative(telemetry.collisionMaxPenetration),
                  finiteNonNegative(summary.maxPenetrationM),
                );
                telemetry.collisionSequence =
                  finiteCount(telemetry.collisionSequence) +
                  finiteCount(summary.contactStartCount);
                telemetry.terrainCollisionSequence =
                  finiteCount(telemetry.terrainCollisionSequence) +
                  finiteCount(summary.terrainContactStartCount);
                telemetry.obstacleCollisionSequence =
                  finiteCount(telemetry.obstacleCollisionSequence) +
                  finiteCount(summary.obstacleContactStartCount);
                telemetry.debugProbeCollisionSequence =
                  finiteCount(telemetry.debugProbeCollisionSequence) +
                  finiteCount(summary.debugProbeContactStartCount);
              }

              private applyTerrainImpact(
                input: VesselCollisionRuntimeStep,
                massKg: number,
                simulationTimeSeconds: number,
              ): AppliedCollisionImpact | null {
                const speedMps = finiteNonNegative(
                  input.summary.maxTerrainImpactSpeedMps,
                );
                if (
                  speedMps <=
                    VESSEL_COLLISION_RESPONSE_POLICY.terrainImpactThresholdMps ||
                  simulationTimeSeconds - this.lastTerrainImpactTime <
                    VESSEL_COLLISION_RESPONSE_POLICY.terrainImpactCooldownSeconds
                ) {
                  return null;
                }

                this.lastTerrainImpactTime = simulationTimeSeconds;
                const normalizedImpulse =
                  finiteNonNegative(input.summary.maxTerrainImpulseNs) /
                  massKg;
                const severity =
                  speedMps -
                  VESSEL_COLLISION_RESPONSE_POLICY.terrainImpactThresholdMps;
                const damage = Math.min(
                  VESSEL_COLLISION_RESPONSE_POLICY.terrainMaximumDamage,
                  severity * 3.6 + normalizedImpulse * 0.42,
                );
                input.condition.applyDamage({
                  source: 'terrain-impact',
                  hullDamage: damage,
                  engineDamage: severity > 2.5 ? damage * 0.22 : 0,
                  rudderDamage: severity > 2.5 ? damage * 0.32 : 0,
                });

                const compartmentId =
                  input.forwardWaterRelativeSpeedMps >= 0
                    ? 'bow'
                    : input.vessel.type === 'trawler'
                      ? 'machinery'
                      : 'engine';
                const breachSeverity = clamp(damage / 180, 0, 0.2);
                input.flooding.registerBreach(
                  input.vessel,
                  compartmentId,
                  breachSeverity,
                );
                input.audio.playImpact(speedMps, 'terrain');

                return {
                  kind: 'terrain',
                  speedMps,
                  damage,
                  compartmentId,
                  breachSeverity,
                };
              }

              private applyObstacleImpact(
                input: VesselCollisionRuntimeStep,
                massKg: number,
                simulationTimeSeconds: number,
              ): AppliedCollisionImpact | null {
                const speedMps = finiteNonNegative(
                  input.summary.maxObstacleImpactSpeedMps,
                );
                if (
                  speedMps <=
                    VESSEL_COLLISION_RESPONSE_POLICY.obstacleImpactThresholdMps ||
                  simulationTimeSeconds - this.lastObstacleImpactTime <
                    VESSEL_COLLISION_RESPONSE_POLICY.obstacleImpactCooldownSeconds
                ) {
                  return null;
                }

                this.lastObstacleImpactTime = simulationTimeSeconds;
                const normalizedImpulse =
                  finiteNonNegative(input.summary.maxObstacleImpulseNs) /
                  massKg;
                const severity =
                  speedMps -
                  VESSEL_COLLISION_RESPONSE_POLICY.obstacleImpactThresholdMps;
                const headOnFactor = clamp(
                  input.summary.maxObstacleHeadOnFactor,
                  0,
                  1,
                );
                const damage = Math.min(
                  VESSEL_COLLISION_RESPONSE_POLICY.obstacleMaximumDamage,
                  severity * 1.75 + normalizedImpulse * 0.28,
                );
                const glancingFactor = 1 - headOnFactor;
                const glancingRudderStrike =
                  severity > 2.1 &&
                  glancingFactor > 0.3 &&
                  normalizedImpulse > 1;
                input.condition.applyDamage({
                  source: 'obstacle-impact',
                  hullDamage: damage,
                  engineDamage:
                    severity > 4 && headOnFactor > 0.35
                      ? damage * 0.18 * headOnFactor
                      : 0,
                  rudderDamage:
                    severity > 2.5 || glancingRudderStrike
                      ? damage * 0.2 * (1 - headOnFactor * 0.35)
                      : 0,
                });

                const compartmentId = chooseObstacleCompartment(
                  input.vessel,
                  headOnFactor,
                  input.random,
                );
                const breachSeverity = clamp(damage / 200, 0, 0.18);
                input.flooding.registerBreach(
                  input.vessel,
                  compartmentId,
                  breachSeverity,
                );
                input.audio.playImpact(speedMps, 'obstacle');

                return {
                  kind: 'obstacle',
                  speedMps,
                  damage,
                  compartmentId,
                  breachSeverity,
                };
              }
            }
          ''').lstrip()
          write(
              'sim/collision/VesselCollisionRuntime.ts',
              collision_runtime,
          )

          collision_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              VesselCollisionRuntime,
              VESSEL_COLLISION_RESPONSE_POLICY,
            } from '../sim/collision/VesselCollisionRuntime.ts';

            function emptySummary(overrides = {}) {
              return {
                contactCount: 0,
                terrainContactCount: 0,
                obstacleContactCount: 0,
                debugProbeContactCount: 0,
                fixtureContactCount: 0,
                activeContactPairCount: 0,
                activeExternalContactCount: 0,
                contactStartCount: 0,
                terrainContactStartCount: 0,
                obstacleContactStartCount: 0,
                debugProbeContactStartCount: 0,
                fixtureContactStartCount: 0,
                contactEndCount: 0,
                fixtureKind: null,
                maxObstacleHeadOnFactor: 0,
                maxPenetrationM: 0,
                maxTerrainImpactSpeedMps: 0,
                maxObstacleImpactSpeedMps: 0,
                maxTerrainImpulseNs: 0,
                maxObstacleImpulseNs: 0,
                totalPositionCorrectionM: 0,
                ...overrides,
              };
            }

            function telemetry() {
              return {
                collisionReady: 1,
                collisionSequence: 9,
                terrainCollisionSequence: 8,
                obstacleCollisionSequence: 7,
                debugProbeCollisionSequence: 6,
                collisionMaxImpactSpeed: 5,
                collisionMaxImpulse: 4,
                collisionMaxPenetration: 3,
              };
            }

            function effects(randomValues = [0.25]) {
              const damageEvents = [];
              const breaches = [];
              const audioEvents = [];
              let randomIndex = 0;
              return {
                damageEvents,
                breaches,
                audioEvents,
                condition: {
                  applyDamage(event) {
                    damageEvents.push(event);
                  },
                },
                flooding: {
                  registerBreach(vessel, compartmentId, severity) {
                    breaches.push({
                      vesselType: vessel.type,
                      compartmentId,
                      severity,
                    });
                  },
                },
                audio: {
                  playImpact(severity, kind) {
                    audioEvents.push({ severity, kind });
                  },
                },
                random: {
                  next() {
                    const value =
                      randomValues[randomIndex] ??
                      randomValues[randomValues.length - 1] ??
                      0.5;
                    randomIndex += 1;
                    return value;
                  },
                },
              };
            }

            const trawler = { type: 'trawler', massKg: 1_000 };
            const speedboat = { type: 'speedboat', massKg: 1_000 };
            const runtime = new VesselCollisionRuntime();
            const collisionTelemetry = telemetry();
            runtime.reset(collisionTelemetry);
            assert.deepEqual(collisionTelemetry, {
              collisionReady: 0,
              collisionSequence: 0,
              terrainCollisionSequence: 0,
              obstacleCollisionSequence: 0,
              debugProbeCollisionSequence: 0,
              collisionMaxImpactSpeed: 0,
              collisionMaxImpulse: 0,
              collisionMaxPenetration: 0,
            });
            runtime.setReady(collisionTelemetry, true);
            assert.equal(collisionTelemetry.collisionReady, 1);

            const terrainEffects = effects();
            const terrainSummary = emptySummary({
              contactStartCount: 2,
              terrainContactStartCount: 1,
              debugProbeContactStartCount: 1,
              maxTerrainImpactSpeedMps: 2.8,
              maxTerrainImpulseNs: 500,
              maxPenetrationM: 0.06,
            });
            const terrainResult = runtime.process({
              summary: terrainSummary,
              scenarioRunId: 1,
              vesselGeneration: 4,
              simulationTimeSeconds: 1,
              effectiveMassKg: 1_000,
              forwardWaterRelativeSpeedMps: 4,
              vessel: trawler,
              condition: terrainEffects.condition,
              flooding: terrainEffects.flooding,
              telemetry: collisionTelemetry,
              random: terrainEffects.random,
              audio: terrainEffects.audio,
            });
            assert.equal(collisionTelemetry.collisionSequence, 2);
            assert.equal(collisionTelemetry.terrainCollisionSequence, 1);
            assert.equal(collisionTelemetry.debugProbeCollisionSequence, 1);
            assert.equal(collisionTelemetry.collisionMaxImpactSpeed, 2.8);
            assert.equal(collisionTelemetry.collisionMaxImpulse, 500);
            assert.equal(collisionTelemetry.collisionMaxPenetration, 0.06);
            assert.equal(terrainResult.terrainImpact?.compartmentId, 'bow');
            assert.equal(terrainEffects.damageEvents[0].source, 'terrain-impact');
            assert.equal(terrainEffects.breaches[0].compartmentId, 'bow');
            assert.deepEqual(terrainEffects.audioEvents[0], {
              severity: 2.8,
              kind: 'terrain',
            });

            const suppressed = runtime.process({
              summary: terrainSummary,
              scenarioRunId: 1,
              vesselGeneration: 4,
              simulationTimeSeconds: 1.1,
              effectiveMassKg: 1_000,
              forwardWaterRelativeSpeedMps: 4,
              vessel: trawler,
              condition: terrainEffects.condition,
              flooding: terrainEffects.flooding,
              telemetry: collisionTelemetry,
              random: terrainEffects.random,
              audio: terrainEffects.audio,
            });
            assert.equal(
              suppressed.terrainImpact,
              null,
              'Repeated terrain response inside the cooldown must be suppressed.',
            );
            assert.equal(terrainEffects.damageEvents.length, 1);

            const generationReset = runtime.process({
              summary: terrainSummary,
              scenarioRunId: 1,
              vesselGeneration: 5,
              simulationTimeSeconds: 1.1,
              effectiveMassKg: 1_000,
              forwardWaterRelativeSpeedMps: -2,
              vessel: trawler,
              condition: terrainEffects.condition,
              flooding: terrainEffects.flooding,
              telemetry: collisionTelemetry,
              random: terrainEffects.random,
              audio: terrainEffects.audio,
            });
            assert.equal(
              generationReset.terrainImpact?.compartmentId,
              'machinery',
              'Recovery generation changes must reset cooldown identity.',
            );

            const obstacleRuntime = new VesselCollisionRuntime();
            const obstacleTelemetry = telemetry();
            obstacleRuntime.reset(obstacleTelemetry);
            const obstacleEffects = effects([0.25]);
            const obstacleResult = obstacleRuntime.process({
              summary: emptySummary({
                contactStartCount: 1,
                obstacleContactStartCount: 1,
                maxObstacleImpactSpeedMps: 3.2,
                maxObstacleImpulseNs: 1_500,
                maxObstacleHeadOnFactor: 0.2,
              }),
              scenarioRunId: 2,
              vesselGeneration: 1,
              simulationTimeSeconds: 3,
              effectiveMassKg: 1_000,
              forwardWaterRelativeSpeedMps: 6,
              vessel: speedboat,
              condition: obstacleEffects.condition,
              flooding: obstacleEffects.flooding,
              telemetry: obstacleTelemetry,
              random: obstacleEffects.random,
              audio: obstacleEffects.audio,
            });
            assert.equal(
              obstacleResult.obstacleImpact?.compartmentId,
              'cockpit-port',
            );
            assert.equal(
              obstacleEffects.damageEvents[0].source,
              'obstacle-impact',
            );
            assert.ok(obstacleEffects.damageEvents[0].rudderDamage > 0);
            assert.equal(
              obstacleEffects.breaches[0].compartmentId,
              'cockpit-port',
            );
            assert.deepEqual(obstacleEffects.audioEvents[0], {
              severity: 3.2,
              kind: 'obstacle',
            });
            assert.equal(
              VESSEL_COLLISION_RESPONSE_POLICY.terrainImpactThresholdMps,
              1.8,
            );
            assert.equal(
              VESSEL_COLLISION_RESPONSE_POLICY.obstacleImpactThresholdMps,
              0.65,
            );

            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const runtimeSource = await fs.readFile(
              new URL(
                '../sim/collision/VesselCollisionRuntime.ts',
                import.meta.url,
              ),
              'utf8',
            );

            assert.match(boatSource, /new VesselCollisionRuntime\(\)/);
            assert.match(
              boatSource,
              /collisionRuntime\.current\.process\(\{/,
              'Boat must delegate post-solve collision effects.',
            );
            assert.doesNotMatch(boatSource, /lastTerrainImpactTime/);
            assert.doesNotMatch(boatSource, /lastObstacleImpactTime/);
            assert.doesNotMatch(
              boatSource,
              /sharedPhysics\.collisionSequence \+=/,
              'Boat must not own gameplay collision counters.',
            );
            assert.doesNotMatch(
              boatSource,
              /const terrainImpact = collisionSummary/,
              'Boat must not own terrain impact formulas.',
            );
            assert.match(runtimeSource, /source: 'terrain-impact'/);
            assert.match(runtimeSource, /source: 'obstacle-impact'/);
            assert.match(runtimeSource, /registerBreach\(/);
            assert.match(runtimeSource, /playImpact\(/);
            assert.match(runtimeSource, /summary\.contactStartCount/);

            console.log('Vessel collision runtime contract passed.');
          ''').lstrip()
          write(
              'scripts/vessel-collision-runtime-contract.mjs',
              collision_contract,
          )

          replace_once(
              'components/Boat.tsx',
              "import { RapierCollisionWorld } from '@/sim/collision/RapierCollisionWorld';\n",
              "import { RapierCollisionWorld } from '@/sim/collision/RapierCollisionWorld';\nimport { VesselCollisionRuntime } from '@/sim/collision/VesselCollisionRuntime';\n",
          )
          replace_once(
              'components/Boat.tsx',
              "  const rapierCollisionWorld = useRef<RapierCollisionWorld | null>(null);\n  const collisionTestEnabled = useRef(false);\n  const repairTestEnabled = useRef(false);\n  const lastTerrainImpactTime = useRef(Number.NEGATIVE_INFINITY);\n  const lastObstacleImpactTime = useRef(Number.NEGATIVE_INFINITY);\n",
              "  const rapierCollisionWorld = useRef<RapierCollisionWorld | null>(null);\n  const collisionRuntime = useRef(new VesselCollisionRuntime());\n  const collisionTestEnabled = useRef(false);\n  const repairTestEnabled = useRef(false);\n",
          )
          replace_once(
              'components/Boat.tsx',
              "    sharedPhysics.collisionReady = 0;\n    sharedPhysics.collisionSequence = 0;\n    sharedPhysics.terrainCollisionSequence = 0;\n    sharedPhysics.obstacleCollisionSequence = 0;\n    sharedPhysics.debugProbeCollisionSequence = 0;\n    sharedPhysics.collisionMaxImpactSpeed = 0;\n    sharedPhysics.collisionMaxImpulse = 0;\n    sharedPhysics.collisionMaxPenetration = 0;\n",
              "    collisionRuntime.current.reset(sharedPhysics);\n",
          )
          replace_once(
              'components/Boat.tsx',
              "        rapierCollisionWorld.current = collisionWorld;\n        sharedPhysics.collisionReady = 1;\n",
              "        rapierCollisionWorld.current = collisionWorld;\n        collisionRuntime.current.setReady(sharedPhysics, true);\n",
          )
          replace_once(
              'components/Boat.tsx',
              "      rapierCollisionWorld.current = null;\n      sharedPhysics.collisionReady = 0;\n",
              "      rapierCollisionWorld.current = null;\n      collisionRuntime.current.setReady(sharedPhysics, false);\n",
          )

          replace_section(
              'components/Boat.tsx',
              "    if (collisionSummary) {\n      sharedPhysics.collisionReady = 1;",
              "\n\n    forwardDir.set(0, 0, -1).applyQuaternion(body.quaternion);",
              dedent(r'''
                if (collisionSummary) {
                  collisionRuntime.current.process({
                    summary: collisionSummary,
                    scenarioRunId,
                    vesselGeneration: resetVesselTrigger,
                    simulationTimeSeconds: time,
                    effectiveMassKg: mass,
                    forwardWaterRelativeSpeedMps: vRelForward,
                    vessel,
                    condition: conditionRuntime.current,
                    flooding: floodingModel.current,
                    telemetry: sharedPhysics,
                    random: simulationRandom.current,
                    audio,
                  });
                }
              ''').rstrip(),
          )

          damage_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              applyVesselDamage,
              NORMAL_OPERATION_DAMAGE_POLICY,
              VESSEL_DAMAGE_SOURCE_LABELS,
            } from '../sim/vessels/VesselDamagePolicy.ts';

            const pristine = {
              hullHealth: 100,
              engineHealth: 100,
              rudderHealth: 100,
            };

            assert.deepEqual(
              applyVesselDamage(pristine, {
                source: 'terrain-impact',
                hullDamage: 12,
                engineDamage: 3,
                rudderDamage: 4,
              }),
              {
                hullHealth: 88,
                engineHealth: 97,
                rudderHealth: 96,
              },
              'Explicit damage must affect only the declared health channels.',
            );

            assert.deepEqual(
              applyVesselDamage(pristine, {
                source: 'obstacle-impact',
                hullDamage: 500,
                engineDamage: Number.POSITIVE_INFINITY,
                rudderDamage: -8,
              }),
              {
                hullHealth: 0,
                engineHealth: 100,
                rudderHealth: 100,
              },
              'Damage must clamp health and ignore invalid or negative values.',
            );

            assert.equal(
              NORMAL_OPERATION_DAMAGE_POLICY.sustainedPlaningHullDamagePerSecond,
              0,
            );
            assert.equal(
              NORMAL_OPERATION_DAMAGE_POLICY.hydrodynamicRudderWearPerSecond,
              0,
            );
            assert.deepEqual(
              Object.keys(VESSEL_DAMAGE_SOURCE_LABELS).sort(),
              [
                'engine-overheat',
                'environmental-impact',
                'machinery-flooding',
                'obstacle-impact',
                'slamming',
                'terrain-impact',
              ],
              'Every allowed health-loss source must be explicit and named.',
            );

            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const conditionRuntimeSource = await fs.readFile(
              new URL(
                '../sim/vessels/VesselConditionRuntime.ts',
                import.meta.url,
              ),
              'utf8',
            );
            const collisionRuntimeSource = await fs.readFile(
              new URL(
                '../sim/collision/VesselCollisionRuntime.ts',
                import.meta.url,
              ),
              'utf8',
            );
            const integratedDamageSource =
              `${boatSource}\n${conditionRuntimeSource}\n${collisionRuntimeSource}`;

            assert.match(
              conditionRuntimeSource,
              /applyVesselDamage/,
              'Condition health loss must route through the explicit damage policy.',
            );
            assert.doesNotMatch(
              boatSource,
              /applyVesselDamage/,
              'The React vessel component must delegate condition mutation.',
            );
            for (const source of Object.keys(VESSEL_DAMAGE_SOURCE_LABELS)) {
              assert.match(
                integratedDamageSource,
                new RegExp(`source: '${source}'`),
                `The integrated vessel runtime must retain the explicit ${source} damage path.`,
              );
            }

            assert.doesNotMatch(
              boatSource,
              /activePlaningSpeedRatio\s*>\s*0\.8[\s\S]{0,260}(?:hullHealth\.current|conditionRuntime\.current\.hullHealth)\s*-/,
              'Designed planing operation must not passively consume hull health.',
            );
            assert.doesNotMatch(
              boatSource,
              /rudderLoadRatio/,
              'Ordinary hydrodynamic rudder load must not passively consume rudder health.',
            );
            assert.doesNotMatch(
              boatSource,
              /normalizedSurgeSpeed/,
              'The removed passive rudder-wear calculation must not remain dead code.',
            );
            assert.doesNotMatch(
              integratedDamageSource,
              /(?:hullHealth|engineHealth|rudderHealth)(?:\.current|Value)?\s*=\s*Math\.max\(\s*0,\s*(?:hullHealth|engineHealth|rudderHealth)(?:\.current|Value)?\s*-/,
              'Direct health subtraction must not bypass the damage policy.',
            );

            console.log('Vessel damage policy contract passed.');
          ''').lstrip()
          write(
              'scripts/vessel-damage-policy-contract.mjs',
              damage_contract,
          )

          lifecycle_contract = dedent(r'''
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import {
              CollisionContactLifecycle,
            } from '../sim/collision/CollisionContactLifecycle.ts';

            const STEP_SECONDS = 1 / 60;
            const lifecycle = new CollisionContactLifecycle(0.12);
            const terrainBow = {
              pairKey: 'vessel-bow:terrain',
              externalKey: 'terrain',
              kind: 'terrain',
            };
            const terrainCenter = {
              pairKey: 'vessel-center:terrain',
              externalKey: 'terrain',
              kind: 'terrain',
            };

            let summary = lifecycle.advance(
              [terrainBow, terrainBow, terrainCenter],
              STEP_SECONDS,
            );
            assert.equal(
              summary.contactStartCount,
              1,
              'Compound hull pieces touching one terrain collider must emit one start.',
            );
            assert.equal(summary.terrainContactStartCount, 1);
            assert.equal(summary.obstacleContactStartCount, 0);
            assert.equal(summary.activeContactPairCount, 2);
            assert.equal(summary.activeExternalContactCount, 1);

            for (let step = 0; step < 180; step += 1) {
              summary = lifecycle.advance(
                [terrainBow, terrainCenter],
                STEP_SECONDS,
              );
              assert.equal(
                summary.contactStartCount,
                0,
                'A sustained grounding must not emit per-step collision starts.',
              );
            }

            summary = lifecycle.advance([terrainCenter], STEP_SECONDS);
            assert.equal(
              summary.contactStartCount,
              0,
              'Moving a contact between compound hull pieces must remain one event.',
            );
            assert.equal(summary.activeExternalContactCount, 1);

            summary = lifecycle.advance([], 0.05);
            assert.equal(summary.contactEndCount, 0);
            assert.equal(summary.activeExternalContactCount, 0);

            summary = lifecycle.advance([terrainBow], 0.04);
            assert.equal(
              summary.contactStartCount,
              0,
              'A brief solver dropout inside the release grace must not re-score.',
            );
            assert.equal(summary.activeExternalContactCount, 1);

            summary = lifecycle.advance([], 0.07);
            assert.equal(summary.contactEndCount, 0);
            summary = lifecycle.advance([], 0.06);
            assert.equal(
              summary.contactEndCount,
              1,
              'A contact must end after sustained separation.',
            );

            summary = lifecycle.advance([terrainBow], STEP_SECONDS);
            assert.equal(
              summary.contactStartCount,
              1,
              'A new impact after full separation must emit a new event.',
            );

            const classified = new CollisionContactLifecycle();
            summary = classified.advance(
              [
                {
                  pairKey: 'vessel-bow:probe',
                  externalKey: 'probe',
                  kind: 'obstacle',
                  debugProbe: true,
                },
                {
                  pairKey: 'vessel-center:fixture',
                  externalKey: 'fixture',
                  kind: 'obstacle',
                  fixture: true,
                },
              ],
              STEP_SECONDS,
            );
            assert.equal(summary.contactStartCount, 2);
            assert.equal(summary.obstacleContactStartCount, 2);
            assert.equal(summary.debugProbeContactStartCount, 1);
            assert.equal(summary.fixtureContactStartCount, 1);

            classified.reset();
            summary = classified.advance(
              [
                {
                  pairKey: 'vessel-bow:probe',
                  externalKey: 'probe',
                  kind: 'obstacle',
                  debugProbe: true,
                },
              ],
              STEP_SECONDS,
            );
            assert.equal(
              summary.contactStartCount,
              1,
              'Resetting a vessel generation must reset contact identity.',
            );

            const rapierSource = await fs.readFile(
              new URL(
                '../sim/collision/RapierCollisionWorld.ts',
                import.meta.url,
              ),
              'utf8',
            );
            const boatSource = await fs.readFile(
              new URL('../components/Boat.tsx', import.meta.url),
              'utf8',
            );
            const collisionRuntimeSource = await fs.readFile(
              new URL(
                '../sim/collision/VesselCollisionRuntime.ts',
                import.meta.url,
              ),
              'utf8',
            );
            const calibrationSource = await fs.readFile(
              new URL(
                '../sim/calibration/CollisionCalibration.ts',
                import.meta.url,
              ),
              'utf8',
            );

            assert.match(
              rapierSource,
              /new CollisionContactLifecycle\(\)/,
              'Rapier must own one lifecycle tracker per collision world.',
            );
            assert.match(
              rapierSource,
              /contactLifecycle\.advance\(\s*activeContactPairs,/,
              'Rapier contact pairs must feed the lifecycle tracker every step.',
            );
            assert.match(
              collisionRuntimeSource,
              /summary\.contactStartCount/,
              'Gameplay sequences must consume contact-start events.',
            );
            assert.match(
              boatSource,
              /collisionRuntime\.current\.process\(\{/,
              'Boat must delegate lifecycle consumption to collision runtime.',
            );
            assert.doesNotMatch(
              `${boatSource}\n${collisionRuntimeSource}`,
              /collisionSequence \+= (?:collisionSummary|summary)\.contactCount/,
              'Gameplay scoring must not accumulate raw contact points.',
            );
            assert.match(
              calibrationSource,
              /collisionEventRecorded:/,
              'Browser collision calibration must verify lifecycle integration.',
            );

            console.log('Collision contact lifecycle contract passed.');
          ''').lstrip()
          write(
              'scripts/collision-contact-lifecycle-contract.mjs',
              lifecycle_contract,
          )

          replace_once(
              'package.json',
              '    "test:collision-lifecycle": "node --experimental-strip-types --no-warnings scripts/collision-contact-lifecycle-contract.mjs",\n',
              '    "test:collision-lifecycle": "node --experimental-strip-types --no-warnings scripts/collision-contact-lifecycle-contract.mjs",\n    "test:collision-runtime": "node --experimental-strip-types --no-warnings scripts/vessel-collision-runtime-contract.mjs",\n',
          )
          replace_once(
              'package.json',
              'npm run test:collision-lifecycle && npm run test:mission-runtime',
              'npm run test:collision-lifecycle && npm run test:collision-runtime && npm run test:mission-runtime',
          )
          replace_once(
              'SIMULATOR_STABILIZATION_PLAN.md',
              '      - [ ] Extract collision response and impact orchestration.\n',
              '      - [x] Extract Rapier contact-summary response, impact damage, breach selection, collision telemetry, and impact-audio orchestration into `VesselCollisionRuntime`.\n',
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extracted architecture
        run: npm run validate

      - name: Commit validated extraction
        shell: bash
        run: |
          rm -f .github/workflows/extract-vessel-collision-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: extract vessel collision runtime"
          git push origin HEAD:agent/simulator-stabilization
