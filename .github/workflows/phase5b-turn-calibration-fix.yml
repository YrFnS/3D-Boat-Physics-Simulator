name: Apply Phase 5B turn calibration correction

on:
  push:
    branches:
      - agent/phase-5b-water-hydrostatics
    paths:
      - '.github/workflows/phase5b-turn-calibration-fix.yml'

permissions:
  contents: write

concurrency:
  group: phase5b-turn-calibration-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    name: Validate and publish representative turn entry
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Phase 5B branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5b-water-hydrostatics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply minimal speedboat turn-entry correction
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('sim/calibration/VesselCalibration.ts')
          source = path.read_text(encoding='utf-8')
          old = """      const approachThrottle =
                  this.request.vessel === 'speedboat' ? 0.24 : 0.82;
          """
          new = """      // Sectional hydrostatics and added-mass damping require a slightly
                // higher representative approach to enter the unchanged speed envelope.
                const approachThrottle =
                  this.request.vessel === 'speedboat' ? 0.25 : 0.82;
          """
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one Phase 5B turn-entry fixture.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run physics correctness regression tests
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/calibration/VesselCalibration.ts
          git commit -m 'calibration: restore representative Phase 5B turn entry'
          git push origin HEAD:agent/phase-5b-water-hydrostatics
