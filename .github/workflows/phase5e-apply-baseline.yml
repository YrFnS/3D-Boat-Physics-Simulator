name: Apply Phase 5E reference baseline

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5e-apply-baseline.yml'
      - 'scripts/.phase5e-baseline.patch.gz.b64'
  push:
    branches:
      - agent/phase-5e-physical-calibration
    paths:
      - '.github/workflows/phase5e-apply-baseline.yml'

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: phase5e-reference-baseline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5e-physical-calibration')
    name: Apply, validate, and publish reference baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 5E branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5e-physical-calibration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply verified baseline patch
        run: |
          echo '1e9d201d680b60c2cdcbe7db17edd25cdf448f2614b1eb4943d21d98ff86b26c  scripts/.phase5e-baseline.patch.gz.b64' | sha256sum --check
          base64 --decode scripts/.phase5e-baseline.patch.gz.b64 > "$RUNNER_TEMP/phase5e-baseline.patch.gz"
          echo '0a7be5a5e54a8188bc71621cae2179b82556fdfc569d3b3ab76de1487ac4c5af  '"$RUNNER_TEMP/phase5e-baseline.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5e-baseline.patch.gz" > "$RUNNER_TEMP/phase5e-baseline.patch"
          echo '4898b9cdda8cea6048184bad824d74f4dfbdeb5f13ccb44bdb46822d13705229  '"$RUNNER_TEMP/phase5e-baseline.patch" | sha256sum --check
          git apply -p1 --check "$RUNNER_TEMP/phase5e-baseline.patch"
          git apply -p1 "$RUNNER_TEMP/phase5e-baseline.patch"
          git diff --check

      - name: Remove one-use transfer tooling
        run: |
          rm -f scripts/.phase5e-baseline.patch.gz.b64
          rm -f .github/workflows/phase5e-apply-baseline.yml

      - name: Install dependencies
        run: npm ci

      - name: Run marine, collision, and reference regressions
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify reference report and source hygiene
        run: |
          test -s artifacts/physical-reference/report.json
          grep -q '"status": "retuning-required"' artifacts/physical-reference/report.json
          grep -q 'nordhavn-41' artifacts/physical-reference/report.json
          grep -q 'axopar-22-spyder' artifacts/physical-reference/report.json
          git diff --check

      - name: Commit and push validated baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'physics: add independent vessel reference baseline'
          git push origin HEAD:agent/phase-5e-physical-calibration
