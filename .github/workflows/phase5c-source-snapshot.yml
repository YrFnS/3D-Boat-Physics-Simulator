name: Phase 5C source snapshot

on:
  push:
    branches:
      - agent/phase-5c-propulsion-maneuvering
    paths:
      - '.github/workflows/phase5c-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    name: Package exact Phase 5C source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5c-propulsion-maneuvering

      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/phase5c-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-source-snapshot
          path: ${{ runner.temp }}/phase5c-source.tar.gz
          include-hidden-files: true
          retention-days: 1
