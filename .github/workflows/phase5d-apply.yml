name: Apply Phase 5D collision authority

on:
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-apply.yml'

permissions:
  contents: write

env:
  CI: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: phase5d-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    name: Apply, validate, and publish dynamic collision authority
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply verified Phase 5D patch
        run: |
          cat scripts/.phase5d-patch/part-* > "$RUNNER_TEMP/phase5d.patch.gz.b64"
          echo '743de2fbc30dbddd59ef3fe0220c76939fb8e44852d5f28c2a305aceecba2791  '"$RUNNER_TEMP/phase5d.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/phase5d.patch.gz.b64" > "$RUNNER_TEMP/phase5d.patch.gz"
          echo '14c6a4f34bcebc0e9de7c7c746b5ea97ef36452a863a306d02484a77f1862732  '"$RUNNER_TEMP/phase5d.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5d.patch.gz" > "$RUNNER_TEMP/phase5d.patch"
          echo '6efcf83c4ae514fb896b9d43b17ed1de7cc6f3fc39e039ae9f1f3c444a068b79  '"$RUNNER_TEMP/phase5d.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/phase5d.patch"
          git apply "$RUNNER_TEMP/phase5d.patch"
          git diff --check

      - name: Remove one-use transfer tooling
        run: |
          rm -rf scripts/.phase5d-patch
          rm -f .github/workflows/phase5d-apply.yml
          rm -f .github/workflows/phase5d-source-snapshot.yml

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic physics regressions
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify final patch hygiene
        run: git diff --check

      - name: Commit and push validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'physics: make Rapier authoritative for contacts'
          git push origin HEAD:agent/phase-5d-collision-authority
