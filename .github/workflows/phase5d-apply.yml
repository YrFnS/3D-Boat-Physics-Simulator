name: Apply Phase 5D collision authority

on:
  pull_request:
    branches:
      - agent/phase-4-release-validation
    paths:
      - '.github/workflows/phase5d-apply.yml'
      - 'scripts/.phase5d-implementation.patch.b64'
  push:
    branches:
      - agent/phase-5d-collision-authority
    paths:
      - '.github/workflows/phase5d-apply.yml'
      - 'scripts/.phase5d-implementation.patch.b64'

permissions:
  contents: write

concurrency:
  group: phase5d-apply-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase-5d-collision-authority')
    name: Apply, validate, and publish dynamic collision authority
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Phase 5D branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5d-collision-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply verified implementation
        run: |
          echo '46f4c74a8bdf038e92e7f52dcbca58a1b2d473080f80e36b0cce12ba234d8c82  scripts/.phase5d-implementation.patch.b64' | sha256sum --check
          base64 --decode scripts/.phase5d-implementation.patch.b64 > "$RUNNER_TEMP/phase5d-implementation.patch.gz"
          echo '6fd95b0b3305de274ac796b454ef83305a35c23182ea9507a5490fddfe56faec  '"$RUNNER_TEMP/phase5d-implementation.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/phase5d-implementation.patch.gz" > "$RUNNER_TEMP/phase5d-implementation.patch"
          echo '80ab952e0f17fa9e5daa2619b9b0d9fdaecd6f648f8ef2c94ffb99ac6b1734ea  '"$RUNNER_TEMP/phase5d-implementation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/phase5d-implementation.patch"
          git apply "$RUNNER_TEMP/phase5d-implementation.patch"
          git diff --check

      - name: Remove one-use transfer tooling
        run: |
          rm -f scripts/.phase5d-implementation.patch.b64
          rm -f .github/workflows/phase5d-source-snapshot.yml
          rm -f .github/workflows/phase5d-apply.yml

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic physics correctness
        run: npm run test:physics

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Dependency audit
        run: npm run audit

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'physics: make Rapier authoritative for collision response'
          git push origin HEAD:agent/phase-5d-collision-authority
